/* 真账号（服务器开了 FUBI_AUTH）：邮箱 + 密码；注册要邀请码；忘记密码发验证码到邮箱 */
function authPageSrv(tab='login'){
  const reg=tab==='reg', fg=tab==='forgot';
  const field=(id,label,type,extra='')=>`<label class="fld"><span>${label}</span><input id="${id}" type="${type}" ${extra}></label>`;
  const title=fg?'<p class="autag">请输入注册时使用的邮箱，系统将向该邮箱发送验证码。</p>':'<p class="autag">不是帮你读完，是让你想读下去。</p>';
  showPage(flowHTML(1,2,`<div class="auth">
    <div class="authbrand"><div class="aumark">${LOGO}<b>伏笔</b></div>${title}</div>
    <div class="auform">
    ${field('auAcc','邮箱','email','autocomplete="username" inputmode="email"')}
    ${fg?`<div id="auStep2" hidden>${field('auCode','邮箱验证码','text','inputmode="numeric" autocomplete="one-time-code" maxlength="6"')}${field('auPw','新密码','password','autocomplete="new-password" placeholder="8～64 位，须同时包含字母和数字"')}<p class="auswitch"><button type="button" class="linkbtn" id="auResend" disabled>重新发送验证码</button></p></div>`
        :`${field('auPw','密码','password',`autocomplete="${reg?'new-password':'current-password'}" ${reg?'placeholder="8～64 位，须同时包含字母和数字"':''}`)}${reg?field('auInv','邀请码','text','autocomplete="off" autocapitalize="characters" placeholder="请输入邀请码"'):''}`}
    ${fg?'':`<label class="agree"><input type="checkbox" id="auAgree" ${AGREED_NOW?'checked':''}><span>我已阅读并同意<button type="button" class="linkbtn" data-doc="terms">《用户协议》</button>和<button type="button" class="linkbtn" data-doc="privacy">《隐私政策》</button></span></label>`}
    <p class="aumsg" id="auMsg" role="alert"></p>
    <button class="btn wide" id="auGo">${fg?'发送验证码':reg?'注册':'登录'}</button>
    <p class="auswitch">${fg?'<button class="linkbtn" data-t="login">返回登录</button>':reg?'<button class="linkbtn" data-t="login">已有账号，前往登录</button>':'<button class="linkbtn" data-t="reg">注册新账号</button><span class="dot">·</span><button class="linkbtn" data-t="forgot">忘记密码</button>'}</p>
    </div></div>`,true));
  document.querySelectorAll('.auswitch [data-t]').forEach(x=>x.onclick=()=>authPageSrv(x.dataset.t));
  $('#flBack')?.addEventListener('click',()=>{ AFTER_LOGIN=null; AFTER_T=''; homePage(); });
  const msg=(t,ok)=>{ const m=$('#auMsg'); m.textContent=t||''; m.style.color=ok?'var(--ink2)':''; }, busy=(on)=>{ $('#auGo').disabled=on; };
  const after=()=>{ /* 登录成功：刷新页面，让服务器按账号给出书和阅读记录；想回到的动作靠 sessionStorage 带过去 */
    try{ sessionStorage.setItem('fubi_after',JSON.stringify({t:Date.now(),hint:AFTER_T})); }catch(e){} location.reload(); };
  let step=1, tm=null;
  /* 重新发送：每次发出后倒计时 60 秒才能再点；服务端另有限流（每小时 3 次） */
  const cd=(n)=>{ clearInterval(tm); let k=n; const set=()=>{ const b=$('#auResend'); if(!b){ clearInterval(tm); return; } b.disabled=k>0; b.textContent=k>0?`重新发送（${k} 秒）`:'重新发送验证码'; }; set(); if(n>0) tm=setInterval(()=>{ k--; set(); if(k<=0) clearInterval(tm); },1000); };
  if(fg) $('#auResend').onclick=async()=>{ const email=$('#auAcc').value.trim(); msg(''); if(!email){ $('#auAcc').focus(); return msg('请输入邮箱'); }
    $('#auResend').disabled=true; const r=await api('/api/auth/forgot',{email});
    if(!r.ok){ cd(0); return msg(r.error||'发送失败，请稍后重试'); } cd(60); toast('验证码已重新发送，请前往邮箱查看'); };
  document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{ AGREED_NOW=!!$('#auAgree')?.checked; const keep={e:$('#auAcc').value,t:tab}; policyPage(b.dataset.doc,()=>{ authPageSrv(keep.t); $('#auAcc').value=keep.e; }); });
  $('#auAgree')?.addEventListener('change',e=>{ AGREED_NOW=e.target.checked; msg(''); });
  /* 点登录/注册时没勾同意：弹窗确认，点"同意并继续"后自动勾选并接着提交；点取消回到页面，什么也不做 */
  const go=async()=>{ const email=$('#auAcc').value.trim(); msg(''); if(!email){ $('#auAcc').focus(); return msg('请输入邮箱'); }
    if(!fg&&!reg&&!$('#auPw').value){ $('#auPw').focus(); return msg('请输入密码'); }
    if(!fg&&reg&&(!$('#auPw').value||!$('#auInv').value.trim())){ const x=!$('#auPw').value?'#auPw':'#auInv'; $(x).focus(); return msg(x==='#auPw'?'请输入密码':'请输入邀请码'); }
    if(!fg&&!$('#auAgree').checked){
      return confirmSheet('用户协议与隐私政策','继续使用前，请阅读并同意<button type="button" class="linkbtn" id="cfDoc1">《用户协议》</button>和<button type="button" class="linkbtn" id="cfDoc2">《隐私政策》</button>。','同意并继续',()=>{ $('#auAgree').checked=true; AGREED_NOW=true; go(); });
    }
    busy(true);

const dayOn=d=>!!d&&(d.n>0||d.ms>=60e3);
function streak(){ const d=new Date(); if(!dayOn(PROF.days[dayKey(d)])) d.setDate(d.getDate()-1); let n=0; while(dayOn(PROF.days[dayKey(d)])){ n++; d.setDate(d.getDate()-1); } return n; }
const WD='一二三四五六日';
function weekDays(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return [...Array(7)].map((_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return x; }); }
function dayCell(x,withMin){ const k=dayKey(x), r=PROF.days[k], on=dayOn(r), t=k===dayKey(), fut=x>new Date();
  return `<span class="d ${on?'on':''} ${t?'today':''} ${fut?'fut':''}" aria-label="${x.getMonth()+1} 月 ${x.getDate()} 日${on?'，读过':''}${r&&r.sv?`，揭晓 ${r.sv} 处伏笔`:''}"><i>${x.getDate()}</i>${r&&r.sv?'<em class="sv"></em>':''}${withMin?`<small>${on&&r.ms>=6e4?Math.round(r.ms/6e4)+' 分':''}</small>`:''}</span>`; }
function calHTML(off){
  /* v9.65（用户 10-30）：周视图和月视图用同一套格子（同高、同圆角、同底色、都显示当天分钟数），展开只是多几行 */
  const now=new Date(), m=new Date(now.getFullYear(),now.getMonth()+off,1), y=m.getFullYear(), mo=m.getMonth(), nd=new Date(y,mo+1,0).getDate(), lead=(m.getDay()+6)%7;
  let cells=WD.split('').map(x=>`<span class="wd">${x}</span>`).join('')+'<span></span>'.repeat(lead), days=0;
  for(let d=1;d<=nd;d++){ const x=new Date(y,mo,d); if(dayOn(PROF.days[dayKey(x)])) days++; cells+=dayCell(x,true); }
  /* 年份：从最早有记录（或注册）的那年到今年 */
  const ks=Object.keys(PROF.days).map(k=>+k.split('-')[0]), u=curUser(), y0=Math.min(now.getFullYear(),...ks,u?new Date(u.t).getFullYear():now.getFullYear());
  const ys=[]; for(let i=y0;i<=now.getFullYear();i++) ys.push(i);

  return `<div class="calh"><button id="calP" aria-label="上个月">‹</button><span class="calsel"><select id="calY" aria-label="年份">${ys.map(v=>`<option value="${v}" ${v===y?'selected':''}>${v} 年</option>`).join('')}</select><select id="calM" aria-label="月份">${ms.map(v=>`<option value="${v}" ${v===mo?'selected':''}>${v+1} 月</option>`).join('')}</select></span><button id="calN" aria-label="下个月" ${off>=0?'disabled':''}>›</button></div><div class="cal mo">${cells}</div><p class="calsum">这个月读了 ${days} 天</p>`;

/* 意见反馈：文字（必填，最多 2000 字）+ 图片（选填，最多 3 张，每张 ≤ 3 MB，PNG/JPEG/WebP/GIF）。
   图片先逐张上传换临时编号，提交时一起带上。需要登录；后台"反馈"一栏里看。 */
const FB_MAX_IMG=3, FB_MAX_BYTES=3*1024*1024;
let fbDraft={text:'',imgs:[]};   /* 离开页面再回来，草稿还在；提交成功后清空 */
function feedbackPage(){
  const d=fbDraft;
  showPage(pageHTML('意见反馈','我的',`<div class="fbpg">
    <p class="implead">使用中遇到的问题、不顺手的地方或建议，都可以写在这里。</p>
    <section class="mebox">
      <label class="fld"><span>反馈内容</span><textarea id="fbText" maxlength="2000" placeholder="请描述遇到的情况">${esc(d.text)}</textarea></label>
      <div class="fld"><span>图片<em>选填，最多 ${FB_MAX_IMG} 张</em></span><div class="fbimgs" id="fbImgs"></div></div>
      <input type="file" id="fbFile" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      <p class="aumsg" id="fbMsg" role="alert"></p>
      <button class="btn wide" id="fbGo">提交</button>
    </section></div>`),()=>mePage());
  const paint=()=>{
    $('#fbImgs').innerHTML=d.imgs.map((x,i)=>`<div class="fbimg ${x.err?'bad':''}">${x.url?`<img src="${x.url}" alt="">`:''}${x.busy?'<i class="fbwait" aria-label="正在上传"></i>':''}<button type="button" class="fbrm" data-rm="${i}" aria-label="移除这张图片">×</button></div>`).join('')
      +(d.imgs.length<FB_MAX_IMG?`<button type="button" class="fbadd" id="fbAdd" aria-label="添加图片">${ic('plus')}</button>`:'');
    $('#fbAdd')?.addEventListener('click',()=>$('#fbFile').click());
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const x=d.imgs.splice(+b.dataset.rm,1)[0]; if(x&&x.url) URL.revokeObjectURL(x.url); paint(); });
  };
  const msg=t=>{ $('#fbMsg').textContent=t||''; };
  $('#fbText').addEventListener('input',e=>{ d.text=e.target.value; msg(''); });
  $('#fbFile').onchange=async e=>{
    msg(''); const fs=[...e.target.files]; e.target.value='';
    for(const f of fs){
      if(d.imgs.length>=FB_MAX_IMG) break;
      if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type)){ msg('仅支持 PNG、JPEG、WebP、GIF 图片'); continue; }
      if(f.size>FB_MAX_BYTES){ msg('图片不能超过 3 MB'); continue; }
      const x={url:URL.createObjectURL(f),busy:true,id:null}; d.imgs.push(x); paint();
      try{ const r=await fetch('/api/feedback/image',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'上传失败'); x.id=j.id; }
      catch(err){ const i=d.imgs.indexOf(x); if(i>=0) d.imgs.splice(i,1); URL.revokeObjectURL(x.url); msg(err.message||'上传失败，请稍后重试'); }
      x.busy=false; if($('#fbImgs')) paint();
    }
  };
  $('#fbGo').onclick=async()=>{
    const t=d.text.trim(); if(!t){ $('#fbText').focus(); return msg('请填写反馈内容'); }
    if(d.imgs.some(x=>x.busy)) return msg('图片正在上传，请稍候');
    $('#fbGo').disabled=true; msg('');
    const r=await api('/api/feedback',{text:t,page:fbFrom,images:d.imgs.map(x=>x.id).filter(Boolean)});
    $('#fbGo').disabled=false;
    if(!r.ok) return msg(r.error||'提交失败，请稍后重试');
    d.imgs.forEach(x=>x.url&&URL.revokeObjectURL(x.url)); fbDraft={text:'',imgs:[]};
    mePage(); toast('<div class="tq">已提交，感谢反馈</div>',null,3000);
  };
  paint();
}

const COVER_C=['#3B3A52','#5B2A26','#1E2622','#2C3E3A','#4A3B2A','#2A3F55','#4B2E45','#3E4A3A'];
function coverHTML(title,img){
  if(img) return `<div class="cover img"><img src="${img}" alt=""></div>`;
  let h=0; [...title].forEach((c,i)=>h+=c.charCodeAt(0)*(i*3+1));
  const cs=[...title], n=cs.length, v=n<=5, k=Math.ceil(n/2);   /* 题签：5 个字以内一列；更长分两列，右列在前（类名 v / h 沿用） */
  const cols=v?[title]:[cs.slice(0,k).join(''),cs.slice(k).join('')];
  return `<div class="cover gen ${v?'v':'h'}" style="background:${COVER_C[h%COVER_C.length]}"><span class="ct">${cols.map(c=>`<i>${esc(c)}</i>`).join('')}</span></div>`;
}

let findQ='', HOT=null, FOUND=null, findSeq=0;
async function findPage(){
  showPage(pageHTML('找书','书架',`<div class="lib"><form class="libsearch" id="libF"><input id="libQ" type="search" placeholder="搜书名或作者" value="${esc(findQ)}" autocomplete="off" enterkeyhint="search"></form><div id="libList"></div></div>`),()=>shelf());
  $('#libF').onsubmit=e=>{ e.preventDefault(); $('#libQ').blur(); runFind($('#libQ').value); };
  $('#libQ').addEventListener('input',()=>{ if(!$('#libQ').value.trim()){ findQ=''; FOUND=null; paintFind(); } });
  if(findQ&&FOUND) paintFind(); else { FOUND=null; paintFind(); }
  if(!HOT){ try{ HOT=(await (await fetch('/api/hot')).json()).hot; }catch(e){ HOT=[]; } if(!findQ) paintFind(); }
}
async function runFind(q){
  q=q.trim(); if(!q) return; findQ=q; $('#libQ').value=q; const my=++findSeq;
  $('#libList').innerHTML='<div class="libwait" aria-label="正在搜索"><i></i><i></i><i></i></div>';
  try{ const r=await fetch('/api/search?q='+encodeURIComponent(q)); const d=await r.json(); if(my!==findSeq) return; if(!r.ok) throw new Error(d.error||'没搜成'); FOUND=d; }
  catch(e){ if(my!==findSeq) return; FOUND={results:[],builtin:[],errors:[e.message||'暂时搜不了']}; }
  paintFind();
}
function paintFind(){
  const el=$('#libList'); if(!el) return;
  if(!findQ||!FOUND){
    el.innerHTML=HOT&&HOT.length?`<h2 class="libh">热门搜索</h2><div class="hotw">${HOT.map(w=>`<button data-hot="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:'';
    el.querySelectorAll('[data-hot]').forEach(b=>b.onclick=()=>runFind(b.dataset.hot)); return;
  }
  const B=FOUND.builtin||[], R=FOUND.results||[];
  let h='';
  if(B.length) h+=B.map(b=>`<div class="fbook"><b class="ft">${esc(b['书名'])}</b><p class="fi">${esc(b['简介'])}</p><p class="fm">${esc(authorName(b['作者'],b['国籍']||''))} · 精读版（有伏笔、主线和逐段解释）</p><div class="fsrcs"><div class="fsrc"><span>已在书架上</span><button class="btn ghost" data-open="${esc(b['编号'])}">去读</button></div></div></div>`).join('');
  h+=R.map((r,ri)=>{ const L=r['源']||[{'来源':r['来源'],'编号':r['编号'],'名':r['来源名']||r['来源']}];
    const have=(r['_bk']&&ALL[r['_bk']]?[r['_bk']]:null)||SHELF.find(x=>ALL[x[0]]&&ALL[x[0]].meta&&L.some(y=>y['链接']&&ALL[x[0]].meta.link===y['链接']));
    const zhA=r['作者中文']?authorName(r['作者中文'],r['国籍']||''):'', enA=r['作者']&&r['作者']!==r['作者中文']?r['作者']:'';
    const meta=[zhA||enA?esc(zhA||enA)+(r['生卒']?` ${esc(r['生卒'])}`:''):'',esc(r['语言名'])+(r['需翻译']?'，下载后翻译成中文':'')].filter(Boolean).join(' · ');
    const intro=r['简介']||r['摘要']||'';
    const srcs=have?`<div class="fsrc"><span>已在书架上</span><button class="btn ghost" data-open="${esc(have[0])}">去读</button></div>`
      :r['可下载']?(sr=>sr[0]+(sr.length>1?`<details class="fmore"><summary>其他来源（${sr.length-1}）</summary>${sr.slice(1).join('')}</details>`:''))(L.map((x,k)=>`<div class="fsrc"><span>${esc(x['名']||x['来源'])}<small>${esc(x['说明']||'')}</small></span><button class="btn ${k?'ghost':''}" data-dl="${ri}" data-k="${k}">下载</button></div>`))
      :`<p class="libwhy">${esc(r['说明']||'暂时不能下载')}</p>`;
    return `<div class="fbook ${r['可下载']?'':'off'}"><b class="ft">${esc(r['中文名']||r['书名'])}</b>${r['中文名']?`<i class="fo">${esc(r['书名'])}</i>`:''}
      ${intro?`<p class="fi">${esc(intro)}</p>`:''}<p class="fm">${meta}${zhA&&enA?`<br><span class="fen">${esc(enA)}</span>`:''}</p>
      ${r['内容提要']?`<details class="pvsum"><summary>内容提要（英文）</summary><p lang="en">${esc(r['内容提要'])}</p></details>`:''}
      <div class="fsrcs">${!have&&r['可下载']?'<span class="fsh">下载来源</span>':''}${srcs}</div></div>`; }).join('');
  if(!B.length&&!R.length) h=`<p class="libnone">没有找到“${esc(findQ)}”。</p><p class="mini">这里能搜到的是已过版权期的公版书。手里有这本书的文件，可以在书架上点“导入”。</p>`;
  if((FOUND.errors||[]).length) h+=`<p class="mini libwhy">${esc(FOUND.errors.join('，'))}，结果可能不全。</p>`;
  if(R.length) h+=`<p class="mini" style="margin-top:16px">这些都是已过版权期的公版书；下载的书只在你自己的书架上。</p>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ if(ALL[b.dataset.open]) openBook(b.dataset.open); });
  el.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{ const r=R[+b.dataset.dl], k=+b.dataset.k, L=r['源']||[]; downloadBook(r,b,'row',L.length?[L[k],...L.filter((_,i)=>i!==k)]:null); });
}

function wireShelfDrag(own){
  /* v9.71：被拖的书跟着手指走（抬起、略放大、有阴影）；挪到别的书上，其他书滑开让位；松手后滑进新位置 */

  const flip=mut=>{ const sib=books().filter(x=>x!==drag.el), first=new Map(sib.map(x=>[x,x.getBoundingClientRect()]));

    el.addEventListener('pointerdown',e=>{ if(e.button>0) return; const r=el.getBoundingClientRect(); drag={el,x:e.clientX,y:e.clientY,sx:r.left,sy:r.top,dx:0,dy:0,moved:false}; try{ el.setPointerCapture(e.pointerId); }catch(_){} });

      e.preventDefault(); drag.dx=e.clientX-drag.x; drag.dy=e.clientY-drag.y;

      if(over){ const r=over.getBoundingClientRect(), after=v.lay==='grid'?(e.clientX>r.left+r.width/2):(e.clientY>r.top+r.height/2), ref=after?over.nextSibling:over;

/* 点一下 = 打开；按住约半秒 = 详情（电脑上右键也行） */
function longPress(el,tap,hold){
  let tm=null,x0=0,y0=0,fired=false;
  const cancel=()=>{clearTimeout(tm);tm=null;};
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;fired=false;x0=e.clientX;y0=e.clientY;cancel();tm=setTimeout(()=>{fired=true;tm=null;if(navigator.vibrate)navigator.vibrate(10);hold();},480);});
  el.addEventListener('pointermove',e=>{if(tm&&Math.hypot(e.clientX-x0,e.clientY-y0)>10)cancel();});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,cancel));
  el.addEventListener('click',e=>{if(fired){e.preventDefault();fired=false;return;}tap(e);});
  el.addEventListener('contextmenu',e=>{e.preventDefault();if(!fired){cancel();hold();}});
  el.addEventListener('keydown',e=>{if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10')){e.preventDefault();hold();}});
}

/* 折叠起来的文件：里面的段落按文件标题那一行算位置（滑过标题 = 翻过这份文件） */
function topOf(i){ const e=els[i]; if(e.offsetParent!==null||!e.closest) return e.getBoundingClientRect().top; const d=e.closest('.doc.folded'); return d?d.getBoundingClientRect().top:e.getBoundingClientRect().top; }
function docToggle(d,open){ const i=+d.dataset.d; S.docOpen=S.docOpen||{}; if(open) S.docOpen[i]=1; else delete S.docOpen[i]; d.classList.toggle('folded',!open);
  const b=d.querySelector('.dochd'); b.setAttribute('aria-expanded',String(open)); b.querySelector('i').textContent=open?'收起':'展开'; save(); placeMarks(); }
function unfoldFor(i){ const d=els[i]&&els[i].closest('.doc.folded'); if(d) docToggle(d,true); }
/* 阅读位置：屏幕上方 40% 处的那条命题 */
let ticking=false;
function onScroll(){
  if(jumping()){ jumpUntil=Math.max(jumpUntil,Date.now()+250); armNoRead(Math.max(0,jumpUntil-Date.now())); }
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{ticking=false;
    $('#bar')?.classList.toggle('scrolled',scrollY>4); tickRead(); chromeTick(); lastLineTick(); sideTick();
    if($('#selmenu').classList.contains('show')&&!$('#selmenu').classList.contains('after')) placeMenu();
    const line=innerHeight*0.4; let cur=-1;
    for(let i=0;i<els.length;i++){ if(topOf(i)<line) cur=i; else break; }
    /* 滑到底部时，确保最后一条也算读到 */
    if((window.innerHeight+window.scrollY)>=document.body.scrollHeight-20 && els.length) cur=els.length-1;
    if(cur<0 && preEl){let k=-1; preEl.querySelectorAll('.pp').forEach(p=>{if(p.getBoundingClientRect().bottom<line) k=+p.dataset.k;}); if(k>(S.preK??-1)){S.preK=k;save();}}
    /* 伏笔标记按“屏幕上看得到”来亮：命题一露出屏幕（底部导航上方）就亮，不等读到 40% 那条线。
       阅读进度（读到哪、目录、回顾）仍按 40% 那条线算。 */
    const nav=$('.nav'), edge=innerHeight-(nav?nav.offsetHeight:0)-16;
    let vis=cur; for(let i=Math.max(cur,0);i<els.length;i++){ if(topOf(i)<edge) vis=i; else break; }
    let pv=S.preVis??-1; if(preEl) preEl.querySelectorAll('.pp').forEach(p=>{if(p.getBoundingClientRect().top<edge && +p.dataset.k>pv) pv=+p.dataset.k;});
    let more=false;
    if(!jumping()&&vis!==(S.vis??-2)){S.vis=vis;more=true;}
    if(!jumping()&&pv>(S.preVis??-1)){S.preVis=pv;more=true;}
    if(more){paintMarks();save();}
    else if(S.view.guide){ const v=S.vis??-2; if(SUS.some(s=>!S.found[s.id]&&s['提出']!=='前言'&&IDX[s['提出']]===v&&anchorOnScreen(s))) paintMarks(); }
    const ch=cur!==S.current; setPos(cur);
    const inV=j=>j!==undefined&&j>=cur&&j<=(S.vis??-2);
    if(!ch&&cur>=0&&(SUS.some(s=>s['揭晓']&&inV(IDX[s['揭晓']])&&S.seen[s.id]&&!S.doneS[s.id])||S.notes.some(n=>n.type==='q'&&!n.done&&n.rv&&inV(IDX[n.rv])))) checkAnswer(cur);
  });
}
/* 读的时候顶栏和底部导航自动收起：往下滑超过一屏的 1/6 收起；往上滑、回到顶部、滑到书末、点正文时出现。跳转期间不动 */
let chromeY=0;
function chromeTick(){ const a=$('#app'); if(!a) return; const y=scrollY, dy=y-chromeY, bottom=innerHeight+y>=document.body.scrollHeight-40;
  /* 只有触屏设备才收起；电脑（鼠标、触控板）上顶栏和导航一直显示 */
  const web=matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(web||jumping()||y<80||bottom||$('#sheet').classList.contains('show')){ a.classList.remove('calmread'); chromeY=y; return; }
  if(dy>innerHeight/6){ a.classList.add('calmread'); chromeY=y; } else if(dy<-24){ a.classList.remove('calmread'); chromeY=y; } else if(dy<0) chromeY=Math.max(chromeY,y); else if(!a.classList.contains('calmread')) chromeY=Math.min(chromeY,y); }

/* "上次读到这里"：打开书时画在上次的位置上方；往后读过三段就淡出 */
/* 轻度打开书（用户 10-28 定）：回顾不弹卡，放进"上次读到这里"那条线下面——一行"距上次 N 天。上次读到……"，点"展开前情"才看完整回顾 */
function lastLineRecap(gap){

    full=`${secs.length>1?`<p class="llh">${unitName(h.n)}已读部分</p>${secs.map(x=>`<p>${esc(x['写'])}</p>`).join('')}`:''}${prev.length?`<p class="llh">前面几${UNIT}</p>${prev.map(r=>`<p>${esc(r['一句话'])}</p>`).join('')}`:''}`; }

function lastLineTick(){ const l=$('#lastLine'); if(!l||jumping()||l.classList.contains('open')) return; if(S.current>=+l.dataset.i+3){ l.classList.add('gone'); setTimeout(()=>l.remove(),400); } }
/* 跳转（导览、搜索、引用、回到出处、打开书）期间不记"读过"；落定后只记落脚的那一段 */
let lastCur=null, jumpUntil=0;
const jumping=()=>Date.now()<jumpUntil;
function noRead(ms=900){ jumpUntil=Date.now()+ms; lastCur=null; armNoRead(ms); }
function armNoRead(ms){ clearTimeout(noRead.t); noRead.t=setTimeout(()=>{ jumpUntil=0; lastCur=null; onScroll(); },ms+40); }
function setPos(cur){
  const changed=cur!==S.current; S.current=cur;
  if(cur>=0&&!jumping()){
    const cont=lastCur!=null, a=cont?Math.min(lastCur,cur):cur, b=cont?Math.max(lastCur,cur):cur;
    if(markRd(a,b)) paintMarks();
    /* 一路读到最后一段 = 读完（跳到结尾不算） */
    if(cont&&b===P.length-1&&!S.finished){
      /* 读完 = 全书每一段都算读过。滚动很快、或中途刷新/跳转后 lastCur 被重置，中间的段不会被补上，进度会停在 86% 这样的数；读完时一次补满，百分比才和"已读完"一致 */
      markRd(0,P.length-1); S.finished=Date.now(); save(); syncEnd(true); paintMarks();

  const w=$('#where'); if(w) w.innerHTML=whereHTML(cur);
  const pr=$('#prog'); if(pr) pr.style.width=(rdN()/P.length*100)+'%';

}
/* 顶栏（规范 v2）：上行章节名（小说写全"第一回　甄士隐梦幻识通灵"；短篇集《故乡》；哲学书写命题号），下行小字"书名　进度" */

const FINLOGO=`<svg class="finlogo" viewBox="0 0 40 40" aria-hidden="true"><clipPath id="finU"><rect width="40" height="25.8"/></clipPath>
  <g clip-path="url(#finU)"><g class="finnib"><rect x="18.4" y="-6" width="3.2" height="11" rx="1.2" fill="var(--ink)"/><rect x="17.2" y="4.1" width="5.6" height="2.4" rx=".8" fill="var(--ink)"/><path d="M17.4 6.5H22.6Q26 12.5 24.6 19Q23 25 20 25.6Q17 25 15.4 19Q14 12.5 17.4 6.5Z" fill="var(--hl)"/></g></g>
  <path d="M5 25.8H35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const mdShort=t=>{const d=new Date(t); return `${d.getMonth()+1} 月 ${d.getDate()} 日`;};
function endHTML(){
  const part=NOVEL&&!D.whole, what=part?`前${cnum(D.scope)}${UNIT}`:'全书';
  if(!S.finished) return `${what}完${part?`<small>精读版目前收录至第${cnum(D.scope)}${UNIT}</small>`:''}<div class="endacts"><button class="linkbtn" id="endArc">查看读书札记</button></div>`;
  const a=S.started&&S.started<S.finished?S.started:null, days=a?Math.max(1,Math.round((new Date(S.finished).setHours(0,0,0,0)-new Date(a).setHours(0,0,0,0))/864e5)+1):0;

    <button class="linkbtn fbtn" id="endArc">查看读书札记 ›</button>

function wireEnd(){ $('#endArc')?.addEventListener('click',()=>minePanel('arc')); }

/* ---------- 页边标记 ---------- */
/* 前言里的伏笔锚定到具体段落：读过那一段才亮 */
const preK=s=>(PANCH[s.id]||[0])[0];
function clueReached(s){
  if(S.found[s.id]) return true;
  if(s['提出']==='前言') return RD.size>0 || (S.preK??-1)>=preK(s) || (S.preVis??-1)>=preK(s);
  const i=IDX[s['提出']], v=S.vis??-2, c=Math.max(S.current,0);
  /* 整段都读过（下一段也翻过了）才算一定看到了；只翻过段首不算——长段落里，伏笔那一句可能还在屏幕下面 */
  if(isRd(i)&&(isRd(i+1)||i>=P.length-1)) return true;
  if(!isRd(i)&&i<c) return false;   /* 跳过去的 */
  if(i>v) return false;
  return anchorOnScreen(s);   /* 伏笔那一句整句露出屏幕（底部导航上方）才算 */
}
function anchorOnScreen(s){
  const i=IDX[s['提出']], el=els[i]; if(!el||!el.isConnected||els.length!==P.length) return true;
  const Z=el.querySelector('.zh'), C=visEl(Z)?Z:(el.querySelector('.body > .og')||Z), t=C.textContent, a0=C===Z&&s['提出锚句']?t.indexOf(s['提出锚句']):-1, o=a0>=0?a0+s['提出锚句'].length-1:0;   /* 锚句整句露出来（看它最后一个字）才算发现 */
  const w=document.createTreeWalker(C,NodeFilter.SHOW_TEXT); let n,pos=0;
  while((n=w.nextNode())){ if(pos+n.length>o){ const r=document.createRange(); r.setStart(n,o-pos); r.setEnd(n,Math.min(n.length,o-pos+1)); const rc=r.getClientRects()[0]; if(!rc) return true;
      const nav=$('.nav'), edge=innerHeight-(nav?nav.offsetHeight:0)-16; return rc.top<edge; } pos+=n.length; }
  return true;
}
function reachedClues(){return S.view.guide?SUS.filter(s=>clueReached(s)&&(!s['揭晓']||posOf(s['提出'])<IDX[s['揭晓']])):[];}
function clueBox(s){ return s['提出']==='前言' ? preEl?.querySelector(`.pp[data-k="${preK(s)}"] > .marks`) : els[IDX[s['提出']]]?.querySelector(':scope > .marks'); }
function srcQuote(s,full){ return s['提出']==='前言' ? '前言：“'+preSent(s,D.orig&&S.lang==='orig'?ogl():'zh')+'”' : lab(s['提出'])+'：'+(full?txt(P[IDX[s['提出']]]).replace(/⟦img:[^⟧]+⟧/g,'[公式]').replace(/⟦表:[^⟧]*⟧/g,'[表]'):firstLine(txt(P[IDX[s['提出']]]),60)); }
function goSrc(id){
  const s=SUS.find(x=>x.id===id); closeSheet();
  if(s['提出']!=='前言'){jump(s['提出']);return;}
  noRead(); const pp=preEl.querySelector(`.pp[data-k="${preK(s)}"]`); pp.scrollIntoView({block:'center'});
  pp.classList.add('on'); setTimeout(()=>pp.classList.remove('on'),1600);
}
/* ---------- 页边标记对齐到具体那一行 ---------- */
/* anc：段号 + 锚句（这一段里引起伏笔 / 给出答案的那句）→ data-k（哪段）data-o（段内第几个字） */
function anc(n,sent){ const i=IDX[n]; if(i===undefined) return ''; const t=(P[i].zh||'').replace(/⟦img:[^⟧]+⟧/g,'').replace(/\n/g,''); const o=sent?Math.max(0,t.indexOf(sent)):0; return `data-k="p${i}" data-o="${o}"`; }
function ancN(n){ const pt=n&&n.parts&&n.parts[0]; if(pt) return `data-k="${pt.c}" data-o="${pt.s}"`; return n&&n.at>=0?`data-k="p${n.at}" data-o="0"`:''; }
/* 找到第 o 个字在屏幕上所在的那一行，返回相对标记栏顶部的高度 */
function lineTop(C,o,box){
  const w=document.createTreeWalker(C,NodeFilter.SHOW_TEXT); let n,pos=0;
  while((n=w.nextNode())){ if(pos+n.length>o){ const r=document.createRange(); r.setStart(n,o-pos); r.setEnd(n,Math.min(n.length,o-pos+1)); const rc=r.getClientRects()[0]; return rc?rc.top+rc.height/2-box.getBoundingClientRect().top:null; } pos+=n.length; }
  return null;
}
function placeMarks(){
  document.querySelectorAll('.marks').forEach(box=>{
    const ms=[...box.querySelectorAll('.mk')]; if(!ms.length) return;
    box.classList.add('abs');
    let floor=-1e9;
    ms.map(m=>{ const k=m.dataset.k; let C=k?cOf(k):null, o=+m.dataset.o||0; if(k&&!visEl(C)){ C=visAlt(k); o=0; }
      if(m.dataset.pre&&C){ const s0=SUS.find(x=>x.id===m.dataset.pre), og=C.classList.contains('og'), st=s0?preSent(s0,og?C.lang:'zh'):''; const kk=og?k+'@'+C.lang:k, rg=st?sentRange(kk,st):null; o=rg?rg[0].s:0; } const y=C?lineTop(C,o,box):null; return {m,y:y==null?13:y}; })
      .sort((a,b)=>a.y-b.y)
      .forEach(({m,y})=>{ const h=m.offsetHeight||26, top=Math.max(y-h/2,floor); m.style.top=top+'px'; floor=top+h+4; });
  });
}
/* 一句的范围：从锚句往前找到句首（句号、冒号、引号之后），往后到句末（含后引号） */
function sentRange(k,sent){
  const C=cOf(k); if(!C) return null; const t=C.textContent;
  if(!sent&&!NOVEL) return [{c:k,s:0,e:t.length}];
  let o=sent?t.indexOf(sent):0; if(o<0) o=0;
  let s=o, e=o+(sent?sent.length:0);
  const W=k.includes('@'), A=W?/[.!?;:]/:/[。！？；：“「]/, B=W?/[.!?]/:/[。！？]/;
  while(s>0&&!A.test(t[s-1])) s--; while(W&&s<t.length&&/[\s—–]/.test(t[s])) s++;
  while(e<t.length&&!B.test(t[e])) e++; if(e<t.length) e++; while(e<t.length&&/[”’」』"']/.test(t[e])) e++;

    ${done?`<p class="mini">这处伏笔在${lab(s['揭晓'])}揭晓了。</p>`:`<p class="mini">读到答案处会自动揭晓。${Object.keys(S.seen).length<=1?'伏笔只是阅读引导，不判对错。':''}</p>`}
  </div>
  <div class="sfoot">${done?`<button class="btn ghost" id="cSrc">回到原文</button><button class="btn" id="cRv" style="margin-left:auto">看揭晓</button>`:`<button class="btn ghost" data-close>继续阅读</button><button class="btn" id="cg" style="margin-left:auto">${g?'修改猜想':'写下猜想'}</button>`}</div>`);
  wireBack(back);
  $('#cg')?.addEventListener('click',()=>guessEditor(id,self));
  $('#cRv')?.addEventListener('click',()=>reveal(id,false,self));
  $('#cSrc')?.addEventListener('click',()=>goSrc(id));
}

/* 揭晓处"读到了"：答案那一句的句末越过阅读线（屏幕 40%）。长段落里答案常在后半段，只看段首会提前揭晓。
   下一段已经翻过、或已经滑到书末，也算。跳转期间不算。没有锚句的（哲学书的短命题）按整段的末尾算 */
function ansPassed(j,sent){
  if(j===undefined) return false;
  if(isRd(j)&&isRd(j+1)) return true;
  if(jumping()) return false;
  if(!isRd(j)&&j>(S.vis??-2)) return false;
  if((innerHeight+scrollY)>=document.body.scrollHeight-20) return true;
  const k='p'+j; let C=cOf(k), e;
  if(visEl(C)){ const rg=sentRange(k,sent); e=rg?rg[0].e:C.textContent.length; } else { C=visAlt(k); if(!C) return true; e=C.textContent.length; }
  const t=C.textContent; while(e>1&&/[\s”’」』"']/.test(t[e-1])) e--;
  const rc=charRect(C,e-1); if(!rc) return true;
  return rc.top<innerHeight*ANS_LINE;
}
const ANS_LINE=0.65;   /* 2026-10-23 用户：揭晓提示有点晚 → 答案句读到屏幕约三分之二处就揭晓（原来是 40%） */
/* 读者此刻就在答案附近（答案那段，或刚读过去一两段）。离开很远时不揭晓——否则在第三章会突然揭晓第九章的伏笔 */
function atAns(j,cur){ if(j===undefined||j>Math.max(cur,S.vis??-2)) return false; const e=els[j]; return !!e&&e.getBoundingClientRect().bottom>-innerHeight*0.5; }   /* 答案那段还在屏幕上，或刚滑出屏幕不到半屏 */
/* 伏笔打开时，答案那里其实早就读过了（先读过去、后来才打开这个伏笔）：直接记为已揭晓，不播动效 */
function lateSolve(s,quiet){
  const j=s['揭晓']?IDX[s['揭晓']]:undefined;
  if(j===undefined||S.doneS[s.id]||!isRd(j)||!(isRd(j+1)||j===P.length-1)) return false;
  const now=Date.now(); S.seen[s.id]=S.seen[s.id]||now; S.doneS[s.id]=now; S.ansSeen=S.ansSeen||{}; S.ansSeen[s.id]=S.ansSeen[s.id]||now; save();
  if(!quiet) paintMarks(); return true;
}
function charRect(C,o){
  const w=document.createTreeWalker(C,NodeFilter.SHOW_TEXT); let n,pos=0;
  while((n=w.nextNode())){ if(pos+n.length>o){ const r=document.createRange(); r.setStart(n,o-pos); r.setEnd(n,o-pos+1); return r.getClientRects()[0]||null; } pos+=n.length; }
  return null;
}
function checkAnswer(cur){
  if(jumping()) return;
  if(checkMine(cur)) return;
  if(!S.view.guide) return;
  for(const s of SUS){
    if(ML()&&isPiece(s.id)&&S.found[s.id]&&!S.seen[s.id]) S.seen[s.id]=S.found[s.id];   /* 主线的伏笔发现即打开（保险：页边还没重画时） */
    if(S.seen[s.id] && !S.doneS[s.id] && s['揭晓'] && !atAns(IDX[s['揭晓']],cur) && lateSolve(s,true)){ paintMarks();
      /* 主线的碎片：读得快、一路滑过了答案（还在同一章里）——仍然给拼图卡，不让惊喜悄悄过去；跳过去的不给 */
      const j=IDX[s['揭晓']], u=unitAt(cur); if(ML()&&isPiece(s.id)&&u&&j>=u.first&&j<=cur){ today().sv++; saveProf(true); later(()=>mainReveal(s.id),calm()?0:600); break; }
      continue; }   /* 答案早就读过（快速滑过、跳读）：直接算已揭晓，不提示 */
    if(S.seen[s.id] && !S.doneS[s.id] && s['揭晓'] && atAns(IDX[s['揭晓']],cur) && ansPassed(IDX[s['揭晓']],s['揭晓锚句'])){   /* 正读到答案那一句才揭晓；跳过去的、早就读过的都不在这里揭晓 */
      S.doneS[s.id]=Date.now(); save(); paintMarks(); announceSolved(); sweep(clueRange(s,'ans')); today().sv++; saveProf(true);
      cluePanel.last='done';
      if(ML()&&isPiece(s.id)) later(()=>mainReveal(s.id),calm()?0:900);   /* 主线的碎片：不走普通提示条，单独一张"拼上一块"的卡 */
      else later(()=>toast(`<div class="tq">伏笔揭晓：${esc(s['问题'])}</div><button>看解释</button>`,()=>reveal(s.id,true),12000),calm()?0:900);
      break;
    }
  }
}
function reveal(id,auto,back){
  const s=SUS.find(x=>x.id===id), g=S.guesses[id];
  S.ansSeen=S.ansSeen||{}; if(!S.ansSeen[id]){S.ansSeen[id]=Date.now();save();paintMarks();}
  if(!auto) sweep(clueRange(s,'ans'));
  const nP=ML()&&isPiece(id)?D.main.pieces.filter(x=>S.doneS[x]).length:0;
  const piece=nP?`<p class="rvml"><span class="mltag">主线</span>拼上第 ${nP} 块　${nP} / ${D.main.pieces.length}</p>`:'';
  openSheet(`<div class="shead">${back?`<button class="x back" data-bk aria-label="返回">‹</button>`:''}<span class="ttl">伏笔在${NOVEL?lab(s['揭晓']):' '+s['揭晓']+' '}揭晓</span><button class="x" data-close aria-label="关闭">×</button></div>
    <div class="sbody"><div class="rvq"><small>埋于${NOVEL?lab(s['提出']):' '+s['提出']}</small><div class="qt">${esc(s['问题'])}</div></div>
    <div class="rvpair"><div class="rvg"><small>你当时猜</small>${g?`<p>${esc(g.text)}</p><span class="rvc">${g.conf} 成把握</span>`:'<p class="rvnone">当时没有写猜想。</p>'}</div>
    <div class="rva"><small>书里的答案（揭晓说明）</small><p class="plain">${esc(s['兑现说明'])}</p></div></div>${piece}</div>
    <div class="sfoot">${auto?`<button class="btn ghost" data-go="${s['揭晓']}">回到原文</button><button class="btn" data-close style="margin-left:auto">继续阅读</button>`:`<button class="btn" data-go="${s['揭晓']}" style="margin-left:auto">回到原文</button>`}</div>`);
  wireBack(back);
}

/* 未回收 = 打开过、还没读到回收处的书中伏笔 + 自己埋的、还没标“读到答案了”的问题 */
const isFb=n=>n&&n.type==='q'&&!!(n.rv||n.later);   /* 答案在后文的提问 = 我发现的伏笔；其余提问只是提问 */
function unresolved(){
  const book=reachedClues().filter(s=>S.seen[s.id]&&!S.doneS[s.id]);
  const mine=S.notes.filter(n=>isFb(n)&&!n.done);
  return {book,mine,n:book.length+mine.length};
}
/* 出处原文：先显示两行，超出时可展开；划线原文本来就是读者选的，直接完整显示 */
function srcBlock(t,kind){
  if(kind==='hl') return `<div class="src">${esc(t)}</div>`;
  const pv=cutAt(t,56,20); if(pv.length>=t.length) return `<div class="src">${esc(t)}</div>`;
  return `<div class="src clamp"><span class="pv">${esc(ellip(pv))}</span><span class="fu" hidden>${esc(t)}</span><button class="more-t" aria-expanded="false">展开</button></div>`;
}
function wireClamp(root){
  root.querySelectorAll('.src.clamp').forEach(el=>{
    const b=el.querySelector('.more-t'), pv=el.querySelector('.pv'), fu=el.querySelector('.fu');
    b.onclick=e=>{ e.stopPropagation(); const open=el.classList.toggle('open'); pv.hidden=open; fu.hidden=!open; b.textContent=open?'收起':'展开'; b.setAttribute('aria-expanded',open); };
  });
}
function mineQuote(n){const u=n.hl&&S.ul.find(x=>x.id===n.hl); return u?u.text:n.quote||(n.at>=0?txt(P[n.at]).replace(/⟦img:[^⟧]+⟧/g,'[公式]').replace(/⟦表:[^⟧]*⟧/g,'[表]'):'');}
/* ---------- 主线（每本书一个读者一开头就有的大问题）：挂在主线上的伏笔 = 碎片，揭晓一条拼上一块 ---------- */
function mainReached(){ return !!D.main; }   /* 2026-10-26 用户：主线从一开始就呈现。问题出自书名/作者/序言，开卷显示不剧透 */
const ML=()=>S.view.guide&&D.main&&mainReached()?D.main:null;
/* 读到主线问题出现的地方：提示条告诉读者这本书的主线（每本书一次）；正在显示别的提示时稍后再说 */
function mainToast(){ if(!ML()||S.mainSeen||!S.inBook) return; S.mainSeen=Date.now(); save();
  const go=()=>{ if($('#toast').classList.contains('show')) return later(go,3500); toast(`<div class="tq"><b style="font-weight:600">这本书的主线</b>：${esc(D.main.q)}<small style="display:block;opacity:.75">伏笔揭晓一处，就拼上一块。</small></div><button>查看</button>`,()=>cluePanel('open'),9000); };
  later(go,1200); }
const mlDone=m=>m.pieces.filter(id=>S.doneS[id]).length;
const isPiece=id=>!!(D.main&&D.main.pieces.includes(id));
function mainHTML(withEnd){ const m=ML(); if(!m) return ''; const n=mlDone(m), N=m.pieces.length;
  setTimeout(()=>{ if(S.mlNew){ delete S.mlNew; save(); } },1500);   /* 新出现的那一格只在第一次看到时动一下 */
  return `<div class="mainl"><div class="mlh"><span class="mltag">主线</span><span class="mlc">已拼上 ${n} / ${N}</span></div>
    <div class="mlq">${esc(m.q)}</div><div class="mlp" aria-label="已拼上 ${n} 块，共 ${N} 块">${m.pieces.map(id=>`<i class="${S.doneS[id]?'on':(S.found[id]||S.seen[id])?'found':''} ${S.mlNew===id&&!S.doneS[id]?'new':''}" title="${S.doneS[id]?'已拼上':(S.found[id]||S.seen[id])?'已出现，读到答案就拼上':'还没读到'}"></i>`).join('')}</div>
    ${n&&!S.finished?`<ol class="mlnotes">${m.pieces.filter(id=>S.doneS[id]).map(id=>`<li>${esc((m.notes||{})[id]||'')}</li>`).join('')}</ol>`:''}
    ${withEnd&&S.finished?`<p class="mlend">${esc(m.end)}</p>`:''}</div>`; }
/* 主线拼上一块：从底部升起一张卡——主线问题、拼图格（新的一块飞进来点亮）、这一块拼上了什么；最后一块 = 全部拼上。不挡阅读、不用点掉，几秒后自己落下 */
function mainReveal(id){
  const m=D.main, n=mlDone(m), N=m.pieces.length, k=m.pieces.indexOf(id), last=n===N, note=(m.notes||{})[id]||'';
  let el=$('#mlfx'); if(!el){ el=document.createElement('div'); el.id='mlfx'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.className=''; void el.offsetWidth;
  el.innerHTML=`<div class="mlfx-h"><span class="mltag">主线</span><span>${last?'全部拼上了':`拼上第 ${n} 块`}</span><span class="mlfx-c">${n} / ${N}</span></div>
    <div class="mlfx-q">${esc(m.q)}</div>
    <div class="mlfx-p">${m.pieces.map((p,i)=>`<i class="${S.doneS[p]?'on':(S.found[p]||S.seen[p])?'found':''} ${i===k?'new':''}"></i>`).join('')}</div>
    <p class="mlfx-n">${esc(note)}</p><button class="tx" id="mlfxX" aria-label="关闭">×</button>`;   /* 2026-10-27 用户：不要"看这处伏笔/看主线"按钮，只是一个惊喜时刻 */
  el.classList.add('show'); if(last) el.classList.add('done'); if(calm()) el.classList.add('calm');
  const live=$('#live'); if(live) live.textContent=`主线拼上一块，${n} / ${N}。${note}`;
  clearTimeout(mainReveal.t); const hide=()=>el.classList.remove('show'); mainReveal.t=setTimeout(hide,last?14000:9000);
  $('#mlfxX').onclick=hide;
}
function cluePanel(tab){
  /* v9.62：每条两行（位置 + 印章 / 问题），点一条原地进伏笔卡或揭晓卡；没打开的也排在里面 */
  const rc=reachedClues(), qs=S.notes.filter(isFb);
  const all=[...rc.map(s=>({b:s,pos:posOf(s['提出']),done:S.doneS[s.id]||0})),...qs.map(n=>({m:n,pos:n.at,done:n.done||0}))];
  const open=all.filter(x=>!x.done).sort((a,b)=>a.pos-b.pos);
  const done=all.filter(x=>x.done).sort((a,b)=>b.done-a.done);   /* 最近揭晓的排最前 */
  if(!tab){ const tOpen=Math.max(0,...open.map(x=>x.b?(S.seen[x.b.id]||0):(x.m.t||0))), tDone=Math.max(0,...done.map(x=>x.done||0)); tab=tDone>tOpen?'done':'open'; }
  cluePanel.last=tab;
  const row=x=>{ if(x.b){ const s=x.b, d=S.doneS[s.id], lk=!S.seen[s.id];
      return `<button class="cr ${d?'done':''} ${lk?'locked':''}" data-cl="${s.id}"><span class="crh"><span>${label(posOf(s['提出']))}</span>${ML()&&isPiece(s.id)?'<span class="seal zhu">主线</span>':''}${d?`<span class="crs">${lab(s['揭晓'])}揭晓</span>`:''}${S.guesses[s.id]?'<span class="crg">已猜</span>':''}</span><span class="crq">${lk?'点开查看问题':esc(s['问题'])}</span></button>`; }
    const n=x.m; return `<button class="cr mine ${n.done?'done':''}" data-cm="${n.id}"><span class="crh"><span>${label(n.at)}</span><span class="seal dai">我发现的</span>${n.done?`<span class="crs">${n.rv?lab(n.rv)+'揭晓':'已揭晓'}</span>`:''}${n.guess?'<span class="crg">已猜</span>':''}</span><span class="crq">${esc(n.text)}</span></button>`; };
  const L=tab==='open'?open:done;
  const body=L.length?L.map(row).join(''):`<div class="empty">${tab==='done'?'暂无已揭晓的伏笔。':all.length?'暂无未揭晓的伏笔。':`${S.view.guide?`阅读时，页边朱色的“伏笔”标出书中的伏笔，点一下打开${ML()?'；其中一部分是主线的碎片，揭晓一处就拼上一块':''}。`:''}你写下的疑问如果答案在后文，也会作为伏笔列在这里。`}</div>`;
  openSheet(`<div class="shead"><span class="ttl">伏笔</span>
    <div class="seg" role="group" aria-label="伏笔分类"><button data-ct="open" aria-pressed="${tab==='open'}">未揭晓 ${open.length}</button><button data-ct="done" aria-pressed="${tab==='done'}">已揭晓 ${done.length}</button></div>
    <button class="x" data-close aria-label="关闭">×</button></div>
  <div class="sbody">
    ${mainHTML(true)}
    ${!S.view.guide?'<p class="mini" style="margin-top:6px">书中伏笔已关闭，可在“设置 › 更多设置 › 阅读引导”中开启。你发现的伏笔不受影响。</p>':''}
    <div class="crl">${body}</div>
  </div>`,{tall:true});
  const sh=$('#sheet'), bk=()=>cluePanel(tab);
  sh.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>cluePanel(b.dataset.ct));
  sh.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{ const id=b.dataset.cl; S.doneS[id]?reveal(id,false,bk):openClue(id,false,bk); });
  sh.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ const n=S.notes.find(x=>x.id===+b.dataset.cm); n.done&&n.rv?revealMine(n.id,false,bk):noteSheet(n.id,bk); });
}

function confRow(v){return `<div class="conf"><span>把握</span><input type="range" min="1" max="10" value="${v}" id="cf" aria-label="把握，几成"><b id="cfv">${v} 成</b></div>`}
function wireConf(){const r=$('#cf'),v=$('#cfv');if(r)r.oninput=()=>v.textContent=r.value+' 成';}
function guessEditor(id,back){
  /* v9.62：原地换成填写页，‹ 回到伏笔卡；保存后回到伏笔卡，提示"已保存 · 撤销"。把握仍用滑条（用户 10-28 定） */
  const s=SUS.find(x=>x.id===id), old=S.guesses[id], g=old||{text:'',conf:5}, bk=back||(()=>openClue(id));
  openSheet(`<div class="shead"><button class="x back" data-bk aria-label="返回伏笔">‹</button><span class="ttl">${old?'修改猜想':'写下猜想'}</span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="sbody"><div class="q" style="border:0;padding-top:0"><div class="qt">${esc(s['问题'])}</div></div>
    <p class="flab">你的猜想</p><textarea id="gt" placeholder="只有你自己能看到，会在揭晓处重新出现">${esc(g.text)}</textarea>${confRow(g.conf)}</div>
  <div class="sfoot"><button class="btn ghost" data-bk>取消</button><button class="btn" id="gs" style="margin-left:auto">保存</button></div>`);
  wireBack(bk); wireConf(); $('#gt').focus();
  $('#gs').onclick=()=>{ const t=$('#gt').value.trim(); if(!t){ $('#gt').focus(); return; }
    S.guesses[id]={text:t,conf:+$('#cf').value,at:S.current}; save(); bk();
    toast('<div class="tq">已保存</div><button>撤销</button>',()=>{ if(old) S.guesses[id]=old; else delete S.guesses[id]; save(); if($('#sheet').classList.contains('show')) bk(); },4000); };
}


/* ---------- 自由选字：划线 / 写想法 / 提问 ---------- */
/* 能划线的地方：命题正文（p+序号）和前言段落（f+段号）。位置用"这段文字里的第几个字"记录。 */
const cSplit=c=>{const i=c.indexOf('@'); return i<0?[c,null]:[c.slice(0,i),c.slice(i+1)];};
const cHost=b=>b[0]==='p'?els[+b.slice(1)]:preEl?.querySelector(`.pp[data-k="${b.slice(1)}"]`);
const cOf=c=>{ const [b,l]=cSplit(c), h=cHost(b); if(!h) return null;
  if(!l) return b[0]==='p'?h.querySelector('.zh'):h.querySelector(':scope > p');
  const o=b[0]==='p'?h.querySelector('.body > .og'):h.querySelector(':scope > .og'); return o&&o.lang===l?o:null; };
/* 一个容器被隐藏时（只看原文 / 只看中文），找同一条里正在显示的那一块 */
function visAlt(c){ const h=cHost(cSplit(c)[0]); return h?blocksOf(h).find(visEl)||null:null; }
const cKey=el=>{const og=el.closest('.og'); if(og){ if(og.closest('.foot1')) return null; const pr=og.closest('.prop'); if(pr) return 'p'+pr.dataset.i+'@'+og.lang; const pp=og.closest('.pp'); return pp?'f'+pp.dataset.k+'@'+og.lang:null; } const z=el.closest('.zh'); if(z) return 'p'+z.closest('.prop').dataset.i; const pp=el.closest('.pp'); return pp&&el.closest('.pp > p')?'f'+pp.dataset.k:null;};
const cOrd=c=>{const [b,l]=cSplit(c); return (b[0]==='f'?-1000:0)+ +b.slice(1)+(l?0.5:0);};
const cAt=c=>{const b=cSplit(c)[0]; return b[0]==='p'?+b.slice(1):-1;};
function allConts(){return [...(preEl?preEl.querySelectorAll('.pp > p, .pp > .og'):[]),...document.querySelectorAll('.prop .zh, .prop .body > .og')].filter(visEl);}   /* 只算正在显示的：只看原文时选字就落在原文上 */
function hasSel(){const s=getSelection(); return s&&s.rangeCount&&!s.isCollapsed&&s.toString().trim()!=='' && $('#text')?.contains(s.getRangeAt(0).commonAncestorContainer);}
function offIn(C,node,off){const r=document.createRange(); r.setStart(C,0); r.setEnd(node,off); return r.toString().length;}
function rangeParts(rg){
  const parts=[];
  allConts().forEach(C=>{
    if(!rg.intersectsNode(C)) return;
    const len=C.textContent.length;
    let s=C.contains(rg.startContainer)?offIn(C,rg.startContainer,rg.startOffset):0;
    let e=C.contains(rg.endContainer)?offIn(C,rg.endContainer,rg.endOffset):len;
    const t=C.textContent;
    while(s<e&&/\s/.test(t[s]))s++; while(e>s&&/\s/.test(t[e-1]))e--;
    if(e>s) parts.push({c:cKey(C),s,e});
  });
  return parts.filter(p=>p.c);
}

function addUL(parts){
  let all=parts.map(p=>({...p})), absorbed=[];
  S.ul.forEach(u=>{ if(u.parts.some(a=>parts.some(b=>a.c===b.c&&a.s<=b.e&&b.s<=a.e))){absorbed.push(u.id); all.push(...u.parts.map(p=>({...p})));} });
  all.sort((a,b)=>cOrd(a.c)-cOrd(b.c)||a.s-b.s);
  const merged=[]; all.forEach(p=>{const l=merged[merged.length-1]; if(l&&l.c===p.c&&p.s<=l.e) l.e=Math.max(l.e,p.e); else merged.push({...p});});

/* 正文上的线：划线 = 黄色细线；想法 = 蓝色点线；提问 = 蓝色波浪线。写了想法/提问的划线只显示想法/提问的线；删掉想法/提问，线一起删 */
function paintUL(){
  document.querySelectorAll('#text mark.ul,#text mark.nt').forEach(m=>{const p=m.parentNode; while(m.firstChild)p.insertBefore(m.firstChild,m); p.removeChild(m); p.normalize();});
  const wrap=(parts,mk)=>parts.forEach(pt=>{
    const C=cOf(pt.c); if(!C) return;
    const w=document.createTreeWalker(C,NodeFilter.SHOW_TEXT); const nodes=[]; let n; while((n=w.nextNode()))nodes.push(n);
    let pos=0;
    nodes.forEach(tn=>{
      const a=pos,b=pos+tn.length; pos=b;
      const s=Math.max(pt.s,a),e=Math.min(pt.e,b); if(e<=s) return;
      let x=tn; if(s>a) x=x.splitText(s-a); if(e<b) x.splitText(e-s);
      const m=mk(); x.parentNode.insertBefore(m,x); m.appendChild(x);
    });
  });
  S.ul.filter(u=>!S.notes.some(n=>n.hl===u.id&&n.parts&&n.parts.length)).forEach(u=>wrap(u.parts,()=>{const m=document.createElement('mark'); m.className='ul'; m.dataset.ul=u.id; return m;}));

}

      n.done=Date.now(); n.auto=true; cluePanel.last='done'; save(); today().sv++; saveProf(true); paintMarks(); navFx('rise','伏笔揭晓'); sweep(mineRange(n,'ans'));
      later(()=>toast(`<div class="tq">伏笔揭晓：${esc(n.text)}</div><button>看解释</button>`,()=>revealMine(n.id,true),12000),calm()?0:900);
      return true;
    }
  }
  return false;
}
function revealMine(id,auto,back){
  const n=S.notes.find(x=>x.id===id), q=(D.qa||[]).find(x=>x.id===n.qa); if(!q) return;
  if(!n.ansSeen){n.ansSeen=Date.now();save();paintMarks();}

    <div class="rvpair"><div class="rvg"><small>你当时猜</small>${n.guess?`<p>${esc(n.guess)}</p><span class="rvc">${n.conf} 成把握</span>`:'<p class="rvnone">当时没有写猜想。</p>'}</div>
    <div class="rva"><small>书里的答案（揭晓说明）</small><p class="plain">${esc(q['回收说明'])}</p></div></div></div>

/* 点一条划线：一段划线只对应一条记录（想法 或 提问） */
/* 删除一段划线；挂在上面的想法/提问保留在“笔记”里 */
function removeUL(id){
  const u=S.ul.find(x=>x.id===id); if(!u) return;
  S.notes.filter(x=>x.hl===id).forEach(x=>{x.hl=null;x.quote=u.text;x.at=u.at;});
  S.ul=S.ul.filter(x=>x.id!==id); save(); paintUL(); paintMarks();
}
function hlSheet(id){
  const u=S.ul.find(x=>x.id===id); if(!u) return;
  const n=noteOf(id), ns=S.notes.filter(x=>x.hl===id);   /* 旧数据里一段划线可能有多条，照样都显示 */
  openSheet(`<div class="shead"><span class="ttl">划线</span><span style="font-family:var(--num);color:var(--mute)">${label(u.at)}</span><button class="x" data-close aria-label="关闭">×</button></div>

/* ---------- 编辑一条想法 / 提问（新建走轻量输入条 quickNote） ---------- */
function composer({editId,back=null}={}){
  const ed=S.notes.find(n=>n.id===editId); if(!ed) return;
  const kind=ed.type, u=ed.hl?S.ul.find(x=>x.id===ed.hl):null;
  const quote=u?u.text:ed.quote||(ed.at>=0?P[ed.at].zh.replace(/⟦img:[^⟧]+⟧/g,'[公式]').replace(/⟦表:[^⟧]*⟧/g,'[表]'):'');
  openSheet(`<div class="shead"><span class="ttl">编辑${kind==='note'?'想法':isFb(ed)?'伏笔':'疑问'}</span><span style="font-family:var(--num);color:var(--mute)">${label(ed.at)}</span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="sbody">
    ${quote?`<div class="quote">${esc(quote)}</div>`:''}
    <textarea id="ct">${esc(ed.text)}</textarea>
    ${kind==='q'?`${ed.done||!(ed.rv||ed.later)?(ed.guess?`<div class="guess">当时的猜想：${esc(ed.guess)}<div class="c">${ed.conf||5} 成把握</div></div>`:''):`<p class="mini" style="margin:12px 0 6px">我的猜想（选填）</p><textarea id="cg2" style="min-height:64px" placeholder="我猜……">${esc(ed.guess||'')}</textarea>${confRow(ed.conf||5)}`}${ed.done&&!ed.rv?`<p class="mini" style="margin:12px 0 6px">我记下的答案（选填）</p><textarea id="cans" style="min-height:64px" placeholder="书里是这样说的……">${esc(ed.ans||'')}</textarea>`:''}`:''}
  </div>
  <div class="sfoot"><button class="btn ghost" data-close>取消</button><button class="btn ghost" id="cdel">删除</button><button class="btn" id="csave" style="margin-left:auto">保存</button></div>`);
  wireConf(); $('#ct').focus();

  $('#cdel').onclick=()=>{ const ul=ed.hl&&S.ul.find(u=>u.id===ed.hl), hl0=ed.hl; S.notes=S.notes.filter(n=>n.id!==ed.id); if(ul) S.ul=S.ul.filter(u=>u!==ul); after();
    toast(`<div class="tq">已删除</div><button>撤销</button>`,()=>{ ed.hl=hl0; S.notes.push(ed); if(ul) S.ul.push(ul); save(); paintUL(); paintMarks(); },4000); };
  $('#csave').onclick=()=>{const v=$('#ct').value.trim(); if(!v){$('#ct').focus();return;}
    ed.text=v; if(kind==='q'){ if($('#cg2')){ed.guess=$('#cg2').value.trim();ed.conf=+$('#cf').value;} const ca=$('#cans'); if(ca){const a=ca.value.trim(); if(a) ed.ans=a; else delete ed.ans;}} after();};
}
/* 想法/问题挂在哪：有划线就跟着划线的第一段，否则跟着那条命题 */
function noteKey(n){if(n.parts&&n.parts[0]) return n.parts[0].c; const u=n.hl&&S.ul.find(x=>x.id===n.hl); return u?u.parts[0].c:(n.at>=0?'p'+n.at:'f0');}
/* 点正文里的想法/提问（没有划线，或划线已取消） */
function noteSheet(id,back){

  openSheet(`<div class="shead">${back?'<button class="x back" data-bk aria-label="返回">‹</button>':''}<span class="ttl">${kind}</span><span class="nsub">${label(n.at)}</span><button class="x" data-close aria-label="关闭">×</button></div>

  <div class="sfoot"><button class="btn ghost" id="nDel">删除</button>${n.at>=0?'<button class="btn ghost" id="nGo">回到原文</button>':''}${n.at>=0?'<button class="btn ghost" id="nCard" style="margin-left:auto">解释</button>':''}</div>`);

  $('#nDel').onclick=()=>{ const ul=n.hl&&S.ul.find(u=>u.id===n.hl); S.notes=S.notes.filter(x=>x.id!==n.id); if(ul) S.ul=S.ul.filter(u=>u!==ul); save(); paintUL(); paintMarks(); back?back():closeSheet();
    toast(`<div class="tq">已删除这条${kind}。</div><button>撤销</button>`,()=>{ S.notes.push(n); if(ul) S.ul.push(ul); save(); paintUL(); paintMarks(); if(back&&$('#sheet').classList.contains('show')) back(); },4000); };

function keyBox(k){k=cSplit(k)[0]; return k[0]==='p'?els[+k.slice(1)]?.querySelector(':scope > .marks'):preEl?.querySelector(`.pp[data-k="${k.slice(1)}"] > .marks`);}
/* 标签：每种记录一个颜色 + 图标；问题（我埋的伏笔）另带回收状态 */
const KT={bm:['t-bm','bm','书签'],hl:['t-hl','hl','划线'],note:['t-note','note','想法'],q:['t-mine','ask','疑问'],qa:['t-mine','ask','疑问']};
function kindTag(k){if(k==='fb') return `<span class="tag t-mine"><span class="dm"></span>我发现的伏笔</span>`;const [c,i,l]=KT[k]; return `<span class="tag ${c}">${ic(i,'')}${l}</span>`;}
const ansP=n=>n&&n.done&&n.ans?`<p class="ans">我记下的答案：${esc(n.ans)}</p>`:'';
/* 疑问不用揭晓：有答案 = 已解答，没有 = 待解答 */
function qTag(done){return done?'<span class="st done">已解答</span>':'<span class="st open">待解答</span>';}
function stTag(done){return done?`<span class="st done">${ic('check','i').replace('class="i"','class="i" style="width:13px;height:13px"')}已揭晓</span>`:'<span class="st open">未揭晓</span>';}
function noteRow(n){
  return `<div class="q ${n.type==='q'?'mine':n.type==='qa'?'qa':'note'} ${n.done?'done':''}"><div class="from">${kindTag(isFb(n)?'fb':n.type)}${isFb(n)?stTag(n.done):n.type==='q'?qTag(n.done):n.type==='qa'?qTag(true):''}</div>
    <div class="qt">${esc(n.text)}</div>${n.guess?`<div class="guess">我的猜想：${esc(n.guess)}<div class="c">${n.conf} 成把握</div></div>`:''}${ansP(n)}
    <div class="qacts">${n.type==='qa'?`<button data-sa="${n.id}">看回答</button>`:`<button data-ed="${n.id}">编辑</button>`}${n.type==='q'&&!n.done&&!n.rv&&!n.later?`<button data-dn="${n.id}">我找到答案了</button>`:''}</div></div>`;
}
/* 自己找到了答案：可顺手记下答案（选填），确定后标为已揭晓 */
function foundAnswer(id,back,after){
  const nn=S.notes.find(n=>n.id===id); if(!nn) return;

function wireNoteRows(sh,again){

}

/* ---------- 笔记：书签 / 划线 / 想法 / 问题 ---------- */
function minePanel(tab='all'){
  /* v9.67（用户 10-30）：读书札记和笔记是同一个地方——笔记标签行最后多一个"札记"，在原处切换，不再是另一整页、也没有大按钮 */
  const items=[];
  Object.keys(S.bm).forEach(i=>items.push({k:'bm',at:+i,t:S.bm[i]}));
  S.ul.forEach(u=>items.push({k:'hl',at:u.at,t:u.t,u}));
  S.notes.forEach(n=>items.push({k:n.type,at:n.at,t:n.t,n}));
  items.sort((a,b)=>a.at-b.at||a.t-b.t);
  const noted=new Set(S.notes.map(n=>n.hl).filter(Boolean));
  const isQ=x=>(x.k==='q'||x.k==='qa')&&!isFb(x.n);
  const pick={all:x=>!(x.k==='hl'&&noted.has(x.u.id)),hl:x=>x.k==='hl',note:x=>x.k==='note',q:isQ,bm:x=>x.k==='bm'};
  const TABS=[['all','全部'],['hl','划线'],['note','想法'],['q','疑问'],['bm','书签']].map(([k,l])=>[k,l,items.filter(pick[k]).length]);
  const KN={bm:'书签',hl:'划线',note:'想法',q:'疑问',qa:'疑问'};
  const row=x=>{ const p=x.at>=0?P[x.at]:null, n=x.n, u=x.u||(n&&n.hl&&S.ul.find(v=>v.id===n.hl));
    const src=u?u.text:n&&n.quote?n.quote:p?firstLine(txt(p),60):'';
    const go=u?`data-gu="${u.id}"`:`data-go="${p?p.n:'1'}"`;
    const st=isFb(n)?(n.done?'已揭晓':'未揭晓'):n&&n.type==='q'?(n.done?'已解答':'待解答'):n&&n.type==='qa'?'已解答':'';
    const more=x.k==='bm'?`<button class="nrm txt" data-ub="${x.at}">移除</button>`:n&&n.type==='qa'?`<button class="nrm" data-sa="${n.id}" aria-label="看回答">…</button>`:n?`<button class="nrm" data-nm="${n.id}" aria-label="编辑、删除">…</button>`:`<button class="nrm" data-hs="${u.id}" aria-label="写点什么、取消划线">…</button>`;
    return `<div class="nr ${n&&n.done?'done':''}" role="button" tabindex="0" ${go}><div class="nrh"><span>${label(x.at)}　${isFb(n)?'我发现的伏笔':KN[x.k]}</span>${st?`<span class="nrs ${/待|未/.test(st)?'open':''}">${st}</span>`:''}${more}</div>
      ${src?`<p class="nrq ${x.k==='bm'?'bm':''}">${esc(src)}</p>`:''}
      ${n?`<p class="nrt">${esc(n.text)}</p>`:''}${n&&n.guess?`<p class="nrg">我的猜想：${esc(n.guess)}　${n.conf} 成把握</p>`:''}${n&&n.done&&n.ans?`<p class="nrg">我记下的答案：${esc(n.ans)}</p>`:''}</div>`; };
  const tabs=`<div class="ntabs" role="group" aria-label="笔记分类">${TABS.map(([k,l,c])=>`<button data-tab="${k}" aria-pressed="${k===tab}">${l}${c?`<small>${c}</small>`:''}</button>`).join('')}</div>`;
  let body;
  if(tab==='arc') body=arcBody();
  else { const list=items.filter(pick[tab]); body=list.length?list.map(row).join(''):`<div class="empty">${tab==='bm'?'尚无书签。点顶栏右上角的图标，可为当前位置添加书签。':tab==='all'?'尚无记录。长按并拖动选择文字，可划线、写想法或提问。':'尚无记录。'}</div>`; }
  openSheet(`<div class="shead">${tab==='arc'?'<button class="x back" id="arcBack" aria-label="返回笔记">‹</button><span class="ttl">札记</span><span class="nacts"><button class="linkbtn" id="exEdit">编辑</button><button class="linkbtn" id="exCopy">复制</button><button class="linkbtn" id="exSave">导出</button></span>':'<span class="ttl">笔记</span><span class="nacts"><button class="linkbtn" id="nArc">札记</button></span>'}<button class="x" data-close aria-label="关闭">×</button></div>
    ${tab==='arc'?'':tabs}<div class="sbody ${tab==='arc'?'arcb':''}">${body}</div>`,{tall:true});
  $('#arcBack')?.addEventListener('click',()=>minePanel('all')); $('#nArc')?.addEventListener('click',()=>minePanel('arc'));
  const sh=$('#sheet'), again=()=>minePanel(tab);
  sh.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>minePanel(b.dataset.tab));
  if(tab==='arc'){ wireArc(); return; }
  sh.querySelectorAll('.nrm').forEach(b=>b.addEventListener('click',e=>e.stopPropagation()));
  sh.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>showAnswer(S.notes.find(n=>n.id===+b.dataset.sa),again));
  sh.querySelectorAll('[data-nm]').forEach(b=>b.onclick=()=>noteSheet(+b.dataset.nm,again));
  sh.querySelectorAll('[data-hs]').forEach(b=>b.onclick=()=>hlSheet(+b.dataset.hs));
  sh.querySelectorAll('[data-ub]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ub, t0=S.bm[k]; delete S.bm[k]; save(); paintMarks(); syncTbm(); minePanel(tab);
    toast('<div class="tq">已移除书签</div><button>撤销</button>',()=>{ S.bm[k]=t0; save(); paintMarks(); syncTbm(); if($('#sheet').classList.contains('show')) minePanel(tab); },4000); });
  sh.querySelectorAll('.nr').forEach(r=>{ const go=()=>{ closeSheet(); if(r.dataset.gu) flashUL(+r.dataset.gu); else jump(r.dataset.go); };
    r.addEventListener('click',go); r.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target===r) go(); }); });
}


/* ---------- 目录（只显示读过的部分） ---------- */
function outline(tab){ if(NOVEL) return novelOutline(tab); return propOutline(); }
function propOutline(){
  let h='';
  { const mains=P.map((p,i)=>[p,i]).filter(([p])=>depth(p.n)===0);
    h=mains.map(([p,i],k)=>{
      const end=k+1<mains.length?mains[k+1][1]:P.length;
      const kids=P.slice(i+1,end).map((c,j)=>[c,i+1+j]).filter(([c])=>depth(c.n)===1);
      const cur=S.current>=i&&S.current<end;
      let n=0; for(let j=i;j<end;j++) if(RD.has(j)) n++;
      const pc=Math.round(n/(end-i)*100);
      /* 主干命题、二级命题的原文只在读过后显示；没读过的只露编号 */
      const t=(c,j,len)=>isRd(j)?`<span>${esc(firstLine(txt(c),len))}</span>`:`<span class="unrd">未读</span>`;
      return `<details ${cur?'open':''}><summary><span class="on">${p.n}</span>${isRd(i)?`<span class="ot">${esc(firstLine(txt(p),80))}</span>`:`<span class="ot unrd">未读</span>`}<span class="olpb" aria-label="${n?`已读 ${pc}%`:'未读'}"><i style="width:${pc}%"></i></span></summary>
        <div class="kids"><div class="olgo"><button data-go="${p.n}"><span class="kn">${p.n}</span><span>本节开头</span></button>${i>0&&!isRd(i-1)?`<button class="olfrom" data-from="${i}">从这里开始读</button>`:''}</div>${kids.map(([c,j])=>`<button data-go="${c.n}"><span class="kn">${c.n}</span>${t(c,j,40)}</button>`).join('')}</div></details>`;}).join('');
  }
  const curI=Math.max(S.current,0);
  openSheet(`<div class="shead"><span class="ttl">导览</span><button class="x srchb" id="olS" aria-label="搜索" aria-expanded="false">${ic('search','')}</button><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="srch" hidden><input id="olQ" type="search" enterkeyhint="search" placeholder="${D.orig?'搜索已读正文（中文或原文）':'搜索已读正文'}" aria-label="搜索"></div>
  <div class="sbody"><div id="olHit" class="ol" hidden></div><div id="olTree">${RD.size?`<div class="olnow"><button data-go="${P[curI].n}" class="olnb"><span>正在读</span><b>命题 ${P[curI].n}</b><em>${pctOf()}%</em></button><button class="olrc" id="olRecap">回顾</button></div>`:''}<p class="mini">编号即目录：1、2、3 为主干，1.1 是对 1 的注释，1.11 是对 1.1 的注释。可以跳到任何位置；没翻过的内容不算已读。</p>
  <div class="ol"><details><summary><span class="on" style="font-size:16px">序</span><span class="ot">前言</span></summary><div class="kids"><button id="goPre"><span>前言</span></button></div></details>${h}</div></div></div>
`,{tall:true});
  $('#olRecap')?.addEventListener('click',()=>propRecap(true));
  $('#goPre').onclick=()=>{closeSheet();noRead();preEl.scrollIntoView({block:'start'});};
  wireFrom($('#sheet'),()=>propOutline());
  const qi=$('#olQ'); let qt=null;
  $('#olS').onclick=()=>{ const box=$('#sheet .srch'), open=box.hidden; box.hidden=!open; $('#olS').setAttribute('aria-expanded',String(open)); if(open) qi.focus(); else { qi.value=''; qi.oninput(); } };
  qi.oninput=()=>{ clearTimeout(qt); qt=setTimeout(()=>{ const q=qi.value.trim(); $('#olTree').hidden=!!q; const hb=$('#olHit'); hb.hidden=!q;
    hb.innerHTML=q?searchBody('hui',q,P.length-1):''; hb.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeSheet();jump(b.dataset.go);}); },160); };
}

function jump(n){const i=IDX[n];if(i===undefined)return; noRead(); unfoldFor(i);
  const hd=NOVEL&&HUI.find(h=>h.first===i), tg=(hd&&document.getElementById('hui'+hd.n))||els[i];   /* 跳到一回开头：连回目标题一起露出来 */
  tg.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});}

/* 从这里开始读：读者在别处读过前面，就把这之前的全部当作读过——剧情概要、人物、伏笔都解锁；之后照常跳过去。
   和"跳转"不同：跳转只是去看看，不算读过。点之前说清楚会发生什么，点了可以撤销 */
function startFrom(i){
  const prev=new Set(RD), pf={found:{...S.found},seen:{...S.seen},doneS:{...S.doneS},ans:{...(S.ansSeen||{})},preK:S.preK,preVis:S.preVis,fin:S.finished};
  markRd(0,i-1); if(!NOVEL){ S.preK=99; S.preVis=99; }
  /* 前面已经揭晓的伏笔：直接记为已揭晓（不播动效）；答案还在后面的：只记为发现，伏笔页里是没打开的样子 */
  const now=Date.now(); S.ansSeen=S.ansSeen||{};
  SUS.forEach(s=>{ if(!S.view.guide) return; const a=posOf(s['提出']); if(a>=i) return;
    S.found[s.id]=S.found[s.id]||now;   /* 答案还在后面的：只算发现了，打不打开由读者自己决定 */
    if(s['揭晓']&&IDX[s['揭晓']]<i){ S.seen[s.id]=S.seen[s.id]||now; S.doneS[s.id]=S.doneS[s.id]||now; S.ansSeen[s.id]=S.ansSeen[s.id]||now; } });
  save(); closeSheet(); quietFind=true; paintMarks(); quietFind=false; jump(P[i].n);
  const label_=NOVEL?unitName(huiOf(i).n):'命题 '+P[i].n;
  toast(`<div class="tq">已从${label_}开始，前面的内容记为已读。</div><button>撤销</button>`,()=>{
    RD=prev; S.rd=[...RD]; S.furthest=rdMax(); Object.assign(S,{found:pf.found,seen:pf.seen,doneS:pf.doneS,ansSeen:pf.ans,preK:pf.preK,preVis:pf.preVis}); if(!pf.fin) delete S.finished;
    save(); quietFind=true; paintMarks(); quietFind=false; setPos(S.current); },6000);
}
/* "从这里开始读"不常用：按钮放在每回/每节展开后的"本回开头"旁边，收起时看不到；前一段已读过就不显示 */
function wireFrom(root,back){
  /* 导览一次只展开一回：展开一项时收起其他 */
  const ds=[...root.querySelectorAll('.ol details')];
  ds.forEach(d=>d.addEventListener('toggle',()=>{ if(d.open) ds.forEach(o=>{ if(o!==d&&o.open) o.open=false; }); }));
  root.querySelectorAll('[data-from]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); fromConfirm(+b.dataset.from,back); });
}
function fromConfirm(i,back){
  const label_=NOVEL?unitName(huiOf(i).n):'命题 '+P[i].n;
  openSheet(`<div class="shead"><button class="x back" data-bk aria-label="返回导览">‹</button><span class="ttl">从${label_}开始读</span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="sbody"><p class="plain" style="font-size:var(--t-body)">适合在别处已经读过前面的情况。${label_}之前的内容会记为已读：前情、人物和伏笔都会照常显示。</p>
  <p class="plain" style="font-size:var(--t-body)">只会把没读过的补记为已读，不会清掉任何东西：已有的划线、想法、疑问、猜想，已揭晓的伏笔，以及后面已经读过的部分，都原样保留。</p>
  <p class="mini">只是想先看看后面，用"本${NOVEL?UNIT:'节'}开头"跳过去就好，不会算作读过。</p></div>
  <div class="sfoot"><button class="btn ghost" data-bk>取消</button><button class="btn" id="fromGo" style="margin-left:auto">从这里开始读</button></div>`);
  wireBack(back); $('#fromGo').onclick=()=>startFrom(i);
}

/* ---------- 前情回顾 ---------- */
function recap(gap){ if(NOVEL) return novelRecap(gap); return propRecap(); }
/* 重度：前情提要里带上最近打开的一两个还没揭晓的伏笔 */
function openHint(list){ if(!list.length) return ''; const L=list.slice(-2);
  return `<div class="h3">带着这${L.length>1?'两':'个'}问题往下读</div>${L.map(x=>`<div class="q ${x.mine?'mine':''}"><div class="qt">${esc(x.q)}</div>${x.g?`<div class="guess">当时的猜想：${esc(x.g.text)}</div>`:''}</div>`).join('')}`; }
function propRecap(manual){
  const last=P[Math.max(S.current,0)];
  const mains=P.filter((p,i)=>depth(p.n)===0&&isRd(i));
  const {book:open,mine}=unresolved();
  openSheet(`<div class="shead">${manual?'<button class="x back" id="rcBack" aria-label="返回导览">‹</button>':''}<span class="ttl">${manual?'阅读回顾':'继续阅读'}</span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="sbody">
    <p class="plain">上次读到 <span style="font-family:var(--num)">${last.n}</span>。</p>
    <div class="h3">已读的主干</div>
    ${mains.map(p=>`<p class="rcp"><span style="font-family:var(--num);color:var(--mute);margin-right:8px">${p.n}</span>${esc(firstLine(txt(p),80))}</p>`).join('')}
    ${heavy()?openHint([...open.map(s=>({q:s['问题'],g:S.guesses[s.id]})),...mine.map(m=>({q:m.text,g:m.guess?{text:m.guess}:null,mine:1}))]):''}
    ${false&&(open.length||mine.length)?`<div class="h3">未回收的伏笔</div>${open.map(s=>`<div class="q"><div class="qt">${esc(s['问题'])}</div>${S.guesses[s.id]?`<div class="guess">当时的猜想：${esc(S.guesses[s.id].text)}</div>`:''}</div>`).join('')}${mine.map(m=>`<div class="q mine"><div class="qt">${esc(m.text)}</div></div>`).join('')}`:''}
  </div>
  <div class="sfoot"><button class="btn" data-close style="margin-left:auto">继续阅读</button></div>`);
  $('#rcBack')?.addEventListener('click',()=>propOutline());
}


/* ================= 小说：目录（回目 / 人物）、人物卡、打开回顾 ================= */
const DAY=864e5;
const seenTo=()=>Math.max(rdMax(),S.vis??-2);
const REC=()=>D.recap||[];
/* 已经读完的最后一个小节（读到一半的小节不说，免得提前讲出后面的事） */
const secRead=(h,x,lim)=>{ const st=IDX[x['从']||'']??null; const to=IDX[x['到']]; if(to>lim) return false; for(let j=(st??to);j<=to;j++) if(!isRd(j)) return false; return true; };
function secOf(i){ const h=huiOf(i), r=REC().find(x=>x['回']===h.n); if(!r) return null; const done=r['小节'].filter(x=>IDX[x['到']]<=i&&isRd(IDX[x['到']])); return done.length?done[done.length-1]:null; }
function readSecs(h,lim){ const r=REC().find(x=>x['回']===h.n); return r?r['小节'].filter(x=>IDX[x['到']]<=lim&&isRd(IDX[x['到']])):[]; }
function pName(p,lim){
  if(p.nameFrom!=null&&p.nameFrom<=lim&&known(p.nameFrom)) return p.name;
  if(p.early) return p.early;
  const a=p.al.filter(x=>x[1]<=lim&&known(x[1])).sort((x,y)=>x[1]-y[1])[0]; return a?a[0]:p.name;
}
function novelOutline(tab,q){
  /* v9.62：最上面"正在读"一行；搜索收进放大镜；每回一根细进度条 */
  tab=tab||novelOutline.last||'hui'; novelOutline.last=tab;
  const lim=P.length-1;
  q=(q??novelOutline.q??'').trim(); novelOutline.q=q;
  const searching=!!q||novelOutline.srch;
  let body='';
  if(q){ body=searchBody(tab,q,lim); }
  else if(tab==='hui'){
    const curI=Math.max(S.current,0), curH=huiOf(curI);
    body=(RD.size?`<div class="olnow"><button data-go="${P[curI].n}" class="olnb"><span>正在读</span><b>${esc(unitName(curH.n))}</b><em>${pctOf()}%</em></button><button class="olrc" id="olRecap">回顾</button></div>`:'')+(CANEDIT()?`<div class="olchap"><span>章节分得不准？</span><button class="linkbtn" id="olChap">调整章节</button></div>`:'')+HUI.map(h=>{
        const cur=S.current>=h.first&&curH.n===h.n;
        const [a,b]=h.t.split(/\s+|　/);
        const all=(REC().find(x=>x['回']===h.n)||{})['小节']||[]; let prev=h.first;
        const end=(HUI.find(x=>x.n===h.n+1)||{first:P.length}).first;
        let n=0; for(let j=h.first;j<end;j++) if(RD.has(j)) n++;
        const pc=Math.round(n/(end-h.first)*100);
        /* 回目标题本身就是书的目录，都显示；小节概要是对内容的复述，只显示读过的 */
        const kids=all.map(x=>{const s0=prev; prev=IDX[x['到']]+1; return isRd(IDX[x['到']])?`<button data-go="${P[s0].n}"><span>${esc(x['写'])}</span></button>`:'';}).join('');
        const left=all.filter(x=>!isRd(IDX[x['到']])).length;
        return `<details ${cur?'open':''}><summary>${D.titled?'':`<span class="on hn">${h.n===0?'':`第${cnum(h.n)}${UNIT}`}</span>`}<span class="ot">${esc(a)}${b?'<br>'+esc(b):''}</span><span class="olpb" title="已读 ${pc}%" aria-label="${n?`已读 ${pc}%`:'未读'}"><i style="width:${pc}%"></i></span></summary>
          <div class="kids"><div class="olgo"><button data-go="${P[h.first].n}"><span>本${UNIT}开头</span></button>${h.first>0&&!isRd(h.first-1)?`<button class="olfrom" data-from="${h.first}">从这里开始读</button>`:''}</div>${kids}${left&&n?`<p class="fog" style="padding:4px 0">未读的部分不显示概要。</p>`:''}</div></details>`;}).join('');
    body+=`<div class="fog">可以跳到任何一${UNIT}；没翻过的内容不算已读。</div>`;
  } else {
    const lm=seenTo();
    const ps=PEOPLE.filter(p=>p.ap.some(known));
    if(!ps.length) body='<div class="fog">已出场的人物将在此显示。</div>';
    else{
      const by={}; ps.forEach(p=>{const h=huiOf(p.first).n;(by[h]=by[h]||[]).push(p);});
      body=`<p class="mini">按出场先后排列，信息以阅读进度为界。</p>`+Object.keys(by).map(h=>`<div class="h3">${unitName(+h)}</div>${by[h].map(p=>{
        const id=p.ids.filter(x=>x[0]<=lm&&known(x[0])).pop(); const n=p.ap.filter(known).length;
        return `<button class="prow" data-pc="${p.id}"><b>${esc(pName(p,lm))}</b><span>${esc(id?id[1]:'')}</span><small>出场 ${n} 段</small></button>`;}).join('')}`).join('');
    }
  }
  openSheet(`<div class="shead"><span class="ttl">导览</span>
    <div class="seg" role="group" aria-label="导览分类"><button data-ot="hui" aria-pressed="${tab==='hui'}">${D.titled?'篇目':UNIT==='回'?'回目':'章节'}</button><button data-ot="ppl" aria-pressed="${tab==='ppl'}">人物</button></div>
    <button class="x srchb" id="olS" aria-label="搜索" aria-expanded="${searching}">${ic('search','')}</button><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="srch" ${searching?'':'hidden'}><input id="olQ" type="search" enterkeyhint="search" placeholder="${tab==='ppl'?'搜索人物、称呼':'搜索已读正文'}" value="${esc(q)}" aria-label="搜索"></div>
  <div class="sbody"><div class="ol" id="olBody">${body}</div></div>
`,{tall:true});
  const sh=$('#sheet');
  const qi=$('#olQ'); let qt=null;
  $('#olS').onclick=()=>{ const box=sh.querySelector('.srch'), open=box.hidden; box.hidden=!open; novelOutline.srch=open; $('#olS').setAttribute('aria-expanded',String(open)); if(open) qi.focus(); else if(qi.value){ qi.value=''; novelOutline.q=''; novelOutline(tab,''); } };
  qi.oninput=()=>{ clearTimeout(qt); qt=setTimeout(()=>{ novelOutline.q=qi.value.trim(); $('#olBody').innerHTML=novelOutline.q?searchBody(tab,novelOutline.q,lim):''; if(!novelOutline.q){ novelOutline(tab,''); setTimeout(()=>$('#olQ')?.focus(),0); return; } wireOl(); },160); };
  const wireOl=()=>{ sh.querySelectorAll('#olBody [data-pc]').forEach(b=>b.onclick=()=>personCard(+b.dataset.pc,null,'ppl'));
    sh.querySelectorAll('#olBody [data-go]').forEach(b=>b.onclick=()=>{closeSheet();jump(b.dataset.go);}); };
  wireOl();
  sh.querySelectorAll('[data-ot]').forEach(b=>b.onclick=()=>novelOutline(b.dataset.ot));
  sh.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>personCard(+b.dataset.pc,null,'ppl'));
  $('#olRecap')?.addEventListener('click',()=>novelRecap(Infinity,true,true));
  $('#olChap')?.addEventListener('click',()=>chapterEditor());
  wireFrom(sh,()=>novelOutline(tab));
}

/* 导览搜索：人物 = 名字、已出现的称呼、已知身份；回目 = 已读段落的正文。都不越过阅读进度 */
function searchBody(tab,q,lim){
  const lm=seenTo(), hit=t=>t&&t.includes(q);
  const mark=t=>{ const i=t.indexOf(q); if(i<0) return esc(t); const a=Math.max(0,i-18), b=Math.min(t.length,i+q.length+28);
    return (a>0?'…':'')+esc(t.slice(a,i))+`<mark class="qh">${esc(q)}</mark>`+esc(t.slice(i+q.length,b))+(b<t.length?'…':''); };
  if(tab==='ppl'){
    const ps=PEOPLE.filter(p=>p.ap.some(known)).filter(p=>hit(pName(p,lm))||p.al.some(a=>a[1]<=lm&&known(a[1])&&hit(a[0]))||p.ids.some(x=>x[0]<=lm&&known(x[0])&&hit(x[1])));
    if(!ps.length) return `<div class="fog">已出场的人物中没有找到“${esc(q)}”。</div>`;
    return `<p class="mini">找到 ${ps.length} 位</p>`+ps.map(p=>{ const id=p.ids.filter(x=>x[0]<=lm&&known(x[0])).pop(); const al=p.al.find(a=>a[1]<=lm&&known(a[1])&&hit(a[0])&&a[0]!==pName(p,lm));
      return `<button class="prow" data-pc="${p.id}"><b>${esc(pName(p,lm))}</b><span>${al?`也叫 ${mark(al[0])}　`:''}${id?(hit(id[1])?mark(id[1]):esc(id[1])):''}</span><small>出场 ${p.ap.filter(isRd).length} 段</small></button>`;}).join('');
  }
  /* 外文书：中文、原文都搜；当前读哪种语言就先显示哪种 */
  const ql=q.toLowerCase(), has=t=>t&&t.toLowerCase().includes(ql);
  const markI=t=>{ const i=t.toLowerCase().indexOf(ql); if(i<0) return esc(t); const a=Math.max(0,i-18), b=Math.min(t.length,i+q.length+28);
    return (a>0?'…':'')+esc(t.slice(a,i))+`<mark class="qh">${esc(t.slice(i,i+q.length))}</mark>`+esc(t.slice(i+q.length,b))+(b<t.length?'…':''); };
  const res=[]; for(let i=0;i<P.length&&res.length<50;i++){ if(!isRd(i)) continue; const c=[txt(P[i]),P[i].zh,D.orig?P[i][ogl()]:null].find(has); if(c) res.push([i,c]); }
  if(!res.length) return `<div class="fog">已读部分中没有找到“${esc(q)}”。</div>`;
  return `<p class="mini">已读部分中找到 ${res.length}${res.length>=50?'+':''} 处</p>`+res.map(([i,c])=>`<button class="hitrow" data-go="${P[i].n}"><small>${label(i)}</small><span ${c!==P[i].zh?`lang="${ogl()}"`:''}>${markI(c.replace(/⟦img:[^⟧]+⟧/g,'[公式]').replace(/⟦表:[^⟧]*⟧/g,'[表]'))}</span></button>`).join('');
}
/* 人物卡：读到哪就只写到哪（身份、关系、别称、出场都按位置截断） */
function personCard(id,at,back,on){
  const p=PBYID[id]; if(!p) return;
  const lim=Math.max(rdMax(), at??-1, back?seenTo():-1), ok_=x=>x<=lim&&(known(x)||x===at);
  if(at!=null){ S.metP=S.metP||{}; if(!S.metP[id]){S.metP[id]=Date.now();save();} }
  const nm=pName(p,lim);
  const ids=p.ids.filter(x=>ok_(x[0]));
  const al=p.al.filter(x=>ok_(x[1])&&x[0]!==nm).map(x=>x[0]);
  const rels=p.rels.filter(r=>ok_(r[2])&&PBYID[r[0]]);
  const ap=p.ap.filter(ok_);
  const last=ap.filter(x=>x!==at).pop();
  openSheet(`<div class="shead"><span class="ttl">${esc(nm)}</span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="sbody pcard">
    ${al.length?`<p class="aka">也叫 ${al.map(esc).join('、')}</p>`:''}
    <div class="h3" style="margin-top:6px">已知信息</div>
    ${ids.map((x,k)=>`<p class="pid ${k===ids.length-1?'now':''}"><span>${label(x[0])}</span>${esc(x[1])}</p>`).join('')}
    ${rels.length?`<div class="h3">人物关系</div><div class="rels">${rels.map(r=>`<button data-pc="${r[0]}"><b>${esc(pName(PBYID[r[0]],lim))}</b><span>${esc(r[1])}</span></button>`).join('')}</div>`:''}
    <div class="h3">出场</div>
    <p class="mini">至今出场 ${ap.length} 段。</p>
    <div class="aprow">${ap.length?`<button data-go="${P[ap[0]].n}"><small>首次出场　${label(ap[0])}</small><span>${esc(firstLine(txt(P[ap[0]]),22))}</span></button>`:''}${last!=null&&last!==ap[0]?`<button data-go="${P[last].n}"><small>最近出场　${label(last)}</small><span>${esc(firstLine(txt(P[last]),22))}</span></button>`:''}</div>
    
  </div>
  ${(()=>{ const nn=on&&on.nt!=null&&S.notes.find(x=>x.id===on.nt), uu=on&&on.ul!=null&&S.ul.find(x=>x.id===on.ul);
     const rec=uu?`<button class="btn ghost" id="pcRec" style="margin-left:auto">${ic('hl','i')} 查看划线</button>`:nn?`<button class="btn ghost" id="pcRec" style="margin-left:auto">${ic(nn.type==='note'?'note':'ask','i')} 查看${nn.type==='note'?'想法':isFb(nn)?'伏笔':'疑问'}</button>`:'';
     return back||rec?`<div class="sfoot">${back?`<button class="btn ghost" id="pcBack">‹ 人物列表</button>`:''}${rec}</div>`:''; })()}`);
  $('#pcRec')?.addEventListener('click',()=>{ on.ul!=null&&S.ul.some(x=>x.id===on.ul)?hlSheet(on.ul):noteSheet(on.nt); });
  const sh=$('#sheet');
  sh.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>personCard(+b.dataset.pc,null,back||'card'));
  $('#pcBack')?.addEventListener('click',()=>novelOutline('ppl'));
}
/* 打开回顾：隔得越久越详细（一天内只一句；一天到一周加上这一回读过的部分；一周以上再加前面各回） */
function novelRecap(gap,manual,fromOl){
  const cur=Math.max(S.current,0), h=huiOf(cur), sec=secOf(cur);
  const {book:open,mine}=unresolved();
  const long=gap==null||gap>7*DAY, mid=long||gap>DAY||heavy();   /* 重度：每次都带上这一回已读部分 */
  const ago=gap==null||gap===Infinity||gap<DAY?'':`距上次阅读 ${Math.floor(gap/DAY)} 天。`;
  const secs=readSecs(h,cur);
  const prev=REC().filter(r=>r['回']<h.n);
  const fresh=[...open.map(s=>({q:s['问题'],g:S.guesses[s.id]})),...mine.map(m=>({q:m.text,g:m.guess?{text:m.guess}:null,mine:1}))];
  openSheet(`<div class="shead">${fromOl?'<button class="x back" id="rcBack" aria-label="返回导览">‹</button>':''}<span class="ttl">${manual?'阅读回顾':'继续阅读'}</span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="sbody">
    <p class="plain">${ago}上次读到${unitName(h.n)}${sec?`。此前：${esc(sec['写'])}`:'开头。'}</p>
    ${mid&&secs.length>1&&!(secs.length===1)?`<div class="h3">${unitName(h.n)}已读部分</div>${secs.map(x=>`<p class="rcp">${esc(x['写'])}</p>`).join('')}`:''}
    ${long&&prev.length?`<div class="h3">前面几${UNIT}</div>${prev.map(r=>`<p class="rcp">${esc(r['一句话'])}</p>`).join('')}`:''}
    ${!manual&&heavy()&&fresh.length?openHint(fresh):''}

/* ================= 读书札记（原“推理档案”“导出读书笔记”，2026-10-19 并进笔记）：伏笔、当时的猜想、后来怎样；划线和想法；问过的问题。只陈列，不打分 ================= */
function archiveData(){
  const clues=SUS.filter(s=>S.seen[s.id]).map(s=>({src:s['提出'],q:s['问题'],g:S.guesses[s.id],st:S.doneS[s.id]?`在${NOVEL?lab(s['揭晓']):' '+s['揭晓']+' '}揭晓`:'未揭晓',done:!!S.doneS[s.id],ans:S.doneS[s.id]?s['兑现说明']:''}));
  const fbs=S.notes.filter(isFb).map(n=>({src:n.at,q:n.text,g:n.guess?{text:n.guess,conf:n.conf}:null,st:n.done?(n.rv?`在${NOVEL?lab(n.rv):' '+n.rv+' '}揭晓`:'已揭晓'):'未揭晓',done:!!n.done,mine:1}));
  const mine=S.notes.filter(n=>n.type==='q'&&!isFb(n)).map(n=>({at:n.at,q:n.text,g:null,st:n.done?'已解答':'待解答',done:!!n.done,ans:n.done&&n.ans?n.ans:''}));
  const asked=S.notes.filter(n=>n.type==='qa').map(n=>({at:n.at,q:n.text,a:(QA.find(x=>x.id===n.qa)||{})['回答']||''}));
  const marks=S.ul.map(u=>({at:u.at,text:u.text,note:(S.notes.find(n=>n.hl===u.id&&n.type==='note')||{}).text||''}));
  S.notes.filter(n=>n.type==='note'&&!n.hl).forEach(n=>marks.push({at:n.at,text:n.quote||'',note:n.text}));
  marks.sort((a,b)=>a.at-b.at);
  return {clues,fbs,mine,asked,marks};
}
/* 读后感（导出札记时放在最前面）：以读者口吻，把划线、想法里反复出现的关注点连成一段。记录太少不生成 */
function reflectStat(){ const A=archiveData(), th=A.marks.filter(x=>x.note).length, n=S.ul.length+S.notes.filter(x=>x.type==='note'&&!x.hl).length+A.mine.length+A.fbs.length+A.asked.length+Object.keys(S.guesses||{}).length; return {n,th,ok:n>=5&&th>=1}; }
const RF_EX={

  lhz:['假设读到第八章，划线 6 条、写过 3 条想法','读到第八章，我原先以为这是一本给李鸿章翻案的书，读下来不完全是。梁启超一边替他说话，说议和是“当戎马压境之际”谁去都难，一边又不停地追问他自己的毛病：为什么三十年办洋务，到头来只学了“皮毛”。我划的几句都和这个有关。最让我停下来的是绪论里那句“吾敬李鸿章之才，吾惜李鸿章之识，吾悲李鸿章之遇”，当时只觉得是漂亮话，现在才明白这三个字是全书的三条线。'],

  return `<div class="rf"><div class="rfh"><b>读后感</b>${ex?'<button class="linkbtn" id="rfEx" aria-expanded="false">看示例</button>':''}</div><p class="rfs">${st}</p>${ex?`<div class="rfx" id="rfX" hidden><div class="rfm rfmh"><span>示例 · ${esc(ex[0])}</span>${cp('ex')}</div><p>${esc(ex[1])}</p><div class="rfm">以你的口吻写成，可直接修改</div></div>`:''}</div>`;

const BOOKT={hlm:'《红楼梦》前五回',tractatus:'《逻辑哲学论》',nahan:'《呐喊》',lhz:'《李鸿章传》',hound:'《巴斯克维尔的猎犬》'};
function archiveMD(){
  const A=archiveData(), L=[`# ${BOOKT[BK]} · 读书札记`,'',`写于 ${mdate(Date.now())}　${S.finished?`已读完（${mdate(S.finished)}）`:`读到${S.current>=0?label(S.current):'开头'}（已读 ${pctOf()}%）`}`,''];
  const g=x=>x.g?`　猜想：${x.g.text}${x.g.conf?`（${x.g.conf} 成把握）`:''}`:'　（未写猜想）';
  if(S.reflect&&S.reflect.text) L.push('## 读后感','',S.reflect.text,'');
  if(A.clues.length||A.fbs.length){L.push('## 伏笔','');[...A.clues.map(x=>({...x,pos:posOf(x.src)})),...A.fbs.map(x=>({...x,pos:x.src}))].sort((a,b)=>a.pos-b.pos).forEach(x=>L.push(x.mine?`- 【我发现的 · ${label(x.src)}】${x.q}`:`- 【书中伏笔 · ${lab(x.src)}】${x.q}`,`  ${g(x).trim()}`,`  结果：${x.st}${x.ans?'。'+x.ans:''}`));L.push('');}
  if(A.marks.length){L.push('## 划线和想法','');let h='';A.marks.forEach(x=>{const k=label(x.at);if(k!==h){L.push(`### ${k}`);h=k;}L.push(`> ${x.text}`);if(x.note)L.push('',`想法：${x.note}`);L.push('');});}
  if(A.asked.length||A.mine.length){L.push('## 疑问','');
    [...A.mine.map(x=>({...x,k:'m'})),...A.asked.map(x=>({...x,k:'a'}))].sort((a,b)=>a.at-b.at).forEach(x=>{
      if(x.k==='a') L.push(`- 【${label(x.at)}】${x.q}`,`  ${x.a}`);
      else L.push(`- 【${label(x.at)}】${x.q}`,`  ${x.st}${x.ans?'。我记下的答案：'+x.ans:''}`);});
    L.push('');}
  if(L.length<5) L.push('暂无记录。');
  return L.join('\n');
}
const mdBody=t=>t.replace(/^写于 [^\n]*/m,'');   /* 比较内容时忽略日期 */
/* 极简 Markdown 预览：标题、引用、列表、段落 */
function mdHTML(t){
  const out=[]; let list=false;
  const close=()=>{ if(list){out.push('</ul>');list=false;} };
  t.split('\n').forEach(line=>{
    if(/^###\s/.test(line)){close();out.push(`<h5>${esc(line.slice(4))}</h5>`);}
    else if(/^##\s/.test(line)){close();out.push(`<h4>${esc(line.slice(3))}</h4>`);}
    else if(/^#\s/.test(line)){close();out.push(`<h3 class="mt">${esc(line.slice(2))}</h3>`);}
    else if(/^>\s?/.test(line)){close();out.push(`<blockquote>${esc(line.replace(/^>\s?/,''))}</blockquote>`);}
    else if(/^-\s/.test(line)){ if(!list){out.push('<ul>');list=true;} out.push(`<li>${esc(line.slice(2))}`); }
    else if(/^\s{2,}\S/.test(line)&&list){ out.push(`<div class="sub">${esc(line.trim())}</div>`); }
    else if(!line.trim()){ close(); }
    else if(/^写于 /.test(line)){ close(); out.push(`<p class="meta">${esc(line)}</p>`); }
    else { close(); out.push(`<p>${esc(line)}</p>`); }
  });
  close(); return out.join('');
}
/* 导出预览：先看、可改、再导出。改过的内容按书保存；笔记有更新时提示是否重新生成 *//* 札记：把划线、想法、伏笔、疑问整理成一篇，排成书里的一页；读后感在最前。可以编辑（点"编辑"原地变成输入框）、复制、导出 */

    <div id="arcView">${reflectHTML()}<div class="mdv">${mdHTML(S.reflect&&S.reflect.text?text.replace('## 读后感\n\n'+S.reflect.text+'\n',''):text)}</div></div>
