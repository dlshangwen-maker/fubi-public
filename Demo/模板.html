<!doctype html>
<html lang="zh-CN" data-theme="sage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEE7">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%229%22 fill=%22%23ECEEE7%22/%3E%3Cg transform=%22translate(20 21) scale(1.28) translate(-20 -20)%22%3E%3Crect x=%2218.2%22 y=%222.5%22 width=%223.6%22 height=%2212%22 rx=%221.3%22 fill=%22%231E2622%22/%3E%3Crect x=%2216.8%22 y=%2212.6%22 width=%226.4%22 height=%222.8%22 rx=%221%22 fill=%22%231E2622%22/%3E%3Cpath d=%22M17.4 15.6H22.6Q26.4 21.5 24.8 28Q23 34 20 38Q17 34 15.2 28Q13.6 21.5 17.4 15.6Z%22 fill=%22%23B23A2E%22/%3E%3C/g%3E%3C/svg%3E">
<title>伏笔</title>
<style>
:root{
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai",serif;
  --num:"Iowan Old Style","Palatino","Book Antiqua",Georgia,serif;
  --ui:var(--sans);
  --body:var(--serif);
  --fs:18px; --lh:1.9; --pad:20px;
  /* 字号层级（界面文字固定，不随正文字号变） */
  --t-page:22px; --t-panel:17px; --t-key:17px; --t-body:15px; --t-group:13px; --t-aux:13px; --t-tag:12px; --t-nav:11px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* 主题 */
[data-theme=sage]{color-scheme:light;--paper:#ECEEE7;--paper2:#E2E5DC;--ink:#1E2622;--ink2:#38423D;--mute:#69736D;--faint:#9CA49F;--line:#CDD2C9;--sheet:#F6F7F3;--field:#F6F7F3;--blue:#2F4A8C;--blue-soft:#DCE2EF;--hl:#B23A2E;--hl-soft:rgba(178,58,46,.14);--mark:rgba(178,58,46,.08);--on-hl:#F6F2EC;--scrim:rgba(31,42,38,.18);--img:multiply;--imgf:none}
[data-theme=white]{color-scheme:light;--paper:#FBFBF9;--paper2:#EEEEEA;--ink:#1D1D1B;--ink2:#2E2E2B;--mute:#6B6B66;--faint:#A2A29C;--line:#DDDDD7;--sheet:#FFFFFF;--field:#F6F6F3;--blue:#2F4A8C;--blue-soft:#E1E6F2;--hl:#B23A2E;--hl-soft:rgba(178,58,46,.13);--mark:rgba(178,58,46,.07);--on-hl:#FFF8F2;--scrim:rgba(0,0,0,.16);--img:multiply;--imgf:none}
[data-theme=sepia]{color-scheme:light;--paper:#F1E8D4;--paper2:#E6DBC2;--ink:#3A2E20;--ink2:#46392A;--mute:#7C6D58;--faint:#A89A82;--line:#D8CBB0;--sheet:#F8F1E3;--field:#FFFBF2;--blue:#3A5590;--blue-soft:#E0DCD4;--hl:#A8382B;--hl-soft:rgba(168,56,43,.14);--mark:rgba(168,56,43,.08);--on-hl:#FBF3E6;--scrim:rgba(58,46,32,.18);--img:multiply;--imgf:none}
[data-theme=night]{color-scheme:dark;--paper:#151918;--paper2:#22282A;--ink:#C8CEC9;--ink2:#B9C0BB;--mute:#858D88;--faint:#5E6662;--line:#2C3331;--sheet:#1C2120;--field:#252B2A;--blue:#94AEE6;--blue-soft:#25304A;--hl:#D9705F;--hl-soft:rgba(217,112,95,.20);--mark:rgba(217,112,95,.10);--on-hl:#151918;--scrim:rgba(0,0,0,.45);--img:normal;--imgf:invert(.86) hue-rotate(180deg)}
[data-font=sans]{--body:var(--sans)}
[data-font=kai]{--body:var(--kai)}
[data-rails=off] .prop .rail{visibility:hidden}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);transition:background .25s,color .25s}
body{font-family:var(--body);font-size:var(--fs);line-height:var(--lh);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.app{max-width:560px;margin:0 auto;position:relative;min-height:100vh}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- 书架 ---------- */
.shelf{padding:56px 24px 40px;font-family:var(--ui)}
.brand{display:flex;align-items:center;gap:9px;margin:0 0 30px;color:var(--ink)}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.16em}
.brand small{font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);letter-spacing:.06em;margin:7px 0 0 4px;align-self:center}
.shelf h1{font-family:var(--serif);font-weight:600;font-size:var(--t-page);margin:0 0 4px;letter-spacing:.06em}
.shelf .lede{color:var(--mute);font-size:var(--t-aux);margin:0 0 36px}
.book{display:flex;gap:18px;align-items:stretch;padding:18px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.book:last-of-type{border-bottom:1px solid var(--line)}
.cover{width:84px;flex:none;aspect-ratio:3/4.3;background:#1E2622;color:#ECEEE7;display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px;font-family:var(--serif)}
.cover .ct{font-size:14px;line-height:1.35;letter-spacing:.06em}
.cover .cn{font-family:var(--num);font-size:30px;line-height:1;opacity:.9}
.cover.st{background:#2B3340}
.binfo{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
.binfo .t{font-family:var(--serif);font-size:var(--t-key);font-weight:600}
.binfo .a{font-size:var(--t-aux);color:var(--mute)}
.binfo .p{font-size:var(--t-aux);color:var(--ink2);margin-top:6px}
.book{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.book[aria-disabled=true]{opacity:.55;cursor:default}
.book:active .cover{transform:scale(.97)}
.cover{transition:transform .2s}
dl.meta{margin:0;display:grid;grid-template-columns:5.5em 1fr;gap:10px 12px;font-size:var(--t-body);line-height:1.65}
dl.meta dt{color:var(--mute)}
dl.meta dd{margin:0}
dl.meta dd i{font-family:var(--num)}
.binfo .fb{font-size:var(--t-aux);color:var(--ink2);display:flex;align-items:center;gap:7px;margin-top:2px}
.binfo .fb .dia{width:8px;height:8px;background:var(--hl);transform:rotate(45deg);border-radius:1.5px;flex:none}
.welrow{display:flex;gap:14px;align-items:flex-start;font-family:var(--ui)}
.welrow b{display:block;font-size:var(--t-key);font-weight:600;margin-bottom:3px}
.welrow>div>span{display:block;font-size:var(--t-aux);line-height:1.6;color:var(--mute)}
.welrow>div{line-height:1.4}
.welic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.welic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gemic i{width:11px;height:11px;background:var(--hl);transform:rotate(45deg);border-radius:2px;display:block}
.shabout{margin-left:auto;align-self:center;font-family:var(--ui);font-size:var(--t-aux);color:var(--mute);padding:6px 2px}
.about .abl{font-family:var(--serif);font-size:var(--t-body);color:var(--ink2);margin:0 0 18px}
.about .welrow{margin-bottom:16px}
.shh{display:flex;align-items:baseline;gap:12px}.shh .shacts{margin-left:auto;display:flex;align-items:baseline;gap:8px;font-size:var(--t-aux)}.shh .shacts .linkbtn{cursor:pointer}.shdot{color:var(--faint)}
.lib{font-family:var(--ui)}
.libsearch{display:block;position:sticky;top:0;z-index:2;background:var(--paper);padding:6px 0 10px}
.libsearch input{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:var(--t-body)}
.libg h2{font-family:var(--serif);font-size:var(--t-key);font-weight:600;margin:22px 0 4px;display:flex;align-items:baseline;gap:10px}
.libg h2 small{font-family:var(--ui);font-weight:400;font-size:var(--t-tag);color:var(--mute)}
.librow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.libt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.libt b{font-family:var(--serif);font-size:var(--t-body);font-weight:600}
.libt i{font-style:normal;font-size:var(--t-tag);color:var(--faint)}
.libt span{font-size:var(--t-aux);color:var(--mute)}
.libt p{margin:2px 0 0;font-size:var(--t-aux);color:var(--ink2);line-height:1.5}
.librow .btn{flex:none;white-space:nowrap}
.libsoon{flex:none;font-size:var(--t-tag);color:var(--faint)}
.libnone{font-size:var(--t-body);margin:24px 0 8px}
.libh{font-family:var(--ui);font-size:var(--t-aux);font-weight:400;color:var(--mute);margin:14px 0 10px}
.hotw{display:flex;flex-wrap:wrap;gap:8px}
.hotw button{padding:6px 12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-aux);color:var(--ink)}
.librow.off .libt b{color:var(--mute)}
.libt p.libwhy,.libwhy{color:var(--mute);font-size:var(--t-tag)}
.libwait{margin-top:18px}
.clmain{display:flex;gap:8px;align-items:center;font-size:var(--t-aux);color:var(--mute);margin:0 0 12px;line-height:1.6}.clmain .mltag{flex:none}

.librow[data-pv]{cursor:pointer}
.pvorig{margin:-6px 0 10px;color:var(--faint);font-size:var(--t-aux)}
.fbook{padding:16px 0 14px;border-bottom:1px solid var(--line)}
.fbook .ft{display:block;font-family:var(--serif);font-size:var(--t-key);font-weight:600}
.fbook .fo{display:block;font-style:normal;font-size:var(--t-tag);color:var(--faint);margin-top:2px}
.fbook .fi{font-family:var(--serif);font-size:var(--t-body);line-height:1.75;margin:8px 0 6px;color:var(--ink)}
.fbook .fm{font-size:var(--t-aux);color:var(--mute);margin:0 0 4px;line-height:1.6}.fbook .fen{color:var(--faint);font-size:var(--t-tag)}
.fbook.off .ft{color:var(--mute)}
.fsrcs{margin-top:8px}.fsh{display:block;font-size:var(--t-tag);color:var(--faint);margin-bottom:2px}
.fsrc{display:flex;align-items:center;gap:10px;padding:7px 0}.fsrc>span{flex:1;display:flex;flex-direction:column;font-size:var(--t-aux);color:var(--ink)}.fsrc small{font-size:var(--t-tag);color:var(--faint)}.fsrc .btn{flex:none;padding:6px 14px}
.pven{display:block;color:var(--faint);font-size:var(--t-tag)}
.pvintro{font-family:var(--serif);font-size:var(--t-body);line-height:1.8;margin:4px 0 14px}
.pvsum{margin:10px 0}.pvsum summary{font-size:var(--t-aux);color:var(--ink);cursor:pointer}.pvsum p{font-size:var(--t-aux);color:var(--ink2);line-height:1.7;margin:6px 0 0}
.pvh{font-family:var(--ui);font-size:var(--t-aux);font-weight:400;color:var(--mute);margin:20px 0 4px}
.pvsrc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.pvsrc>div{flex:1;display:flex;flex-direction:column;gap:2px}.pvsrc b{font-weight:600;font-size:var(--t-body)}.pvsrc small{font-size:var(--t-tag);color:var(--mute)}
.pvsz{font-size:var(--t-aux);color:var(--mute);margin:16px 0 6px}
.pvtoc summary{font-size:var(--t-aux);color:var(--ink);cursor:pointer}.pvtoc ol{margin:6px 0 0;padding-left:20px;font-size:var(--t-aux);color:var(--ink2);line-height:1.8}
.pvtext{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--serif);font-size:var(--t-body);line-height:1.8;color:var(--ink)}
.pvtext h3{font-size:var(--t-key);font-weight:600;margin:0 0 8px}.pvtext p{margin:0 0 10px;text-indent:2em}
.chrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chrow .chname{flex:1 1 100%;font:inherit;font-family:var(--serif);font-size:var(--t-body);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
.chrow small{color:var(--mute);font-size:var(--t-tag)}
.chrow .linkbtn{margin-left:auto;font-size:var(--t-aux)}
.chrow.merged{opacity:.5}.chrow.merged .chname{text-decoration:line-through}
.impbox{margin-top:0;padding-top:8px}
.book:last-of-type{border-bottom:0}
.impbox .mini{margin-top:8px}
.impbox label.btn{display:block;text-align:center;cursor:pointer}
.impend{display:flex;flex-direction:column;gap:2px;padding:10px 0;font-size:var(--t-aux)}
.impend span{color:var(--mute)}
.impend.failed span{color:#A33A2A}
.shelf .foot{margin-top:28px;font-size:var(--t-tag);color:var(--faint);line-height:1.7}

/* ---------- 顶栏 ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:10px 12px;font-family:var(--ui);font-size:var(--t-aux);border-bottom:1px solid transparent;transition:border-color .2s,transform .25s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .back{padding:6px 8px;color:var(--mute)}
.bar .where{flex:1;text-align:center;color:var(--mute);font-family:var(--num);font-size:var(--t-body)}
.bar .where b{color:var(--ink);font-weight:600}
.bar .where small{font-family:var(--ui);font-size:var(--t-tag);margin-left:6px}
.bar .aa{padding:6px 8px;color:var(--mute);display:flex;align-items:center}
.bar .aa[aria-pressed=true]{color:var(--blue)}
.bar .aa[aria-pressed=true] svg{fill:var(--blue)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--line);opacity:.55}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--blue);border-radius:0 2px 2px 0;opacity:.85;transition:width .3s;z-index:1}

/* ---------- 正文 ---------- */
.text{padding:8px var(--pad) 160px}
.pre h2{font-size:1.05em;font-weight:600;letter-spacing:.3em;margin:28px 0 10px}
.pre p{margin:0 0 .9em;text-align:justify}
.pre .sig{text-align:right;color:var(--mute);font-size:.9em}
.pre{position:relative}
.pre .pp{position:relative;padding-right:22px}
.pre .pp .marks{top:2px}
.pre .pp.on{background:var(--blue-soft);border-radius:4px}
.pre .pp.hasqa{cursor:pointer}
.askbox{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.askbox b{display:flex;align-items:center;gap:6px;font-size:var(--t-group);color:var(--mute);font-weight:600;margin-bottom:8px}
.askbox b svg{width:15px;height:15px;stroke:var(--blue);fill:none;stroke-width:1.8;display:block}
.askit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font-family:var(--serif);font-size:var(--t-body);line-height:1.5;padding:10px 12px;margin:0 0 8px;border-radius:10px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.askit small{font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);white-space:nowrap}
.anchor{background-image:linear-gradient(transparent 60%,var(--hl-soft) 60%)}
.anchor.fade{transition:background-size 1s;background-size:100% 100%}
.hint{font-family:var(--ui);font-size:var(--t-aux);color:var(--ink2);margin:6px 0 0 0;display:flex;gap:6px;align-items:center}
.hint::before{content:"";width:14px;height:1px;background:var(--blue)}

.prop{position:relative;display:grid;grid-template-columns:var(--rail,0px) 1fr;cursor:pointer;scroll-margin-top:72px}
.prop .rail{display:flex;gap:7px;justify-content:flex-start;padding-left:2px}
.prop .rail i{width:1px;background:var(--line);display:block}
.prop .body{padding:7px 18px 7px 10px;border-radius:4px;transition:background .25s}
.prop .num{font-family:var(--num);font-variant-numeric:oldstyle-nums;color:var(--mute);font-size:.82em;letter-spacing:.02em;display:block;line-height:1.4}
.prop .zh p{margin:0 0 .45em}
.prop .zh p:last-child{margin-bottom:0}
.prop .zh img{height:1.5em;vertical-align:middle;mix-blend-mode:var(--img);filter:var(--imgf)}
.tblw{overflow-x:auto;margin:.4em 0 .6em;-webkit-overflow-scrolling:touch}
.ttbl{border-collapse:collapse;font-size:.82em;line-height:1.5;font-family:var(--body)}
.ttbl th,.ttbl td{border:1px solid var(--line);padding:2px 8px;text-align:center;vertical-align:top}
.prop.para .ttbl{font-size:.8em;line-height:1.5;min-width:100%}
.prop.para .ttbl td,.prop.para .ttbl th{padding:3px 6px;min-width:2.6em}
.prop.para .ttbl td{text-align:left}
.ttbl td.nw{white-space:nowrap}
.ttbl th{border-bottom:2px solid var(--mute);font-weight:400}
.prop .zh img.block{display:block;height:auto;max-width:100%;max-height:7em;margin:.4em 0}
.prop.d0{margin-top:34px}
.prop.d0 .num{font-size:2.3em;color:var(--ink);line-height:1;margin-bottom:6px}
.prop.d0 .zh{font-size:1.18em;font-weight:600;line-height:calc(var(--lh) - .2)}
.prop.d1 .body{padding-top:12px}
.prop.d1 .num{color:var(--ink)}
.prop.deep .zh{font-size:.94em;color:var(--ink2)}
.prop.on .body{background:var(--blue-soft)}
.prop,.pre{-webkit-user-select:text;user-select:text}
mark.ul{background:none;color:inherit;background-image:linear-gradient(transparent 84%,var(--hl) 84%,var(--hl) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer;border-radius:1px}
mark.nt{background:none;color:inherit;text-decoration:underline dotted var(--blue);text-decoration-thickness:1.5px;text-underline-offset:6px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.nt.ntq{text-decoration-style:wavy;text-decoration-thickness:1px}
@property --swc{syntax:'<color>';inherits:false;initial-value:transparent}
mark.swline{background:none;color:inherit;--swc:var(--hl-soft);background-image:linear-gradient(transparent 48%,var(--swc) 48%);background-repeat:no-repeat;background-size:0% 100%;background-position:left;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:swl 2s cubic-bezier(.5,.1,.3,1) forwards}
@keyframes swl{0%{background-size:0% 100%;--swc:var(--hl-soft)}30%{background-size:100% 100%;--swc:var(--hl-soft)}70%{background-size:100% 100%;--swc:var(--hl-soft)}100%{background-size:100% 100%;--swc:transparent}}
mark.ul.flash{background-color:var(--blue-soft);transition:background-color .6s}
::selection{background:var(--blue-soft)}
/* 选字菜单 */
.selmenu{position:fixed;z-index:35;display:flex;background:var(--ink);color:var(--paper);border-radius:10px;padding:3px;font-family:var(--ui);font-size:var(--t-aux);box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s,transform .15s,visibility .15s;-webkit-user-select:none;user-select:none}
.selmenu.show{opacity:1;visibility:visible;transform:none}
.selmenu button{display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:7px;white-space:nowrap}
.selmenu button+button{box-shadow:-1px 0 0 color-mix(in srgb,var(--paper) 18%,transparent)}
.selmenu svg.i{width:17px;height:17px}
.selmenu svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.selmenu .mlab{display:flex;align-items:center;padding:0 10px 0 12px;font-size:var(--t-tag);opacity:.65;white-space:nowrap}
/* 轻量输入条 */
.qscrim{position:fixed;inset:0;z-index:44;background:transparent;transition:background .2s}
.qscrim.show{background:rgba(0,0,0,.06)}
.qbar{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;z-index:45;background:var(--sheet);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(0,0,0,.10);padding:10px 12px calc(10px + var(--safe-b));font-family:var(--ui);transform:translate(-50%,105%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.qbar.show{transform:translate(-50%,0)}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qseg{display:inline-flex;background:var(--paper2);border-radius:10px;padding:3px;gap:2px}
.qseg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;font-size:var(--t-aux);line-height:1;border-radius:8px;color:var(--mute);white-space:nowrap}
.qseg button svg{display:block;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.qseg button[aria-pressed=true]{background:var(--field);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qseg button[data-k=q][aria-pressed=true]{background:var(--hl);color:var(--on-hl)}
.qhint{flex:1;font-size:var(--t-tag);color:var(--faint);line-height:1.4}
.qdone{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--hl-soft);color:var(--ink);font-size:var(--t-aux);line-height:1}
.qdone svg{display:block;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qpick{display:flex;gap:10px}
.qpick button{flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-size:var(--t-body);line-height:1;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);background:var(--field)}
.qpick button svg{display:block;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qpick button[data-k=q]{background:var(--hl);color:var(--on-hl);box-shadow:none}
.qx{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:22px;line-height:1;flex:none;border-radius:50%}
.qquote{font-family:var(--serif);font-size:var(--t-aux);line-height:1.6;color:var(--mute);border-left:2px solid var(--hl);padding:0 0 0 10px;margin:0 0 10px;max-height:30vh;overflow-y:auto;overscroll-behavior:contain}
.qrow{display:flex;align-items:flex-end;gap:8px}
.qrow textarea{flex:1;min-height:44px;max-height:120px;resize:none;font:15.5px/1.6 var(--serif);border-radius:22px;padding:10px 16px;overflow-y:auto;border:1px solid var(--line)}
.qrow textarea:focus,.qrow textarea:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.qsend{width:44px;height:44px;border-radius:50%;background:var(--line);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.qsend.on{background:var(--ink)}
.qfoot{display:none}
.qsend svg{display:block;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qsug{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;scrollbar-width:none;align-items:center}
.qsug span{font-size:var(--t-tag);color:var(--faint);white-space:nowrap}
.qsug button{font-size:var(--t-aux);white-space:nowrap;padding:5px 10px;border-radius:14px;background:var(--paper2);color:var(--ink2)}
/* 回答 */
.askq{display:flex;gap:8px;align-items:flex-start;font-family:var(--serif);font-size:var(--t-key);line-height:1.6;margin:2px 0 12px;padding:10px 12px;background:var(--paper2);border-radius:10px}
.askq svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:1.7;flex:none;margin-top:4px}
.refrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:var(--t-aux);color:var(--mute)}
.refchip{font-family:var(--num);font-size:var(--t-aux);color:var(--blue);padding:3px 10px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--blue-soft);background:var(--field)}
.linkbtn{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-size:var(--t-aux);padding:6px 0}
.linkbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.tag.t-qa{background:var(--blue-soft);color:var(--blue)}
.q.qa .qt{border-left-color:var(--blue-soft)}
.og{display:none;white-space:pre-line}
[data-lang=both] .og{display:block;font-size:.84em;line-height:1.7;color:var(--mute);margin-top:.4em;font-family:var(--ogfont,Georgia,'Times New Roman',serif)}
[data-lang=orig] .og{display:block;font-family:var(--ogfont,Georgia,'Times New Roman',serif)}
[data-lang=orig] .prop .zh,[data-lang=orig] .pp > p,[data-lang=orig] .foot1 .zt,[data-lang=orig] .pre h2 .zt{display:none}
html{overflow-anchor:none}
.og{hyphens:auto;-webkit-hyphens:auto}
[data-lang=orig] .pre .sig .zt{display:none}
[data-lang=orig] .pre h2 .og{display:inline!important;font-size:1em;color:inherit}
.foot1 .og{font-size:1em;margin-top:.3em}
[data-lang=orig] .pre .pp,[data-lang=both] .pre .pp{margin-bottom:.9em}
.bar .lg{font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);padding:4px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);margin-right:2px;white-space:nowrap}
.quote.zhq b{display:block;font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);font-weight:600;margin-bottom:2px}
.foot1{font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);line-height:1.7;margin:8px 0 0 0;padding-left:10px;border-left:2px solid var(--line)}
.prop.sweep .zh{background-image:linear-gradient(transparent 58%,var(--hl-soft) 58%);background-repeat:no-repeat;background-size:0% 100%;animation:sweep 1.6s .2s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes sweep{to{background-size:100% 100%}}
.endmark{text-align:center;color:var(--faint);font-family:var(--num);margin:60px 0 0;letter-spacing:.5em}

/* 页边标记：伏笔 / 书签 / 笔记 */
.marks{position:absolute;right:-8px;top:8px;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:2}
.marks.abs{top:0;bottom:0;width:26px;display:block}
.marks.abs .mk{position:absolute;left:0}
.mk{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--mute);position:relative}
/* 正文里没打开的伏笔：持续闪光（打开后变成空心菱形，不再闪） */
.mk.clue .gem{position:relative;overflow:hidden}
.mk.clue:not(.seen):not(.solved) .gem{animation:glint 2.4s ease-in-out infinite}
.mk.clue:not(.seen):not(.solved) .gem::after{content:"";position:absolute;inset:-4px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 2.4s ease-in-out infinite}
.mk.clue:not(.seen):not(.solved)::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,var(--hl-soft) 0,transparent 70%);animation:halo 2.4s ease-in-out infinite;pointer-events:none}
@keyframes glint{0%,100%{box-shadow:0 0 0 0 transparent;transform:rotate(45deg) scale(1)}50%{box-shadow:0 0 8px 2px var(--hl-soft);transform:rotate(45deg) scale(1.18)}}
@keyframes sheen{0%,45%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
@keyframes halo{0%,100%{transform:scale(.6);opacity:.2}50%{transform:scale(1.5);opacity:1}}
/* 底部“伏笔”按钮：埋入 / 回收特效 */
.fxbox{position:absolute;left:50%;top:4px;width:60px;height:96px;margin-left:-30px;transform:translateY(-74px);pointer-events:none;overflow:visible}
.fxclip{position:absolute;left:0;right:0;top:0;height:86px;clip-path:inset(-300px -80px 0 -80px)}   /* 下沿 = 图标里的地平线：菱形穿过它就“埋进去了” */
.fxgem{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;background:var(--hl);border-radius:2px;transform:rotate(45deg);box-shadow:0 0 12px 3px var(--hl-soft)}
.fx-bury .fxgem{top:-20px;animation:bury .6s cubic-bezier(.55,0,.8,.4) forwards}
@keyframes bury{0%{transform:translateY(0) rotate(45deg);opacity:0}15%{opacity:1}70%{transform:translateY(96px) rotate(225deg)}100%{transform:translateY(118px) rotate(225deg);opacity:1}}
.fxdust{position:absolute;left:50%;top:86px;width:44px;height:8px;margin:-4px 0 0 -22px;border-radius:50%;border:2px solid var(--hl);opacity:0}
.fx-bury .fxdust{animation:dust .45s .4s ease-out forwards}
.fx-bury .fxdust.d2{animation-delay:.5s}
@keyframes dust{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.7,1.3);opacity:0}}
.fx-rise .fxgem{top:96px;animation:rise .7s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes rise{0%{transform:translateY(0) rotate(45deg) scale(.8)}55%{transform:translateY(-62px) rotate(-135deg) scale(1.35)}80%{transform:translateY(-58px) rotate(-135deg) scale(1.2);opacity:1}100%{transform:translateY(-66px) rotate(-135deg) scale(.4);opacity:0}}
.fxrays{position:absolute;left:50%;top:40px;width:0;height:0}
.fxrays i{position:absolute;left:-1px;top:-14px;width:2px;height:9px;border-radius:1px;background:var(--hl);transform-origin:1px 14px;opacity:0}
.fx-rise .fxrays i{animation:ray .45s .32s ease-out forwards}
@keyframes ray{0%{opacity:0;transform:rotate(var(--r)) translateY(4px) scaleY(.4)}30%{opacity:1}100%{opacity:0;transform:rotate(var(--r)) translateY(-14px) scaleY(1)}}
.fxlabel{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;font:600 13px/1 var(--ui);color:var(--on-hl);background:var(--hl);padding:7px 12px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.14);opacity:0;pointer-events:none;animation:lab 2.4s .3s cubic-bezier(.2,.8,.2,1) forwards}   /* 菱形落地/升起之后再出字，不挡住动画 */
.fxlabel.fx-rise{animation-delay:.35s}
@keyframes lab{0%{opacity:0;transform:translate(-50%,8px) scale(.85)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
.nav button.sink svg.i{animation:sink .4s .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes sink{0%{transform:none}35%{transform:translateY(3px) scale(1.12,.86)}100%{transform:none}}
.nav button.pop svg.i{animation:popi .4s .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes popi{0%{transform:none}35%{transform:translateY(-4px) scale(.9,1.15)}100%{transform:none}}
.nav button.sink .near{animation:nearIn .35s .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes nearIn{0%{transform:rotate(45deg) scale(0)}100%{transform:rotate(45deg) scale(1)}}
.nav .navfb .ground{stroke-dasharray:none}
/* 面板里自己的伏笔回收：小菱形升起 + 光芒 */
.rowfx{position:relative;display:inline-block;width:20px;height:20px;vertical-align:middle;margin-left:4px}
.rowfx .fxgem{width:9px;height:9px;margin-left:-4.5px;top:10px;animation:rrise 1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes rrise{0%{transform:translateY(8px) rotate(45deg) scale(.6);opacity:0}50%{transform:translateY(-6px) rotate(-135deg) scale(1.4);opacity:1}100%{transform:translateY(-12px) rotate(-135deg) scale(.3);opacity:0}}
.rowfx .fxrays{top:6px}
.rowfx .fxrays i{animation:ray .5s .4s ease-out forwards;height:6px;top:-10px;transform-origin:1px 10px}
.q.justdone{animation:qdone 1.6s ease-out}
.q.fbook .qt{border-left-color:var(--hl)}
.q.mine .qt{border-left-color:var(--blue)}
.q.done .qt{border-left-color:var(--line)}
.q .auto{font-size:var(--t-tag);color:var(--faint);margin:2px 0 4px}
.tag .dm{background:currentColor}
@keyframes qdone{0%{background:var(--hl-soft)}100%{background:transparent}}
.mk svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.mk.clue{color:var(--hl)}
.mk.clue .gem{width:11px;height:11px;background:var(--hl);transform:rotate(45deg);border-radius:2px}
.mk.clue.seen .gem{background:transparent;box-shadow:inset 0 0 0 1.6px var(--hl);animation:none}
.mk svg.big{width:21px;height:21px;flex:none}
/* 出处标记：伏笔 发现未打开=实心黄菱形（闪），打开=空心，揭晓=空心菱形内一个勾；提问 空心问号圆，揭晓=空心圆内一个勾。揭晓处是实心圆形勾徽章 */
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--hl-soft)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.mk.bm{color:var(--blue)}
.mk.bm svg{fill:var(--blue)}
.mk.note{color:var(--blue)}
.mk.answer{width:24px;height:24px;margin:1px;background:var(--hl);color:var(--on-hl);box-shadow:0 0 0 3px var(--hl-soft)}
.mk.answer svg{width:14px;height:14px;stroke-width:2.6}
.mk.answer.mine{background:var(--blue);color:var(--paper);box-shadow:0 0 0 3px var(--blue-soft)}
.mk.answer.fresh{animation:ansPulse 1.8s ease-in-out infinite}
.mk.answer.mine.fresh{animation-name:ansPulseB}
@keyframes ansPulse{50%{box-shadow:0 0 0 7px var(--hl-soft),0 0 14px 2px var(--hl-soft)}}
@keyframes ansPulseB{50%{box-shadow:0 0 0 7px var(--blue-soft),0 0 14px 2px var(--blue-soft)}}
.mk.clue.mine{color:var(--blue)}
.mk.clue.mine.seen .gem{box-shadow:inset 0 0 0 1.6px var(--blue)}

/* ---------- 底部导航 ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:25;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);font-family:var(--ui);font-size:var(--t-nav)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);padding:4px 6px;position:relative;min-width:56px}
.nav svg.i{width:22px;height:22px}
.nav .near{position:absolute;top:3px;right:14px;width:8px;height:8px;background:var(--hl);transform:rotate(45deg);border-radius:1.5px}

/* ---------- 底部抽屉 ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;z-index:50;background:var(--sheet);color:var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -12px 40px rgba(0,0,0,.10);transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:80vh;display:flex;flex-direction:column;font-family:var(--ui);padding-bottom:var(--safe-b)}
.sheet.show{transform:translate(-50%,0)}
.sheet.tall{height:80vh}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px;flex:none}
.shead{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;flex:none}
.shead .n{font-family:var(--num);font-size:22px;font-weight:600;min-width:3.2em}
.shead .ttl{font-family:var(--serif);font-size:var(--t-panel);font-weight:600;flex:1}
.shead .x{color:var(--mute);font-size:22px;line-height:1;padding:4px 6px}
.seg{display:flex;background:var(--paper2);border-radius:8px;padding:2px;flex:1;max-width:240px;margin-left:auto}
.seg button{flex:1;padding:5px 0;font-size:var(--t-aux);color:var(--mute);border-radius:6px;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--field);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sbody{overflow-y:auto;padding:4px 18px 16px;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.plain{font-family:var(--serif);font-size:var(--t-key);line-height:1.7;margin:4px 0 14px}
.more{font-size:var(--t-body);line-height:1.85;color:var(--ink2);margin:0 0 14px}
.need{border-top:1px solid var(--line);padding-top:10px;font-size:var(--t-aux);color:var(--mute);line-height:1.75}
.need b{color:var(--mute);font-weight:600;font-size:var(--t-group);display:block;margin-bottom:2px}
a.ref{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue-soft);font-family:var(--num)}
.nudge{background:var(--blue-soft);border-radius:8px;padding:10px 12px;font-size:var(--t-aux);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nudge span{flex:1 1 100%}
.btn{padding:8px 14px;border-radius:8px;font-size:var(--t-aux);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sfoot{display:flex;gap:8px;padding:10px 18px 12px;border-top:1px solid var(--line);flex:none;align-items:center}
.acts{display:flex;justify-content:space-between;padding:8px 10px 10px;border-top:1px solid var(--line);flex:none}
.acts button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--t-tag);color:var(--mute);padding:4px 8px;min-width:60px;border-radius:8px}
.acts button[aria-pressed=true]{color:var(--blue)}
.acts button[aria-pressed=true] svg{fill:var(--blue-soft)}
.mini{font-size:var(--t-aux);color:var(--mute);line-height:1.7;margin:0 0 8px}

/* 伏笔 / 笔记 列表 */
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .from{font-size:var(--t-tag);color:var(--mute);font-family:var(--ui);display:flex;gap:8px;align-items:center}
.q .from .tag{font-family:var(--ui);font-size:var(--t-tag);line-height:1;padding:4px 8px 4px 6px;border-radius:11px;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.tag svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag .dm{width:7px;height:7px;transform:rotate(45deg);border-radius:1px;background:currentColor;margin:0 2px}
.tag.t-bm{background:var(--blue);color:var(--paper)}
.tag.t-bm svg{fill:currentColor}
.tag.t-hl{background:var(--hl-soft);color:var(--ink)}
.tag.t-note{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.tag.t-q{background:var(--hl);color:var(--on-hl)}
.tag.t-book{background:var(--hl);color:var(--on-hl)}
.tag.t-mine{background:var(--blue);color:var(--paper)}
.q .from .st{font-family:var(--ui);font-size:var(--t-tag);display:inline-flex;align-items:center;gap:4px}
.q .from .st.open{color:var(--hl)}
.q .from .st.open::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hl);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.q .from .st.done{color:var(--mute)}
.q.hl .qt{border-left-color:var(--hl);font-size:var(--t-key)}
.q.bmk .src{color:var(--ink2)}
.q .qt{font-family:var(--serif);font-size:var(--t-key);line-height:1.6;margin:4px 0 8px;padding-left:10px;border-left:3px solid var(--hl)}
.q.mine .qt{border-left-color:var(--blue)}
.q.note .qt{border-left-color:var(--line);font-size:var(--t-key)}
.q.done .qt{border-left-color:var(--line);color:var(--mute)}
.q .src{font-family:var(--serif);font-size:var(--t-aux);color:var(--mute);line-height:1.6;margin:2px 0 6px}
.q.locked .qt{border-left-style:dashed;color:var(--mute);font-family:var(--ui);font-size:var(--t-body)}
.guess{font-size:var(--t-body);line-height:1.7;background:var(--field);border-radius:8px;padding:8px 11px;margin:6px 0}
.guess .c{color:var(--mute);font-size:var(--t-tag)}
.qacts{display:flex;gap:8px;flex-wrap:wrap}
.qacts button{font-size:var(--t-aux);color:var(--ink);padding:4px 0;margin-right:12px}
.h3{font-size:var(--t-group);color:var(--mute);margin:18px 0 2px;font-weight:600}
.empty{color:var(--mute);font-size:var(--t-aux);line-height:1.8;padding:12px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 18px 8px;flex:none;scrollbar-width:none}
.tabs button{font-size:var(--t-aux);padding:5px 12px;border-radius:16px;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}

/* ===== v9.55 设计规范 v2（批注本）：统一覆盖层 =====
   三种墨：墨 = 正文和界面；朱（--hl）= 书里埋的；黛（--blue）= 读者自己的。圆角三级：纸上的 2 / 按钮输入框 6 / 面板 14 */
/* 读者自己的：划线改黛色细线（原来金色） */

mark.qh{background:var(--blue-soft)}

}

/* ===== v9.56 书架（规范 v2 第六节 2） ===== */
.shelf{padding:calc(var(--safe-t) + 16px) 24px calc(var(--safe-b) + 32px)}
.brand{margin:0;height:40px;gap:10px}
.brand b{font-size:20px;letter-spacing:.2em}
.brand .logo{width:32px;height:32px}
.shme{margin-left:auto}
.cont{display:grid;grid-template-columns:auto 1fr auto;column-gap:16px;align-items:center;width:100%;margin-top:24px;padding:12px 16px;border-radius:6px;background:var(--paper2);text-align:left}
.cont .ck{grid-column:1/4;font-size:var(--t-tag);color:var(--mute);margin-bottom:12px;line-height:1}
.cont .cover{width:44px}
.cont .ci{display:flex;flex-direction:column;gap:4px;min-width:0}
.cont .t{font-family:var(--serif);font-size:var(--t-key);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .p{font-size:var(--t-aux);color:var(--ink2)}
.cont .chev{color:var(--faint);font-size:20px}
.pbar{display:block;height:2px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:4px;max-width:200px}.pbar i{display:block;height:2px;background:var(--ink)}
.shh{margin-top:32px}
.shelf h1{margin:0}
.shtools{position:relative;display:flex;align-items:center;margin-top:12px;height:32px;font-size:var(--t-aux)}
.sortb{display:inline-flex;align-items:center;gap:4px;height:32px;color:var(--ink2)}
.sortb svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.4}
.shmenu{position:absolute;z-index:6;top:34px;left:0;min-width:132px;padding:4px;border-radius:6px;background:var(--sheet);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.shmenu button{display:flex;align-items:center;width:100%;height:36px;padding:0 12px;text-align:left;font-size:14px;border-radius:4px}
.shmenu button[aria-checked=true]{color:var(--ink);font-weight:600}.shmenu button[aria-checked=true]::after{content:"✓";margin-left:auto}
.lays{margin-left:auto;display:flex;align-items:center;gap:4px}
.lays button[data-lay]{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--faint)}
.lays button[data-lay][aria-pressed=true]{color:var(--ink);background:var(--paper2)}
.lays svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.lays #shEdit{margin-left:8px;padding:0;height:32px}
.etip{color:var(--mute)}
.books{margin-top:16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 线装书封面：左侧订线，左上题签 */
.cover.gen{position:relative;display:block;padding:0;border-radius:2px;box-shadow:inset -1px 0 0 rgba(0,0,0,.15);color:#2A2A2A}
.cover.gen::before{content:"";position:absolute;left:9%;top:9%;bottom:9%;width:2px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.5) 0 4px,transparent 4px 18px)}
.cover.gen .ct{position:absolute;left:22%;top:9%;width:26%;min-height:48%;max-height:84%;padding:5px 0;background:#F1EEE6;border:1px solid rgba(0,0,0,.08);writing-mode:vertical-rl;font-family:var(--serif);font-weight:400;font-size:12px;line-height:1.6;letter-spacing:.12em;color:#2A2A2A;text-align:center;overflow:hidden;max-width:none}
.cover.gen.h .ct{font-size:10px;line-height:1.35;letter-spacing:0}
.cover.img{border-radius:2px;overflow:hidden}
.cont .cover.gen .ct{font-size:8px;padding:2px 0;line-height:1.5}.cont .cover.gen.h .ct{font-size:7px}
/* 列表 */
.books.lay-list .book{align-items:center;padding:16px 0}
.books.lay-list .cover{width:72px}
.book .binfo{gap:4px}
.book .binfo .p{color:var(--ink2);margin-top:4px}
.binfo .fb{color:var(--hl);font-size:var(--t-aux)}
.binfo .fb .dia{width:6px;height:6px;border-radius:0}
/* 书格：一行 3 本，只有封面 + 书名 */
.books.lay-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 12px;align-items:start}
.book.gb{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;border:0;min-width:0;text-align:center}
.book.gb .cover{width:100%}
.book.gb .t{width:100%;font-family:var(--serif);font-size:var(--t-tag);line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book.gb .cover.gen .ct{font-size:13px}.book.gb .cover.gen.h .ct{font-size:10.5px}
/* 简表：一行一本 */
.book.lb{display:flex;align-items:center;gap:12px;height:48px;padding:0;border-top:0;border-bottom:1px solid var(--line)}
.books.lay-rows .book.lb:first-child{border-top:1px solid var(--line)}
.book.lb .t{font-family:var(--serif);font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book.lb .a{font-size:var(--t-aux);color:var(--mute);white-space:nowrap}
.book.lb .lp{min-width:36px;text-align:right;font-size:var(--t-aux);color:var(--ink2);font-variant-numeric:tabular-nums}
/* 整理 */
.grip{display:flex;flex-direction:column;gap:3px;padding:6px;margin-left:8px;cursor:grab;flex:none}.grip i{display:block;width:14px;height:1.5px;background:var(--faint);border-radius:1px}
.book.gb .grip{position:absolute;top:6px;right:6px;margin:0;background:var(--sheet);border-radius:4px}
.editing .book{touch-action:none;cursor:grab}
.editing .book{position:relative}.editing .book.drag{box-shadow:0 10px 28px rgba(0,0,0,.2);background:var(--paper);z-index:5;will-change:transform;border-radius:6px}.editing .book.drag .cover{animation:none}
.editing .book.gb .cover{animation:wig .32s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.sel{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);margin-left:8px;position:relative}
.sel.on{background:var(--ink);box-shadow:none}.sel.on::after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.book.gb .sel{position:absolute;top:6px;left:6px;margin:0;background:var(--sheet)}.book.gb .sel.on{background:var(--ink)}
.shbar{position:sticky;bottom:calc(var(--safe-b) + 12px);display:flex;align-items:center;gap:12px;margin-top:24px;padding:8px 8px 8px 16px;border-radius:6px;background:var(--sheet);box-shadow:0 0 0 1px var(--line);font-size:var(--t-aux)}
.shbar .btn{margin-left:auto}
.shelf .foot{margin-top:32px}
@media (prefers-reduced-motion:reduce){.editing .book.gb .cover{animation:none}}
/* 横屏：书格一行 5 本，列表和简表两栏 */
@media (orientation:landscape) and (min-width:700px){
  .app:has(.shelf){max-width:960px}
  .shelf{padding-left:calc(var(--safe-l,0px) + 24px);padding-right:calc(var(--safe-r,0px) + 24px)}
  .books.lay-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .books.lay-list,.books.lay-rows{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
  .books.lay-rows .book.lb:nth-child(2){border-top:1px solid var(--line)}
}

/* ===== v9.57 阅读页（规范 v2 第六节 3） ===== */
.bar{display:grid;grid-template-columns:72px 1fr auto;align-items:center;height:calc(52px + var(--safe-t));padding:var(--safe-t) 12px 0;gap:0;transition:transform .28s var(--ease),opacity .2s,border-color .2s}
.bar .back{justify-self:start;font-size:var(--t-aux);color:var(--ink2)}
.bar .where{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);font-family:var(--serif);line-height:1.25}
.bar .where b{max-width:100%;font-size:14px;font-weight:600;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where small{margin:0;font-family:var(--ui);font-size:10px;color:var(--faint);letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar>.aa,.bar>.lg{justify-self:end}
.bar:has(.lg){grid-template-columns:72px 1fr auto auto}
.bar::after{height:2px;opacity:1;background:var(--line);bottom:0}
.prog{height:2px;bottom:0;background:var(--ink);opacity:1;border-radius:0}
.nav{height:calc(56px + var(--safe-b));padding:0 6px var(--safe-b);align-items:center;transition:transform .28s var(--ease),opacity .2s}
.nav button{letter-spacing:.06em;gap:3px}
.nav #nClue{color:var(--hl)}
.nav #nClue svg.i{width:24px;height:24px;stroke-width:1.8}
.calmread .bar{transform:translateY(-100%);opacity:0;pointer-events:none}
.calmread .nav{transform:translate(-50%,100%);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.calmread .bar,.calmread .nav{transition:none}}
/* 上次读到这里 */
.lastline{display:flex;align-items:center;gap:12px;margin:4px 0 12px;color:var(--faint);font-family:var(--ui);font-size:var(--t-tag);line-height:1;transition:opacity .4s}
.lastline::before,.lastline::after{content:"";flex:1;height:1px;background:var(--line)}
.lastline.gone{opacity:0}
/* 章名 */
.hui{margin:48px 0 24px}
.hui:first-child{margin-top:24px}
.hui .hn{letter-spacing:.4em;margin-right:-.4em;margin-bottom:8px}
.hui::after{display:none}
/* 页边批注：竖排楷体小字。朱 = 书里的伏笔（没打开：朱色细框 + 轻轻呼吸；打开过：细框；揭晓：实心）；黛 = 读者发现的 */
.mk.clue,.mk.answer{width:22px;height:auto;min-height:0;margin:0 2px;padding:6px 0;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 40%,transparent);animation:none}
.mk.clue::before,.mk.clue .gem,.mk.clue svg,.mk.answer svg{display:none}
.mk .mz{writing-mode:vertical-rl;font-family:var(--kai);font-size:13px;line-height:1;letter-spacing:.2em;margin-bottom:-.2em}
.mk.clue{color:var(--hl)}
.mk.clue:not(.seen):not(.solved){box-shadow:inset 0 0 0 1px var(--hl);animation:mzIn 2.4s ease-in-out infinite}
@keyframes mzIn{50%{background:var(--hl-soft)}}
.mk.clue.solved{color:var(--hl);opacity:.55}
.mk.answer{background:var(--hl);color:var(--on-hl);box-shadow:none}
.mk.answer.fresh{animation:none;box-shadow:0 0 0 3px var(--hl-soft)}
.mk.clue.mine,.mk.clue.mine.seen{color:var(--blue);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 45%,transparent)}
.mk.answer.mine{background:var(--blue);color:var(--paper);box-shadow:none}
.marks.abs{width:26px}
.marks.abs .mk{left:2px}
@media (prefers-reduced-motion:reduce){.mk.clue:not(.seen):not(.solved){animation:none}}
/* v9.68：没点开过的伏笔右上角一个红点（和"未读"同一个习惯）；点开后红点消失 */
.mk.clue:not(.seen):not(.solved)::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--hl);box-shadow:0 0 0 2px var(--paper)}
/* 圈点：伏笔那一句下面朱色着重号 */
mark.cd{background:none;color:inherit;-webkit-text-emphasis:filled dot var(--hl);text-emphasis:filled dot var(--hl);-webkit-text-emphasis-position:under right;text-emphasis-position:under right}

/* ===== v9.58 面板（规范 v2 第五节"半屏面板"） ===== */
.sheet{border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);transition:transform .28s var(--ease)}
.grab{margin:8px auto 0}
.shead{min-height:52px;padding:8px 20px 8px;gap:12px;touch-action:none}
.shead .ttl,.shead .n{font-family:var(--serif);font-size:var(--t-panel);font-weight:600;letter-spacing:.06em;line-height:1.4}
.shead .x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;font-size:20px;margin-left:auto}
.shead .back{font-size:20px;color:var(--mute);width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0}
.sbody{padding:4px 20px 16px}
.sfoot{gap:12px;padding:12px 20px calc(12px + var(--safe-b));border-top:1px solid var(--line)}
.sheet{padding-bottom:0}
.sfoot .btn{height:40px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.04em}
.seg{border-radius:6px;padding:2px}.seg button{border-radius:4px;height:28px;padding:0}
.seg button[aria-pressed=true]{color:var(--ink);background:var(--sheet)}
.tabs button{height:28px;padding:0 12px}
.plain{font-size:var(--t-key);line-height:1.7}
.more{font-size:var(--t-body);line-height:1.8}
.q .qt{border-left-width:2px;padding-left:12px}
.scrim{background:rgba(30,38,34,.22)}
/* 横屏：面板在屏幕中间弹出 */
@media (orientation:landscape) and (max-height:520px){
  .sheet{left:50%;bottom:50%;width:min(520px,calc(100vw - 96px));max-height:88vh;border-radius:14px;transform:translate(-50%,60%);opacity:0;pointer-events:none;transition:transform .28s var(--ease),opacity .2s}
  .sheet.show{transform:translate(-50%,50%);opacity:1;pointer-events:auto}
  .sheet.tall{height:88vh}
  .sheet .grab{display:none}
  .sfoot{padding-bottom:12px}
}
/* 提示条（规范 v2 第五节）：底部导航上方 12px，墨底纸字 13 号，右侧最多一个文字按钮 + × */
.toast{bottom:calc(56px + 12px + var(--safe-b));min-height:44px;padding:8px 8px 8px 16px;gap:12px;width:calc(100% - 32px)}
.toast .tx{color:var(--paper);opacity:.6;font-size:16px;width:32px;height:32px;padding:0}
.calmread ~ .toast,.calmread .toast{bottom:calc(12px + var(--safe-b))}
/* 提示条：永远在最上层（盖住抽屉和遮罩）。电脑端放页面顶部居中，按内容收紧；手机仍在底部导航上方 */
.toast,#mlfx{z-index:80}
@media (min-width:760px) and (min-height:521px){
  .toast,#mlfx{left:50%;right:auto;top:calc(var(--safe-t) + 20px);bottom:auto;transform:translate(-50%,-12px)}
  .toast.show,#mlfx.show{transform:translate(-50%,0)}
  .toast{width:max-content;min-width:240px;max-width:min(520px,calc(100% - 32px))}
  #mlfx{width:min(520px,calc(100% - 32px))}
}
/* 电脑端阅读页：顶栏、正文、底部导航的宽度和书架页一致（960），不再是手机的 560。
   想收窄正文只改下面三处的 960px；抽屉和弹窗仍是 560 居中，不跟着变 */
@media (min-width:760px) and (min-height:521px){
  .app:has(.text){max-width:960px}
  .nav{max-width:960px}
  .text{padding-left:24px;padding-right:24px}
}


/* ===== v9.59 我的、找书、二级页（规范 v2 第六节 5、6） ===== */
.pgbar{height:calc(52px + var(--safe-t));padding:var(--safe-t) 12px 0}
.pgbar b{font-size:var(--t-panel);letter-spacing:.06em}
.pgbar .back{color:var(--ink2)}
.pgbody{padding:8px 24px calc(48px + var(--safe-b))}
.mecard,.mebox,.melist,.medl{border-radius:6px;box-shadow:none;background:var(--paper2)}
.mecard{padding:16px;margin:8px 0 16px}
.mestat{gap:8px;margin:0 0 16px}
.mestat div{border-radius:6px;box-shadow:none;background:var(--paper2);padding:12px 4px}
.mestat b{font-size:20px}
.mebox{padding:16px;margin:0 0 16px}
.melist button{padding:16px;border-top-color:var(--line)}
.d.on{background:var(--ink)!important}
.d.on.today{box-shadow:0 0 0 2px var(--line)}
.calsel select{border-radius:6px;background:var(--sheet)}
.av{background:var(--ink)}
.libsearch{padding:8px 0 12px}
.libsearch input{height:44px;padding:0 14px;border-radius:6px;background:var(--sheet)}
.hotw{gap:8px}
.hotw button{height:32px;padding:0 12px;border-radius:6px;background:transparent}
.librow{padding:16px 0}
.libh{margin:16px 0 12px}
.fsrc .btn{height:32px;padding:0 14px;display:inline-flex;align-items:center}
.qzc,.qzres{border-radius:6px}
.qzc.open{box-shadow:0 0 0 1px var(--ink)}
.qzchips button{height:40px;padding:0 14px;border-radius:6px;background:var(--sheet)}
.qzrh b,.qzr b,.qzt b{color:var(--ink)}
.about .welic{border-radius:6px}
.gemic i{background:var(--hl)}
/* ===== 横屏阅读页：左侧竖排导航，正文限宽居中（规范 v2 第六节 3） ===== */
@media (orientation:landscape) and (max-height:520px){
  .app:has(.text){max-width:none}
  .text{max-width:calc(28em + 2 * var(--pad) + 32px);margin:0 auto;padding-left:calc(var(--pad) + 56px + var(--safe-l));padding-right:calc(var(--pad) + 32px + var(--safe-r))}
  .bar{padding-left:calc(56px + var(--safe-l) + 12px);padding-right:calc(var(--safe-r) + 12px);height:44px;padding-top:0}
  .nav{left:0;top:0;bottom:0;transform:none;width:calc(56px + var(--safe-l));max-width:none;height:auto;flex-direction:column;justify-content:center;gap:16px;padding:0 0 var(--safe-b) var(--safe-l);border-top:0;border-right:1px solid var(--line)}
  .calmread .nav{transform:translateX(-100%)}
  .toast{left:auto;right:calc(var(--safe-r) + 24px);transform:translate(0,12px);width:340px;bottom:calc(16px + var(--safe-b))}
  .toast.show{transform:none}
  #mlfx{left:auto;right:calc(var(--safe-r) + 24px);width:360px;transform:translate(0,24px);bottom:calc(16px + var(--safe-b))}
  #mlfx.show{transform:none}
}

/* ===== v9.60 横屏右侧批注栏（规范 v2 第六节 3） ===== */
.side{display:none}
@media (orientation:landscape) and (max-height:520px){
  .side{display:block;position:fixed;z-index:15;top:44px;right:0;bottom:0;width:calc(220px + var(--safe-r));padding:16px calc(20px + var(--safe-r)) calc(16px + var(--safe-b)) 20px;border-left:1px solid var(--line);background:var(--paper);overflow-y:auto;font-family:var(--ui);scrollbar-width:none;transition:top .28s var(--ease)}
  .side::-webkit-scrollbar{display:none}
  .calmread .side{top:0}
  .text{margin-right:calc(220px + var(--safe-r));margin-left:0;max-width:none;padding-right:calc(var(--pad) + 32px)}
  .text>*{max-width:28em;margin-left:auto;margin-right:auto}
  .side .mainl{margin:0 0 16px;padding:0 0 16px;background:none;border-radius:0;border-bottom:1px solid var(--line)}
  .side .mlq{font-size:13px;line-height:1.7;margin:8px 0 10px}
  .side .mlp i{width:14px;height:14px}
  .side .mlnotes{display:none}
  .pz{display:block;width:100%;margin:0 0 16px;padding:0 0 0 12px;border-left:2px solid var(--hl);font-family:var(--kai);font-size:14px;line-height:1.7;color:var(--hl);text-align:left}
  .pz small{display:block;font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);margin-bottom:2px;letter-spacing:.02em}
  .pz.done{opacity:.6}
  .pz.d{border-left-color:var(--blue);color:var(--blue)}
  .sidee{font-size:var(--t-aux);color:var(--faint);line-height:1.7;margin:0}
}

/* v9.61 题签：大小随书名、字居中（按封面宽度等比缩放） */
.cover.gen{container-type:inline-size}
.cover.gen .ct,.book.gb .cover.gen .ct,.cont .cover.gen .ct,.cover.gen.h .ct,.book.gb .cover.gen.h .ct,.cont .cover.gen.h .ct{
  left:20cqw;top:10cqw;width:auto;min-height:0;max-height:none;padding:7cqw 4cqw;display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;gap:2cqw;
  writing-mode:horizontal-tb;font-size:15cqw;line-height:1;letter-spacing:0}
.cover.gen .ct i{font-style:normal;writing-mode:vertical-rl;letter-spacing:.18em;margin-bottom:-.18em;line-height:1}
.cover.gen.h .ct,.book.gb .cover.gen.h .ct,.cont .cover.gen.h .ct{font-size:11.5cqw;padding:6cqw 3.5cqw}
/* ===== v9.62 交互重做第一批 ===== */
.shead .nsub{font-family:var(--serif);font-size:var(--t-aux);color:var(--mute);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;gap:16px;margin:0 0 12px;font-size:var(--t-aux)}

.olnow{padding:0}.olnow .olnb{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:12px 0 12px 14px;text-align:left;font-family:var(--ui)}
.olchap{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:var(--t-tag);color:var(--faint)}.olchap .linkbtn{padding:0}
.bichap{margin:12px 0 0}.bichap .linkbtn{padding:0}

/* v9.67 UI 审查：账户页底部的"退出登录/注销账号"不用大按钮，做成和"我的"菜单一致的分隔行 */
.secbtns{gap:0;margin-top:8px;border-top:1px solid var(--line)}
.secrow{display:flex;align-items:center;width:100%;min-height:48px;border-bottom:1px solid var(--line);text-align:left;font-size:var(--t-body);color:var(--ink)}
.secrow.danger{color:#A33A2A}

.cfd{margin:4px 0 12px;font-size:var(--t-body);line-height:1.7;color:var(--ink2)}
.btn.dgr{background:#A33A2A;color:#fff}

.fin .linkbtn.fbtn{font-size:var(--t-body);letter-spacing:.06em;padding:8px 4px}

.qzchips .qzadd{background:transparent;color:var(--mute);box-shadow:none;border:1px dashed var(--faint)}
.qzchips .qzin{height:40px;width:9em;padding:0 14px;border-radius:6px;border:0;background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:var(--t-body);color:var(--ink);font-family:var(--ui)}
.qzchips .qzin:focus{outline:none}

/* ===== 电脑端适配（用户 11-02 定）=====
   窗口宽度分三档：<760 手机样式；760～1099 单栏 960 + 居中抽屉；≥1100 阅读页三栏
   （左侧竖导航 + 正文约 30 字宽 + 右侧伏笔和笔记栏；抽屉改成右侧抽屉）。
   只用宽度和"有鼠标"判断，不动手机和手机横屏的规则。 */

/* 悬停：只给有鼠标的设备，手机不受影响。统一规则：能点的东西悬停时底色变浅 */
@media (hover:hover) and (pointer:fine){
  .book:not(.gb):hover,.melist button:hover,.mecard:hover,.cont:hover{background:var(--paper2)}
  .book.gb:hover .cover{transform:translateY(-2px)}
  .linkbtn:hover,.back:hover,.shlogin:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .btn:hover{filter:brightness(.94)}
  .nav button:hover{background:var(--paper2);border-radius:6px}
  .hotw button:hover,.sortb:hover,.lays button:hover,.seg button:hover,.shmenu button:hover{background:var(--paper2)}
  .pz:hover{background:var(--paper2)}
  .sheet .shead .x:hover{color:var(--ink)}
}

/* 登录/注册页的同意勾选；政策页正文 */
.agree{display:flex;align-items:flex-start;gap:8px;margin:0 0 12px;font-size:var(--t-aux);color:var(--ink2);line-height:1.6}
.agree input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--ink);cursor:pointer}
.agree .linkbtn{display:inline;padding:0;color:var(--blue);font-size:inherit}
.cfd .linkbtn{display:inline;padding:0;color:var(--blue);font-size:inherit}
.policy{font-size:var(--t-body);line-height:1.8;color:var(--ink2)}   /* 页面框架、正文宽度都和其他二级页一致（960），不再单独限宽 */
.policy p{margin:0 0 .8em}
.policy .pol-h{font-family:var(--serif);font-size:var(--t-key);font-weight:600;color:var(--ink);margin:1.6em 0 .5em;letter-spacing:.04em}

/* 意见反馈：文字框沿用全站 textarea；图片缩略图 64 见方、圆角 6、线色描边，和输入框同一套 */
.fbpg textarea{min-height:140px;border-radius:6px;background:var(--sheet);font:var(--t-body)/1.8 var(--serif)}
.fbpg textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.fbimgs{display:flex;gap:8px;flex-wrap:wrap}
.fbimg,.fbadd{position:relative;width:64px;height:64px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);overflow:hidden}
.fbimg img{width:100%;height:100%;object-fit:cover;display:block}
.fbimg.bad{border-color:var(--hl)}
.fbrm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--ink) 70%,transparent);color:var(--paper);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.fbadd{display:flex;align-items:center;justify-content:center;color:var(--mute);border-style:dashed;border-color:var(--faint)}
.fbadd svg{width:22px;height:22px}
.fbwait{position:absolute;inset:0;background:color-mix(in srgb,var(--paper) 60%,transparent)}
.fbwait::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:fbspin .8s linear infinite}
@keyframes fbspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fbwait::after{animation:none}}
@media (hover:hover) and (pointer:fine){.fbadd:hover{background:var(--paper2);color:var(--ink)}.fbrm:hover{background:var(--ink)}}
/* 书架：每本书的详情入口（手机是长按，电脑用图标）。列表/简表：一直显示，淡灰；网格：悬停或聚焦时出现在封面右上角，半透明纸色底，不用白方块 */
@media (hover:hover) and (pointer:fine){
  .book .bkm{opacity:.55;transition:opacity .15s,background .15s}
  .book:hover .bkm,.bkm:focus-visible{opacity:1}
  .bkm:hover{background:var(--paper2);color:var(--ink)}
  .book.gb .bkm{display:flex;position:absolute;right:6px;top:6px;margin:0;width:28px;height:28px;opacity:0;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink)}
  .book.gb:hover .bkm,.book.gb .bkm:focus-visible{opacity:1}
  .book.gb .bkm:hover{background:var(--paper)}
}
/* 右栏收起按钮：默认不显示，只有 ≥1100 的宽屏才有（见上面的 .sidetg{display:flex}） */
.sidetg{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:6px;color:var(--mute)}
.sidetg svg{width:22px;height:22px;stroke-width:1.5}
.sidetg[aria-pressed=true]{color:var(--blue)}   /* 展开=蓝色（和书签"已加"同色）；收起=灰色 */
.sidetg:not([aria-pressed=true]){color:var(--faint)}
.sidetg .sdf{fill:currentColor;stroke:currentColor;opacity:0;transition:opacity .15s}
.sidetg[aria-pressed=true] .sdf{opacity:1}   /* 右栏展开：右半个方框填实；收起：只剩外框 */
@media (hover:hover) and (pointer:fine){.sidetg:hover{background:var(--paper2);color:var(--ink)}}
/* 二级页（我的、找书、导入、阅读偏好、个人账户、关于）和书架同宽 960、同样的左右边距 24。
   条件和书架完全一致（横屏且宽度≥700），所以从书架点进去、再返回，页面宽度不跳 */
@media (orientation:landscape) and (min-width:700px){
  .app:has(.pg:not(.flow)){max-width:960px}
  .pgbar{padding-left:calc(var(--safe-l,0px) + 16px);padding-right:calc(var(--safe-r,0px) + 16px)}   /* 返回键文字再加 8 的内边距，正好对齐到 24 */
  .pgbody{padding-left:calc(var(--safe-l,0px) + 24px);padding-right:calc(var(--safe-r,0px) + 24px)}
}
/* 登录、注册、找回密码、问卷：页面框架与书架、二级页同宽 960，顶部返回键与二级页同位置（箭头在 24）。
   表单本身仍是 360 居中（.auth），问卷内容仍是 420 居中（.flbody） */
@media (orientation:landscape) and (min-width:700px){
  .app:has(.pg.flow){max-width:960px}
  .flow .flbar{padding-left:calc(var(--safe-l,0px) + 16px);padding-right:calc(var(--safe-r,0px) + 16px)}
}
/* 760 以上：找书结果分两列 */
@media (min-width:760px) and (min-height:521px){
  .mecard{margin-bottom:16px}
  #libList{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;align-items:start}
  #libList>.libh,#libList>.hotw,#libList>.libnone,#libList>.mini,#libList>.libwait{grid-column:1/-1}
  #libList>.fbook{break-inside:avoid}
}

/* 1100 以上：阅读页三栏 + 右侧抽屉。
   顶栏占满整个窗口宽度，标题居中到整屏；竖导航和右栏都从顶栏下面开始。
   右栏可收起（收起后正文居中到整屏）：状态记在 PROF.sideOff，样式用 .app.sideoff */
@media (min-width:1100px) and (min-height:521px){
  .app:has(.text){max-width:none}
  .bar{position:sticky;top:0;display:flex;align-items:center;gap:4px;padding-left:24px;padding-right:24px;margin:0}
  .bar .back{margin-right:auto}
  .bar .where{position:absolute;left:50%;top:var(--safe-t);bottom:0;transform:translateX(-50%);max-width:calc(100% - 480px)}   /* 标题固定在整条顶栏（整个窗口）的正中，不受左右按钮多少影响 */
  .nav{left:0;top:calc(52px + var(--safe-t));bottom:0;transform:none;width:72px;max-width:none;height:auto;flex-direction:column;justify-content:center;gap:20px;padding:0 0 var(--safe-b);border-top:0;border-right:1px solid var(--line)}
  .nav button{overflow:visible}
  .fxlabel{left:calc(100% + 8px);bottom:auto;top:50%;transform:translateY(-50%);animation-name:labside}
  @keyframes labside{0%{opacity:0;transform:translate(-8px,-50%) scale(.9)}12%{opacity:1;transform:translate(0,-50%) scale(1)}80%{opacity:1;transform:translate(0,-50%)}100%{opacity:0;transform:translate(6px,-50%)}}
  .text{margin-left:72px;margin-right:300px;max-width:none;padding-left:32px;padding-right:32px}
  .text>*{max-width:912px;margin-left:auto;margin-right:auto}
  .app.sideoff .text{margin-right:0;margin-left:72px}
  .app.sideoff .side{display:none}
  .sidetg{display:flex}
  .side{display:block;position:fixed;z-index:15;top:calc(52px + var(--safe-t));right:0;bottom:0;width:300px;padding:20px 24px 24px;border-left:1px solid var(--line);background:var(--paper);overflow-y:auto;font-family:var(--ui);scrollbar-width:thin}
  .side .mainl{margin:0 0 16px;padding:0 0 16px;background:none;border-radius:0;border-bottom:1px solid var(--line)}
  .side .mlq{font-size:var(--t-aux);line-height:1.7;margin:8px 0 10px}
  .side .mlnotes{display:none}
  .pz{display:block;width:100%;margin:0 0 16px;padding:0 0 0 12px;border-left:2px solid var(--hl);font-family:var(--kai);font-size:var(--t-aux);line-height:1.7;color:var(--hl);text-align:left}
  .pz small{display:block;font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);margin-bottom:2px;letter-spacing:.02em}
  .pz.done{opacity:.6}
  .pz.d{border-left-color:var(--blue);color:var(--blue)}
  .sidee{font-size:var(--t-aux);color:var(--faint);line-height:1.7;margin:0}
  /* 右侧面板：从右边滑出，宽 420，占满高度。解释、伏笔、笔记、导览、设置、以及划线后的"写点什么"都用同一种 */
  .sheet{left:auto;right:0;top:0;bottom:0;width:420px;max-width:none;max-height:none;height:100%;border-radius:0;transform:translateX(105%);box-shadow:-1px 0 0 var(--line),-12px 0 40px rgba(0,0,0,.10);padding-bottom:0}
  .sheet.show{transform:none}
  .sheet.tall,.sheet.setp{height:100%;max-height:none}
  .sheet .grab{display:none}
  .sheet.full{left:0;right:0;width:100%;transform:translateY(105%)!important}
  .sheet.full.show{transform:none!important}
  .scrim{background:rgba(0,0,0,.04)}
  /* "写点什么"和其他右侧面板同一个结构：标题行（宋体 17、× 靠右）→ 内容（引用、输入框）→ 底部操作栏（取消靠左、保存靠右） */
  .qbar{left:auto;right:0;top:0;bottom:0!important;width:420px;max-width:none;height:100%;border-radius:0;transform:translateX(105%);box-shadow:-1px 0 0 var(--line),-12px 0 40px rgba(0,0,0,.10);padding:0;display:flex;flex-direction:column;overflow:hidden}
  .qbar.show{transform:none}
  .qbar .qtop{min-height:52px;padding:8px 20px;gap:12px;margin:0;flex:none}
  .qbar .qttl{font-family:var(--serif);font-size:var(--t-panel);font-weight:600;letter-spacing:.06em;line-height:1.4;order:0}
  .qbar .qkind{margin-left:auto}
  .qbar .qtop .qx{margin-left:0;width:32px;height:32px;font-size:20px;border-radius:0}
  .qbar .qquote{margin:4px 20px 12px;max-height:none;flex:none}
  .qbar .qsug{margin:0 20px 12px;flex-wrap:wrap;overflow:visible}
  .qbar .qrow{display:block;margin:0 20px;flex:1;min-height:0}
  .qbar .qrow textarea{width:100%;height:100%!important;min-height:160px;max-height:none;border-radius:6px;padding:12px 14px;background:var(--field);font:var(--t-body)/1.8 var(--serif)}
  .qbar .qsend{display:none}
  .qbar .qfoot{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--line);flex:none;align-items:center;margin-top:16px}
  .qbar .qfoot .btn{height:40px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.04em}
  .qbar .qfoot .btn.off{opacity:.4}
  .qscrim.show{background:rgba(0,0,0,.04)}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div class="selmenu" id="selmenu" role="toolbar" aria-label="选中文字后的操作"></div>
<div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<script id="data" type="application/json">%%DATA%%</script>
<script>
(()=>{
const ALL=JSON.parse(document.getElementById('data').textContent).books;
let UNIT='回', BK='tractatus', D, P, QA, CARDS, SUS, PRE, IMG, IDX, NOVEL=false, HUI=[], PEOPLE=[], PBYID={}, NAMES={};
const LV=['入门','标准','深入'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={
  toc:'<path d="M5 6h14M8 12h11M11 18h8M5 12h.01M5 18h.01"/>',
  clue:'<path d="M12 3.2l5.6 8.3H6.4z"/><path d="M3.5 11.5h17"/><path d="M8.4 15l3.6 5.3 3.6-5.3" stroke-dasharray="1.5 2.1"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  book:'<path d="M6 3h11.5a.5.5 0 0 1 .5.5v17a.5.5 0 0 1-.5.5H6z"/><path d="M6 3v18M4 7h3M4 12h3M4 17h3M10 8h5M10 12h5"/>',
  bm:'<path d="M7 4h10v16l-5-3.5L7 20z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  side:'<rect x="3.5" y="5" width="17" height="14" rx="2"/><path class="sdf" d="M14.5 5h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4z"/>',
  hl:'<path d="M4 20h16"/><path d="M7 16l2-6 7-7 3 3-7 7-6 2z"/>',
  note:'<path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4M8 9h8M8 13h5"/>',
  qm:'<path d="M8.6 8.6a3.4 3.4 0 1 1 4.7 3.2c-.9.4-1.3 1.1-1.3 2v.9M12 18.6h.01"/>',
  ask:'<circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.7.3-1.2.9-1.2 1.7v.7M12 17.2h.01"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  aa:'<path d="M3 18L8.5 5 14 18M5 13.5h7"/><path d="M15.5 12a2.5 2.5 0 0 1 5 0v6M20.5 15h-2.6c-1.5 0-2.4.8-2.4 1.6s.8 1.4 1.9 1.4c1.4 0 2.6-.9 3.1-2.2"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  send:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  gemok:'<path d="M12 3.2 20.8 12 12 20.8 3.2 12Z" style="stroke:currentColor;stroke-width:1.7;fill:none;stroke-linejoin:round"/><path d="M8.6 12.2l2.3 2.3 4.5-4.8" style="stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"/>',
  qok:'<circle cx="12" cy="12" r="9"/><path d="M8.3 12.3l2.6 2.6 4.9-5.2" style="stroke-width:2"/>',
  copy:'<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  memo:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 14.5h6M9 18h3.5"/>'};
const PANCH={S01:[1,{zh:'这本书讨论哲学问题，并且——我相信——表明了：人们会这样提出这些问题，是因为误解了我们语言的逻辑',de:'dass die Fragestellung dieser Probleme auf dem Missverständnis der Logik unserer Sprache beruht',en:'the method of formulating these problems rests on the misunderstanding of the logic of our language'}],
  S02:[1,{zh:'凡是不能谈论的，就必须保持沉默',de:'wovon man nicht reden kann, darüber muss man schweigen',en:'whereof one cannot speak thereof one must be silent'}],
  S03:[7,{zh:'它表明了，把这些问题解决了，其实并没有做成多少事',de:'dass sie zeigt, wie wenig damit getan ist, dass diese Probleme gelöst sind',en:'it shows how little has been done when these problems have been solved'}]};
/* 前言伏笔的锚句：按正在显示的那一块取（中文 / 当前原文语言） */
const preSent=(s,l)=>((PANCH[s.id]||[0,{}])[1]||{})[l||'zh']||'';
/* logo：笔尖形的菱形，一半露在地平线上、一半埋在下面（虚线）——埋下的伏笔 */
const LOGO=`<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><clipPath id="lgU"><rect width="40" height="25"/></clipPath><clipPath id="lgD"><rect y="26.6" width="40" height="14"/></clipPath>
  <rect x="18.4" y="2.5" width="3.2" height="11" rx="1.2" fill="var(--ink)"/><rect x="17.2" y="12.6" width="5.6" height="2.4" rx=".8" fill="var(--ink)"/>
  <g clip-path="url(#lgU)"><path d="M17.4 15H22.6Q26 21 24.6 27.5Q23 33.5 20 38Q17 33.5 15.4 27.5Q14 21 17.4 15Z" fill="var(--hl)"/></g>
  <g clip-path="url(#lgD)"><path d="M24.6 27.5Q23 33.5 20 38Q17 33.5 15.4 27.5" fill="none" stroke="var(--hl)" stroke-width="1.4" stroke-dasharray="1.8 1.8" stroke-linecap="round"/></g>
  <path d="M5 25.8H35" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const BK_ICON=(k,t)=>`<span class="bkm" data-bi="${k}" role="button" tabindex="0" aria-label="《${esc(t)}》详情" title="书籍详情">${ic('info')}</span>`;   /* 书架上每本书的详情入口（电脑端点它；手机长按） */
const ic=(k,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- 状态（只存在这台设备的浏览器里）：每本书一份，阅读设置两本书共用 ---------- */
let mem={};
const SRV=window.FUBI&&window.FUBI.server?window.FUBI:null;   /* 有服务端：记录同步到服务器（按设备）；没有：只存浏览器（单文件 demo） */
const store={get(k){ if(SRV&&SRV.state&&k in SRV.state) return SRV.state[k]; try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return mem[k]||null}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v} if(SRV){ SRV.state[k]=v; syncQ[k]=v; clearTimeout(syncT); syncT=setTimeout(syncNow,1500); }}};

  if(evRead.s>0&&evRead.b){ EVQ.push({k:'read',b:evRead.b,n:evRead.n,s:Math.round(evRead.s)}); evRead.s=0; }
  if(!EVQ.length) return; const body=JSON.stringify({events:EVQ.splice(0,20)});
  try{ if(beacon&&navigator.sendBeacon) navigator.sendBeacon('/api/event',new Blob([body],{type:'application/json'})); else fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{}); }catch(e){}
}
setInterval(()=>flushEv(),60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushEv(true); });

function importPage(){
  if(!SRV) return shelf();
  const fm=SRV.formats.map(x=>x.replace(/^\./,'')), acc=fm.map(x=>'.'+x).join(',');
  const COMMON=['epub','pdf','txt','docx','mobi'].filter(x=>fm.includes(x)), rest=fm.length-COMMON.length;
  showPage(pageHTML('导入','书架',`<div class="imp">
    <p class="implead">把你手里的电子书放进来，伏笔会按你的阅读进度陪你读。</p>
    <label class="impdrop" id="impDrop"><input type="file" id="impFile" hidden accept="${acc}"><b>选择文件</b><span>或把文件拖到这里</span><small>常用格式：${COMMON.join('、')}，另支持${rest}种其他格式。单个文件不超过 ${SRV.maxMB} MB。</small></label>
    <div id="impStat" aria-live="polite"></div>
    <ol class="impsteps">
      <li><b>识别章节和封面</b>自动分章；分得不准，在书里的“导览”点“调整章节”。</li>
      <li><b>外文书自动译成中文</b>按书面语、高水准翻译；译完才能读，期间书架上显示加载中。</li>
      <li><b>逐步生成解释和回顾</b>需要一些时间，期间可以照常阅读。</li>
    </ol>
    <p class="impnote">请只导入你有权阅读的书。导入的书只有你自己看得到。</p>
    <p class="impalt">手里没有文件？<button class="linkbtn" id="impFind">去找书 ›</button></p></div>`),()=>shelf());
  const stat=(cls,html)=>{ const e=$('#impStat'); e.className='imstat '+cls; e.innerHTML=html; };
  const run=async file=>{
    if(file.size>SRV.maxMB*1048576) return stat('failed',`<b>文件太大</b><span>上限 ${SRV.maxMB} MB，这个文件 ${(file.size/1048576).toFixed(1)} MB。</span>`);
    const nm=esc(file.name.replace(/\.[^.]+$/,''));
    stat('busy',`<b>《${nm}》</b><span>正在上传…</span>`);
    try{ const r=await fetch('/api/import',{method:'POST',headers:{'X-Filename':encodeURIComponent(file.name)},body:file}); const j=await r.json();
      if(!r.ok) throw new Error(j.error||'导入失败');
      stat('busy',`<b>《${nm}》</b><span>正在识别章节和封面…</span>`);
      for(let k=0;k<180;k++){ const st=await (await fetch('/api/books/'+j.id+'/status')).json(); if(st.status!=='parsing'){ if(st.status==='failed') throw new Error(st.err||'导入失败'); break; } await new Promise(z=>setTimeout(z,1000)); }
      const d=await (await fetch('/api/books/'+j.id)).json(); ALL[j.id]=d; addShelfBook(j.id,d);
      const m=d.meta, ch=m.chars>=1e4?(m.chars/1e4).toFixed(1).replace(/\.0$/,'')+' 万':m.chars;
      const paint=(d2)=>{ const m2=d2.meta, gi=genInfo(m2), locked=(m2.foreign&&d2.untranslated)||gi.locked;
        const sub=m2.foreign&&d2.untranslated?'外文书正在译成中文，译完才能读。':(gi.line||'解释和回顾已全部生成。');
        stat('ok',`<b>《${esc(m2.title)}》已放进书架</b><span>${m2.chapters} 章，约 ${ch} 字。${sub}</span><div class="imact"><button class="btn" id="imGo" ${locked?'disabled':''}>${locked?'生成中，暂不能读':'去读'}</button><button class="btn ghost" id="imMore">再导入一本</button></div>`);
        $('#imGo').onclick=()=>openBook(j.id); $('#imMore').onclick=()=>importPage(); return locked; };
      let locked=paint(d);
      /* 还没到可读门槛，或还在生成：每 5 秒取一次进度刷新这一块（离开导入页就停）。书架上的轮询（setInterval）也会同步更新书的锁定状态 */
      for(let k=0;k<720&&$('#impStat');k++){
        const g0=(d.meta.genst||{}).state; if(!locked&&(!g0||g0==='done')) break;
        await new Promise(z=>setTimeout(z,5000)); if(!$('#impStat')||!$('#imGo')) break;
        try{ const d2=await (await fetch('/api/books/'+j.id)).json(); if(d2&&d2.meta){ ALL[j.id]=d2; d.meta=d2.meta; d.untranslated=d2.untranslated; const was=locked; locked=paint(d2); const st2=(d2.meta.genst||{}).state; if(!locked&&(!st2||st2==='done')) break; if(was&&!locked) toast('<div class="tq">前几章已生成，可以开始阅读</div>',null,3500); } }catch(e){}
      }
    }catch(e){ stat('failed',`<b>没能导入</b><span>${esc(e.message)}</span><div class="imact"><button class="btn ghost" id="imRetry">重新选择文件</button></div>`); $('#imRetry').onclick=()=>importPage(); }
  };
  $('#impFile').onchange=()=>{ const f=$('#impFile').files[0]; if(f) run(f); };
  const dz=$('#impDrop');
  ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{ e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop',e=>{ const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) run(f); });
  $('#impFind').onclick=()=>findPage();
}
