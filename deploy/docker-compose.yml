# 一键启动：在 Read Book 文件夹里  docker compose -f deploy/docker-compose.yml up -d --build
# 配置写在 deploy/.env（照 deploy/.env.example 抄一份改）。数据（数据库、导入的书、生成结果）在 deploy/data/，备份这个文件夹就行。
services:
  fubi:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["./data:/data"]
  # HTTPS：Caddy 自动申请证书。有域名后把 deploy/Caddyfile 里的域名改掉，再去掉下面的注释
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["80:80","443:443"]
  #   volumes: ["./Caddyfile:/etc/caddy/Caddyfile","./caddy:/data"]
