<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伏笔 · 界面样稿 v0.3</title>
<!--
设计方案（批注本）
  概念：古书的批注本（如脂砚斋批《红楼梦》）。三种墨色各有固定意义，借自"套色批本"：
    墨   #1E2622  书的正文
    朱砂 #B23A2E  书里埋的东西：伏笔、主线（编者的批）
    黛蓝 #2F4A8C  读者自己的：划线、想法、提问（读者的批）
  纸色沿用伏笔现有的灰绿纸 #ECEEE7（不用米黄：米黄配红是千篇一律的"复古"做法，灰绿是伏笔自己的）
  字体：宋体 = 书；楷体 = 批注；苹方 = 界面。三种各管一件事。
  唯一的大胆处：伏笔那一句下面的朱色圈点（着重号），和旁边的朱批。横屏时，页边变成完整的批注栏。
  封面：线装书——左侧订线、左上题签。
  间距：4 / 8 / 12 / 16 / 24 / 32 / 48。圆角分层级：纸上的东西 2px（题签、印、标签），按钮 6px，弹层 14px。
  文案：书面、简洁；不用"哦/啦/吧"，不用感叹号。
-->
<style>
:root{
  --paper:#ECEEE7; --paper2:#E2E5DC; --sheet:#F6F7F3; --ink:#1E2622; --ink2:#38423D; --mute:#69736D; --faint:#9CA49F; --line:#CDD2C9;
  --zhu:#B23A2E; --zhu-soft:rgba(178,58,46,.10); --zhu-line:rgba(178,58,46,.35);
  --dai:#2F4A8C; --dai-soft:rgba(47,74,140,.10);
  --song:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Noto Serif SC",serif;
  --ui:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --t-body:17px; --t-key:16px; --t-ui:14px; --t-aux:13px; --t-tag:12px; --t-nav:11px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:light;
}
/* 样稿里的设备框：模拟手机的状态栏、刘海和底部横条，所有页面都要避开 */
.dev.por{--safe-t:47px;--safe-b:34px;--safe-l:0px;--safe-r:0px}
.dev.lan{--safe-t:0px;--safe-b:21px;--safe-l:47px;--safe-r:47px}
.sbar{position:absolute;z-index:40;left:0;right:0;top:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600;color:var(--ink);pointer-events:none}
.sbar .isl{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:18px;background:#000}
.sbar .ic{display:flex;gap:6px;align-items:center}.sbar .ic i{display:block;width:17px;height:11px;border-radius:2px;background:var(--ink)}.sbar .ic i:last-child{width:24px;border-radius:3px}
.lan .sbar{display:none}
.homeb{position:absolute;z-index:40;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85;pointer-events:none}
.lan .homeb{bottom:6px}
.notchl{display:none}.lan .notchl{display:block;position:absolute;z-index:40;left:0;top:50%;width:35px;height:122px;margin-top:-61px;border-radius:0 18px 18px 0;background:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#D5D8D0;font-family:var(--ui);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--dai);outline-offset:2px}

/* ---------- 样稿外面的切换栏（不属于产品） ---------- */
.ctl{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 16px;background:#2A322E;color:#E9ECE6;font-size:13px}
.ctl b{font-weight:600;margin-right:2px}
.ctl .g{display:flex;gap:2px;align-items:center}
.ctl .g span{color:#9FA8A2;margin-right:6px}
.ctl button{padding:5px 10px;border-radius:5px;color:#C9D0CA}
.ctl button[aria-pressed=true]{background:#E9ECE6;color:#1E2622}
.ctl button:disabled{opacity:.35;cursor:default}
.stage{display:flex;justify-content:center;padding:28px 16px 60px}
.note{max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:13px;line-height:1.8;color:#47504B}

/* ---------- 设备框 ---------- */
.dev{position:relative;background:var(--paper);border-radius:28px;box-shadow:0 0 0 10px #1F2622,0 18px 50px rgba(0,0,0,.25);overflow:hidden}
.dev.por{width:390px;height:844px}
.dev.lan{width:844px;height:390px}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}

/* ---------- 共用 ---------- */
.logo{width:32px;height:32px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:6px;font-size:var(--t-ui);background:var(--ink);color:var(--paper);letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.wide{width:100%}
.link{color:var(--dai);font-size:var(--t-aux)}
.seal{flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 6px;border-radius:2px;font-size:var(--t-tag);line-height:20px;letter-spacing:.06em}
.seal.zhu{background:var(--zhu);color:#F6F2EC}
.seal.zhu-o{box-shadow:inset 0 0 0 1px var(--zhu);color:var(--zhu)}

/* ---------- 一、注册 ---------- */
.scr{background:var(--paper)}
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:48px;padding:calc(var(--safe-t) + 24px) 32px calc(var(--safe-b) + 48px)}
.auth .steps{display:flex;gap:6px;justify-content:center;margin-bottom:40px}
.auth .steps i{width:28px;height:2px;border-radius:1px;background:var(--line)}
.auth .steps i.on{background:var(--ink)}
.hero{text-align:center}
.hero .mark{display:flex;justify-content:center;align-items:center;gap:10px}
.hero .mark .logo{width:44px;height:44px}
.hero .mark b{font-family:var(--song);font-size:26px;font-weight:600;letter-spacing:.28em;margin-right:-.28em}
.hero .tag{margin-top:16px;font-family:var(--song);font-size:15px;color:var(--ink2);letter-spacing:.06em}
/* 一句书里的话，带朱色圈点和一条朱批：产品本身就是这个样子 */
.specimen{position:relative;margin:36px auto 0;max-width:300px;padding:16px 0 0;border-top:1px solid var(--line)}
.specimen p{font-family:var(--song);font-size:16px;line-height:2;text-align:center;color:var(--ink)}
.dot{text-emphasis:filled dot var(--zhu);-webkit-text-emphasis:filled dot var(--zhu);text-emphasis-position:under right;-webkit-text-emphasis-position:under}
.specimen .pi{margin-top:6px;font-family:var(--kai);font-size:14px;color:var(--zhu);text-align:center;letter-spacing:.06em}
.form{display:flex;flex-direction:column;gap:16px}
.fld label{display:flex;justify-content:space-between;font-size:var(--t-aux);color:var(--mute);margin-bottom:6px}
.fld input{width:100%;height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);font:inherit;font-size:var(--t-ui);color:var(--ink)}
.fld input::placeholder{color:var(--faint)}
.fld small{display:block;margin-top:6px;font-size:var(--t-tag);color:var(--faint)}
.auth .go{margin-top:8px}
.auth .alt{margin-top:16px;text-align:center;font-size:var(--t-aux);color:var(--mute)}
.auth .alt .sep{margin:0 8px;color:var(--faint)}
.auth .fine{margin-top:auto;padding-top:24px;text-align:center;font-size:var(--t-tag);color:var(--faint)}
/* 横屏：左边是招牌和样句，右边是表单 */
.lan .auth{flex-direction:row;align-items:center;gap:48px;padding:24px calc(var(--safe-r) + 24px) 24px calc(var(--safe-l) + 24px)}
.lan .auth .steps{position:absolute;top:16px;left:0;right:0;margin:0}
.lan .auth .left{flex:1;min-width:0}
.lan .auth .right{width:300px;flex:none}
.lan .auth .form{margin-top:0;gap:12px}
.lan .auth .fld input{height:38px}
.lan .auth .fine{position:absolute;bottom:12px;left:0;right:0;padding:0}
.lan .specimen{margin-top:24px}

/* ---------- 二、书架 ---------- */
.shelf{padding:calc(var(--safe-t) + 8px) 24px calc(var(--safe-b) + 24px)}
.top{display:flex;align-items:center;gap:10px;height:40px}
.top b{font-family:var(--song);font-size:20px;font-weight:600;letter-spacing:.2em}
.top .me{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:var(--t-aux);color:var(--ink2)}
.shh{display:flex;align-items:baseline;margin-top:28px}
.shh h1{font-family:var(--song);font-size:22px;font-weight:600;letter-spacing:.12em}
.shh .acts{margin-left:auto;display:flex;align-items:baseline;gap:10px;font-size:var(--t-aux)}
.shh .acts span{color:var(--faint)}
.lede{margin-top:6px;font-size:var(--t-aux);color:var(--mute)}
.books{margin-top:20px}
.book{display:flex;gap:18px;align-items:center;width:100%;padding:16px 0;border-top:1px solid var(--line);text-align:left}
.book:last-child{border-bottom:1px solid var(--line)}
/* 线装书封面：左侧订线、左上题签 */
.cv{position:relative;flex:none;width:72px;height:100px;border-radius:2px;background:var(--c,#2E3A44);box-shadow:inset -1px 0 0 rgba(0,0,0,.15)}
.cv::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.55) 0 4px,transparent 4px 18px)}
.cv .slip{position:absolute;left:16px;top:10px;width:20px;min-height:52px;padding:4px 0;background:#F1EEE6;border:1px solid rgba(0,0,0,.08);writing-mode:vertical-rl;font-family:var(--song);font-size:11px;line-height:20px;letter-spacing:.12em;color:#2A2A2A;text-align:center}
.cv .slip.long{font-size:9.5px;line-height:15px;letter-spacing:0;width:17px;left:15px;max-height:84px}
.bi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bi .t{font-family:var(--song);font-size:var(--t-key);font-weight:600;letter-spacing:.04em}
.bi .a{font-size:var(--t-aux);color:var(--mute)}
.bi .p{margin-top:4px;font-size:var(--t-aux);color:var(--ink2)}
.bi .p em{font-style:normal;color:var(--mute)}
.bi .f{font-size:var(--t-aux);color:var(--zhu);display:flex;align-items:center;gap:6px}
.bi .f::before{content:"";width:6px;height:6px;background:var(--zhu);transform:rotate(45deg)}
.cont{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;width:100%;margin-top:20px;padding:14px 16px;border-radius:6px;background:var(--paper2);text-align:left}
.cont .ck{grid-column:1/3;font-size:var(--t-tag);color:var(--mute);margin-bottom:10px}
.cont .ci{display:flex;flex-direction:column;gap:4px;min-width:0}
.cont .t{font-family:var(--song);font-size:var(--t-key);font-weight:600}.cont .p{font-size:var(--t-aux);color:var(--ink2)}
.cv.sm{width:44px;height:61px}.cv.sm::before{left:4px;top:6px;bottom:6px}.cv.sm .slip{left:10px;top:6px;width:14px;min-height:32px;font-size:8px;line-height:14px;padding:2px 0}.cv.sm .slip.long{font-size:7px;line-height:11px;width:13px;left:10px;max-height:50px}
.pbar{display:block;height:2px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:4px}.pbar i{display:block;height:2px;background:var(--ink)}
.shh{margin-top:28px}
.tools{position:relative;display:flex;align-items:center;margin-top:12px;height:32px}
.sortb{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-aux);color:var(--ink2)}
.menu{position:absolute;z-index:5;top:34px;left:0;min-width:128px;padding:4px;border-radius:8px;background:var(--sheet);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.menu button{display:block;width:100%;height:36px;padding:0 12px;text-align:left;font-size:var(--t-ui);border-radius:4px}
.menu button[aria-checked=true]{color:var(--dai)}.menu button[aria-checked=true]::after{content:"✓";float:right}
.lays{margin-left:auto;display:flex;align-items:center;gap:4px}
.lays button[data-lay]{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--faint)}
.lays button[data-lay][aria-pressed=true]{color:var(--ink);background:var(--paper2)}
.lays svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.lays .edit{margin-left:8px}
.etip{font-size:var(--t-aux);color:var(--mute)}
.books{margin-top:12px}
.books.lay-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px;padding-top:6px;align-items:start}
.gb .cv{overflow:hidden}
.gb{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.gb .cv{width:100%;height:auto;aspect-ratio:72/100}
.gb .cv::before{left:9%;top:8%;bottom:8%}
.gb .cv .slip{left:21%;top:8%;width:24%;min-height:46%;max-height:84%;font-size:12px;line-height:1.5;letter-spacing:.1em;padding:6px 0;overflow:hidden}
.gb .cv .slip.long{width:24%;left:21%;font-size:10px;line-height:1.35;letter-spacing:0;max-height:84%}
.gb .gt{width:100%;font-family:var(--song);font-size:var(--t-aux);line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb .pbar{width:100%;margin-top:-2px}
.gb .pnone{display:block;height:2px;margin-top:-2px}
.gb .gf{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--zhu);color:#F6F2EC;font-size:11px;line-height:18px;text-align:center}
.lb{display:flex;align-items:center;gap:12px;width:100%;height:48px;border-bottom:1px solid var(--line);text-align:left}
.lb:first-child{border-top:1px solid var(--line)}
.lb .lt{font-family:var(--song);font-size:var(--t-ui);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .la{font-size:var(--t-aux);color:var(--mute)}.lb .lp{width:36px;text-align:right;font-size:var(--t-aux);color:var(--ink2);font-variant-numeric:tabular-nums}
.lb .lf{width:18px;height:18px;border-radius:9px;background:var(--zhu);color:#F6F2EC;font-size:11px;line-height:18px;text-align:center}
.grip{display:flex;flex-direction:column;gap:3px;padding:6px;margin-left:8px;cursor:grab}.grip i{display:block;width:14px;height:1.5px;background:var(--faint);border-radius:1px}
.gb .grip{position:absolute;top:6px;right:6px;margin:0;background:var(--sheet);border-radius:4px}
.editing [data-t]{touch-action:none;cursor:grab}
.editing .gb .cv{animation:wig .32s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.drag{opacity:.85;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.lan .books.lay-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 16px}
.gb{min-width:0}
.lan .cont{display:none}
.lan .shelf{padding:12px calc(var(--safe-r) + 16px) calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px)}
.lan .books.lay-list{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.lan .books.lay-rows{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
@media (prefers-reduced-motion:reduce){.editing .gb .cv{animation:none}}
.lan .book:nth-last-child(2):nth-child(odd){border-bottom:1px solid var(--line)}

/* ---------- 三、阅读页 ---------- */
.rd{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.rd::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--safe-t);background:var(--paper)}
.bar{flex:none;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;height:48px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.bar .back{justify-self:start;font-size:var(--t-aux);color:var(--ink2)}
.bar .where{justify-self:center;text-align:center;font-family:var(--song);font-size:var(--t-ui);letter-spacing:.06em}
.bar .where small{display:block;font-family:var(--ui);font-size:10px;color:var(--faint);letter-spacing:0;margin-top:1px}
.bar .bm{justify-self:end;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.prog{height:2px;background:var(--line)}.prog i{display:block;height:2px;width:7%;background:var(--ink)}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.page{position:relative;padding:24px 40px 32px 24px}
.hui{margin:8px 0 24px;text-align:center}
.hui .n{font-size:var(--t-tag);color:var(--mute);letter-spacing:.3em}
.hui h2{margin-top:8px;font-family:var(--song);font-size:18px;font-weight:600;line-height:1.7;letter-spacing:.08em}
.para{position:relative;font-family:var(--song);font-size:var(--t-body);line-height:2;text-align:justify;text-indent:2em;margin-bottom:12px}
.para.poem{text-indent:0;padding-left:2em;line-height:2.1}
.pn{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px;text-decoration-thickness:1px}
.mine{background:linear-gradient(transparent 62%,var(--dai-soft) 62%);border-bottom:1px solid var(--dai)}
/* 页边批注（竖屏）：竖排楷体小字，朱 = 书里的伏笔，黛 = 自己的想法 */
.mg{position:absolute;right:-31px;width:22px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mg button{writing-mode:vertical-rl;font-family:var(--kai);font-size:13px;letter-spacing:.2em;line-height:1;padding:6px 3px;border-radius:2px}
.mg .z{color:var(--zhu);box-shadow:inset 0 0 0 1px var(--zhu-line)}
.mg .z.done{background:var(--zhu);color:#F6F2EC;box-shadow:none}
.mg .d{color:var(--dai);box-shadow:inset 0 0 0 1px rgba(47,74,140,.35)}
/* 底部导航：四个按钮保留，"伏笔"用朱色、带数字，分量最重 */
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);height:calc(56px + var(--safe-b));padding-bottom:var(--safe-b);border-top:1px solid var(--line);background:var(--paper)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:var(--t-nav);color:var(--mute);letter-spacing:.06em}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .fb{color:var(--zhu);position:relative}
.nav .fb svg{width:24px;height:24px;stroke-width:1.8}
.nav .fb .c{position:absolute;top:7px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--zhu);color:#F6F2EC;font-size:10px;line-height:16px;text-align:center}
/* 横屏：左边竖排导航，中间正文，右边批注栏 */
.lan .rd{flex-direction:row}
.lan .nav{order:-1;grid-template-columns:none;grid-template-rows:repeat(4,1fr);width:calc(56px + var(--safe-l));padding:0 0 var(--safe-b) var(--safe-l);height:auto;border-top:0;border-right:1px solid var(--line)}
.lan .main{padding-right:var(--safe-r)}
.lan .main{flex:1;min-width:0;display:flex;flex-direction:column}
.lan .bar{height:40px}
.lan .page{display:grid;grid-template-columns:minmax(0,1fr) 196px;column-gap:24px;padding:16px 20px 24px 28px}
.lan .page .txt{max-width:28em}
.lan .para{font-size:16px;line-height:1.95}
.lan .mg{display:none}
.side{display:none}
.lan .side{display:block;border-left:1px solid var(--line);padding-left:20px}
.side .ml{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.side .ml .h{display:flex;align-items:center;gap:8px;font-size:var(--t-tag);color:var(--mute)}
.side .ml .h .k{margin-left:auto}

.sq{display:flex;gap:5px;margin-top:10px}
.sq i{position:relative;width:14px;height:14px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}

/* ---------- 四、伏笔卡（弹层） ---------- */
.scrim{position:absolute;z-index:29;inset:0;background:rgba(30,38,34,.22);display:none}

.sh.on{transform:none}
.lan .sh{left:50%;right:auto;bottom:50%;width:480px;border-radius:14px;transform:translate(-50%,60%);opacity:0;transition:transform .28s,opacity .2s;max-height:88%}
.lan .sh.on{transform:translate(-50%,50%);opacity:1}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.lan .grab{display:none}
.shd{display:flex;align-items:center;gap:10px;padding:14px 20px 12px}
.shd .ttl{font-family:var(--song);font-size:17px;font-weight:600;letter-spacing:.1em}

.shb{padding:0 20px 8px;overflow-y:auto}
.mlrow{display:flex;align-items:flex-start;gap:8px;font-size:var(--t-aux);color:var(--mute);line-height:20px}.mlrow .seal{margin-top:0}
.src{margin-top:16px;font-family:var(--song);font-size:14px;line-height:1.9;color:var(--ink2)}
.src small{display:block;font-family:var(--ui);font-size:var(--t-tag);color:var(--faint);margin-bottom:2px}
.qq{margin-top:16px;padding-left:12px;border-left:2px solid var(--zhu);font-family:var(--song);font-size:18px;line-height:1.7;color:var(--ink)}
.hint{margin-top:16px;font-size:var(--t-aux);color:var(--mute);line-height:1.7}
.shf{display:flex;gap:12px;padding:12px 20px calc(var(--safe-b) + 12px);border-top:1px solid var(--line)}
.shf .btn:last-child{margin-left:auto}

/* ---------- v0.3：阅读页 ---------- */
/* 顶栏：上行章节名（宋体），下行书名 + 进度（小字）。用户 10-27 问显示书名还是章节名——章节名为主，书名小字保留 */
.bar .where{max-width:100%;overflow:hidden}
.bar .where{white-space:nowrap;text-overflow:ellipsis}
.bar .where small{white-space:nowrap}
.bar,.prog,.nav{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.rd.calm .bar,.rd.calm .prog{transform:translateY(-100%);opacity:0;pointer-events:none}
.rd.calm .nav{transform:translateY(100%);opacity:0;pointer-events:none}
.rd.calm .body{margin-top:-50px;margin-bottom:calc(-56px - var(--safe-b))}
.lan .rd.calm .nav{transform:translateX(-100%)}
.lan .rd.calm .body{margin-top:-42px;margin-bottom:0}
.lan .rd.calm .main{margin-left:calc(-56px - var(--safe-l))}
.body{transition:margin .28s cubic-bezier(.2,.8,.2,1)}
.lastline{display:flex;align-items:center;gap:12px;margin:4px 0 16px;color:var(--faint);font-size:var(--t-tag)}
.lastline::before,.lastline::after{content:"";flex:1;height:1px;background:var(--line)}
.hui{margin:16px 0 28px}
.hui .n{font-size:var(--t-tag);letter-spacing:.4em;margin-right:-.4em}
.toast{position:absolute;z-index:20;left:16px;right:16px;bottom:calc(56px + var(--safe-b) + 12px);display:flex;align-items:center;gap:12px;min-height:44px;padding:0 8px 0 16px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:var(--t-aux);transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast span{flex:1}.toast button{color:#E8C9A0;font-size:var(--t-aux);height:32px;padding:0 8px}.toast .tx{color:var(--paper);opacity:.6;font-size:16px}
.lan .toast{left:auto;right:calc(var(--safe-r) + 24px);width:320px;bottom:calc(var(--safe-b) + 16px)}
/* ---------- v0.3：面板 ---------- */
.shd .bk{margin-left:-8px;margin-right:2px;font-size:22px;color:var(--ink2)}
.shd .bk+.ttl{margin-left:0}
textarea{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font:inherit;font-family:var(--kai);font-size:16px;line-height:1.7;color:var(--ink);resize:none}
textarea::placeholder{font-family:var(--ui);font-size:var(--t-ui);color:var(--faint)}
.conf{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:var(--t-aux);color:var(--mute)}
.conf span{margin-right:4px}
.conf button{height:30px;padding:0 12px;border-radius:15px;box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-aux);color:var(--ink2)}
.conf button[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none}
.gv{margin-top:16px;padding:12px 14px;border-radius:6px;background:var(--paper2);font-family:var(--kai);font-size:15px;line-height:1.7;color:var(--ink)}
.gv span{display:block;font-family:var(--ui);font-size:var(--t-tag);color:var(--mute);margin-bottom:4px}
.seg{display:flex;gap:2px;margin:4px 0 16px;padding:2px;border-radius:8px;background:var(--paper2)}
.seg button{flex:1;height:32px;border-radius:6px;font-size:var(--t-aux);color:var(--mute)}
.seg button[aria-selected=true]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mainl{margin-bottom:16px;padding:14px 16px;border-radius:6px;background:var(--paper2)}
.mlh{display:flex;align-items:center;gap:8px;font-size:var(--t-tag);color:var(--mute)}.mlh .mlc{margin-left:auto}
.mlq{margin-top:8px;font-family:var(--kai);font-size:16px;line-height:1.7;color:var(--ink)}
.li{display:flex;flex-direction:column;gap:6px;width:100%;padding:14px 0;border-top:1px solid var(--line);text-align:left}
.lh{display:flex;align-items:center;gap:8px;font-size:var(--t-tag);color:var(--mute)}
.lq{padding-left:12px;border-left:2px solid var(--zhu);font-family:var(--kai);font-size:16px;line-height:1.7;color:var(--ink)}
.qq{font-family:var(--kai)}
.ni{padding:14px 0;border-top:1px solid var(--line)}
.ni .nh{display:block;font-size:var(--t-tag);color:var(--mute);margin-bottom:6px}
.ni .nq{font-family:var(--song);font-size:15px;line-height:1.8;color:var(--ink)}
.ni .nq.d{padding-left:12px;border-left:2px solid var(--dai)}
.ni .nt{margin-top:6px;font-family:var(--kai);font-size:15px;line-height:1.7;color:var(--dai)}
.cw{font-family:var(--song);font-size:17px;line-height:1.7;color:var(--ink)}
.ce{margin-top:12px;font-size:15px;line-height:1.8;color:var(--ink2)}
.cb{margin-top:16px;padding:12px 14px;border-radius:6px;background:var(--paper2);font-size:var(--t-aux);line-height:1.7;color:var(--ink2)}
.cb span{display:block;font-weight:600;font-size:var(--t-tag);color:var(--mute);margin-bottom:4px}
.shf .btn{height:40px}
.lan .sh{max-height:92%}

/* ---------- 对比：纸本、线索档案 ---------- */
.v-paper{--accent:#D9A92B}
.v-paper .mg button{writing-mode:horizontal-tb;width:14px;height:14px;padding:0;background:var(--accent);transform:rotate(45deg);border-radius:2px;box-shadow:none;font-size:0}
.v-paper .mg .d{background:var(--dai)}
.v-paper .dot{text-emphasis:none;-webkit-text-emphasis:none;background:linear-gradient(transparent 60%,rgba(217,169,43,.30) 60%)}
.v-paper .nav .fb{color:var(--mute)}
.v-paper .nav .fb .c{background:var(--accent);color:#1E2622}
.v-paper .pz{font-family:var(--ui);font-size:13px;color:var(--ink2);border-left-color:var(--accent)}
.v-paper .sq i.on{background:var(--accent)}.v-paper .sq i.found{box-shadow:inset 0 0 0 1.5px var(--accent)}.v-paper .sq i.found::before{background:var(--accent)}

.v-case{--paper:#E6E1D3;--paper2:#DAD3C0;--line:#C8BFA8;--case:#7A2E22}
.v-case .page{background:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(122,46,34,.08) 33px 34px)}
.v-case .mg button{writing-mode:horizontal-tb;font-family:var(--ui);font-size:10px;letter-spacing:0;padding:2px 3px;background:#F3EEDF;color:var(--case);box-shadow:0 1px 2px rgba(0,0,0,.15);transform:rotate(-4deg)}
.v-case .mg .d{color:var(--dai)}
.v-case .dot{text-emphasis:none;-webkit-text-emphasis:none;box-shadow:inset 0 -2px 0 var(--case)}
.v-case .nav .fb{color:var(--case)}.v-case .nav .fb .c{background:var(--case)}
.v-case .pz{font-family:var(--ui);font-size:12.5px;color:#3A2A20;background:#F3EEDF;border:0;padding:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:1px}
.v-case .pz small{color:var(--case);font-weight:600}
.v-case .sq i.on{background:var(--case)}.v-case .sq i.found{box-shadow:inset 0 0 0 1.5px var(--case)}.v-case .sq i.found::before{background:var(--case)}

@media (prefers-reduced-motion:reduce){.sh,.lan .sh{transition:none}}
</style>

<body>
<div class="ctl" role="toolbar" aria-label="样稿切换">
  <b>伏笔 · 界面样稿 v0.3</b>
  <div class="g" id="gPage"><span>页面</span><button data-p="auth">注册</button><button data-p="shelf">书架</button><button data-p="read">阅读</button><button data-p="clue">伏笔卡</button><button data-p="card">解释</button><button data-p="notes">笔记</button></div>
  <div class="g" id="gVar"><span>方向</span><button data-v="anno">批注本</button><button data-v="paper">纸本</button><button data-v="case">线索档案</button></div>
  <div class="g" id="gOr"><span>屏幕</span><button data-o="por">竖屏</button><button data-o="lan">横屏</button></div>
</div>
<div class="stage"><div class="dev por" id="dev"><div class="scr" id="scr"></div><div class="sbar" aria-hidden="true"><span>9:41</span><span class="isl"></span><span class="ic"><i></i><i></i></span></div><div class="notchl" aria-hidden="true"></div><div class="homeb" aria-hidden="true"></div></div></div>
<div class="note" id="note"></div>

<script>
const LOGO=c=>`<svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
  <clipPath id="u${c.slice(1)}"><rect width="40" height="25"/></clipPath><clipPath id="d${c.slice(1)}"><rect y="26.6" width="40" height="14"/></clipPath>
  <rect x="18.4" y="2.5" width="3.2" height="11" rx="1.2" fill="var(--ink)"/><rect x="17.2" y="12.6" width="5.6" height="2.4" rx=".8" fill="var(--ink)"/>
  <g clip-path="url(#u${c.slice(1)})"><path d="M17.4 15H22.6Q26 21 24.6 27.5Q23 33.5 20 38Q17 33.5 15.4 27.5Q14 21 17.4 15Z" fill="${c}"/></g>
  <g clip-path="url(#d${c.slice(1)})"><path d="M24.6 27.5Q23 33.5 20 38Q17 33.5 15.4 27.5" fill="none" stroke="${c}" stroke-width="1.4" stroke-dasharray="1.8 1.8" stroke-linecap="round"/></g>
  <path d="M5 25.8H35" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const I={
  toc:'<path d="M5 6h14M8 12h11M11 18h8M5 12h.01M5 18h.01"/>',
  clue:'<path d="M12 3.2l5.6 8.3H6.4z"/><path d="M3.5 11.5h17"/><path d="M8.4 15l3.6 5.3 3.6-5.3" stroke-dasharray="1.5 2.1"/>',
  note:'<path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4M8 9h8M8 13h5"/>',
  aa:'<path d="M3 18L8.5 5 14 18M5 13.5h7"/><path d="M15.5 12a2.5 2.5 0 0 1 5 0v6M20.5 15h-2.6c-1.5 0-2.4.8-2.4 1.6s.8 1.4 1.9 1.4c1.4 0 2.6-.9 3.1-2.2"/>',
  bm:'<path d="M7 4h10v16l-5-3.5L7 20z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
let st={p:'read',v:'anno',o:'por',sheet:false,chrome:true,panel:'clue',guess:''}; var render;
const accent=()=>st.v==='paper'?'#D9A92B':st.v==='case'?'#7A2E22':'#B23A2E';

/* ---------- 页面 ---------- */
function auth(){
  return `<div class="auth">
    <div class="left"><div class="hero">
      <div class="mark">${LOGO(accent())}<b>伏笔</b></div>
      <p class="tag">不是帮你读完，是让你想读下去。</p>
    </div></div>
    <div class="right"><div class="form">
      <div class="fld"><label for="a1">手机号或邮箱</label><input id="a1" inputmode="email" autocomplete="username"></div>
      <div class="fld"><label for="a2">密码</label><input id="a2" type="password" autocomplete="new-password" placeholder="6～20 位，含字母和数字"></div>
      <button class="btn wide go">注册</button>
      <p class="alt"><button class="link">已有账号，登录</button><span class="sep">·</span><button class="link">先体验</button></p>
    </div></div>
  </div>`;
}
let BOOKS=[
 {t:'红楼梦',a:'曹雪芹',c:'#3A2F3B',p:'读至第三回',pc:41,f:3,last:5,add:1},
 {t:'巴斯克维尔的猎犬',a:'柯南·道尔［英国］',c:'#34302A',p:'读至第二章',pc:12,f:2,last:4,add:5},
 {t:'呐喊',a:'鲁迅',c:'#5A2B24',p:'读至《故乡》',pc:62,f:1,last:3,add:3},
 {t:'逻辑哲学论',a:'维特根斯坦［奥地利］',c:'#2E3A44',p:'',pc:0,f:0,last:0,add:2},
 {t:'李鸿章传',a:'梁启超',c:'#2B3A33',p:'',pc:0,f:0,last:0,add:4},
 {t:'傲慢与偏见',a:'简·奥斯汀［英国］',c:'#47394A',p:'',pc:0,f:0,last:0,add:6},
 {t:'西游记',a:'吴承恩',c:'#3D3426',p:'读至第一回',pc:3,f:0,last:2,add:7},
 {t:'朝花夕拾',a:'鲁迅',c:'#2A3A3F',p:'',pc:0,f:0,last:0,add:8},
 {t:'瓦尔登湖',a:'亨利·梭罗［美国］',c:'#33402F',p:'',pc:0,f:0,last:1,add:9}];
let shv={lay:'grid',sort:'recent',edit:false,menu:false};
const SORTS=[['recent','最近阅读'],['added','加入时间'],['title','书名'],['manual','手动']];
function sortedBooks(){
  const b=BOOKS.slice();
  if(shv.sort==='recent') b.sort((x,y)=>y.last-x.last||y.add-x.add);
  if(shv.sort==='added') b.sort((x,y)=>y.add-x.add);
  if(shv.sort==='title') b.sort((x,y)=>x.t.localeCompare(y.t,'zh-Hans-CN'));
  return b;
}
const cover=(b,small)=>`<span class="cv ${small?'sm':''}" style="--c:${b.c}"><span class="slip ${b.t.length>5?'long':''}">${b.t}</span></span>`;
const prog=b=>b.pc?`<span class="pbar"><i style="width:${b.pc}%"></i></span>`:'';
function bookItem(b){
  const meta=b.p?`${b.p}　${b.pc}%`:'未读';
  const grip=shv.edit?`<span class="grip" aria-label="拖动调整顺序"><i></i><i></i><i></i></span>`:'';
  /* 书格：只有封面和书名，不放进度条、不放红色数字（用户 10-27：一排横线和红点会给人压力）。进度和未揭晓的伏笔在"列表"排列、书的详情里看 */
  if(shv.lay==='grid') return `<button class="gb" data-t="${b.t}" title="${b.t}">${cover(b)}<span class="gt">${b.t}</span>${grip}</button>`;
  if(shv.lay==='list') return `<button class="book" data-t="${b.t}">${cover(b)}<span class="bi"><span class="t">${b.t}</span><span class="a">${b.a}</span><span class="p">${meta}</span>${b.f?`<span class="f">${b.f} 处伏笔待揭晓</span>`:''}</span>${grip}</button>`;
  return `<button class="lb" data-t="${b.t}"><span class="lt">${b.t}</span><span class="la">${b.a.replace(/［.*］/,'')}</span><span class="lp">${b.pc?b.pc+'%':'未读'}</span>${grip}</button>`;
}
const LAYI={grid:'<path d="M4 4h6v7H4zM14 4h6v7h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',list:'<path d="M4 5h4v6H4zM11 6h9M11 9h6M4 14h4v6H4zM11 15h9M11 18h6"/>',rows:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
function shelf(){
  const cur=BOOKS.filter(b=>b.last).sort((x,y)=>y.last-x.last)[0];
  const list=sortedBooks();
  return `<div class="shelf ${shv.edit?'editing':''}">
    <div class="top">${LOGO(accent())}<b>伏笔</b><span class="me" aria-label="我的">读</span></div>
    ${cur&&!shv.edit?`<button class="cont"><span class="ck">继续阅读</span>${cover(cur,1)}<span class="ci"><span class="t">${cur.t}</span><span class="p">${cur.p}　${cur.pc}%</span>${prog(cur)}</span></button>`:''}
    <div class="shh"><h1>书架</h1>${shv.edit?`<div class="acts"><button class="link" id="eDone">完成</button></div>`:`<div class="acts"><button class="link">找书</button><span>·</span><button class="link">导入</button></div>`}</div>
    <div class="tools">
      ${shv.edit?`<span class="etip">拖动书籍调整顺序</span>`:`<button class="sortb" id="sortB" aria-haspopup="true" aria-expanded="${shv.menu}">${SORTS.find(x=>x[0]===shv.sort)[1]}<svg viewBox="0 0 12 12" width="10" height="10"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      ${shv.menu?`<div class="menu" role="menu">${SORTS.map(([k,l])=>`<button role="menuitemradio" aria-checked="${shv.sort===k}" data-sort="${k}">${l}</button>`).join('')}</div>`:''}`}
      <span class="lays">${shv.edit?'':Object.keys(LAYI).map(k=>`<button data-lay="${k}" aria-pressed="${shv.lay===k}" aria-label="${{grid:'书格',list:'列表',rows:'简表'}[k]}"><svg viewBox="0 0 24 24">${LAYI[k]}</svg></button>`).join('')}${shv.edit?'':`<button class="link edit" id="eBtn">整理</button>`}</span>
    </div>
    <div class="books lay-${shv.lay}" id="bookList">${list.map(bookItem).join('')}</div>
  </div>`;
}
function wireShelf(scr){
  scr.querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>{shv.lay=b.dataset.lay;render();});
  scr.querySelector('#sortB')?.addEventListener('click',()=>{shv.menu=!shv.menu;render();});
  scr.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{shv.sort=b.dataset.sort;shv.menu=false;render();});
  scr.querySelector('#eBtn')?.addEventListener('click',()=>{shv.edit=true;shv.menu=false;if(shv.sort!=='manual'){BOOKS=sortedBooks();}render();});
  scr.querySelector('#eDone')?.addEventListener('click',()=>{shv.edit=false;render();});
  if(!shv.edit) return;
  /* 拖动排序：按住书往上下（或左右）拖，松手落位；拖过之后排序自动变为"手动" */
  const box=scr.querySelector('#bookList'); let drag=null;
  box.querySelectorAll('[data-t]').forEach(el=>{
    el.addEventListener('pointerdown',e=>{ drag={el,t:el.dataset.t}; el.classList.add('drag'); el.setPointerCapture(e.pointerId); e.preventDefault(); });
